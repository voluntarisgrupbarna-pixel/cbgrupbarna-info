- id: quota-temporada
  pagina: /faq/
  pendent: >-
    El preu de la temporada per categoria. És la pregunta que més es fa i
    l'única resposta que hi ha avui és «cal contactar amb el club», mentre que
    sí que es publica que una setmana de campus val 195 € i un patrocini
    d'equip, 500 €.
  ca: {q: "Quant costa la temporada al CB Grup Barna?"}
  es: {q: "¿Cuánto cuesta la temporada en el CB Grup Barna?"}
  en: {q: "How much does a season at CB Grup Barna cost?"}

- id: quota-inclou
  pagina: /faq/
  pendent: "Què cobreix la quota: fitxa federativa, assegurança, equipació, pistes."
  ca: {q: "Què inclou la quota?"}
  es: {q: "¿Qué incluye la cuota?"}
  en: {q: "What does the fee cover?"}

- id: quota-pagament
  pagina: /faq/
  pendent: "Com es cobra: un sol pagament, mensual o trimestral, i si es domicilia."
  ca: {q: "Com es paga la quota?"}
  es: {q: "¿Cómo se paga la cuota?"}
  en: {q: "How is the fee paid?"}

- id: quota-germans
  pagina: /faq/
