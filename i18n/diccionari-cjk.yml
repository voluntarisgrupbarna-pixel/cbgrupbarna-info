# El mateix vocabulari que diccionari.yml, per al japonès (ja) i el coreà (ko).
#
# Va a part a posta: aquests dos idiomes només tenen les presentacions
# (/ja/presentations/, /ko/presentations/). La resta de pàgines no existeixen
# en ja/ko; per això scripts/i18n_chrome.py, quan un enllaç no té pàgina en ja
# o ko, el porta a la versió anglesa en comptes de deixar un 404. A mesura que
# es tradueixin més pàgines, els enllaços passen sols a la versió ja/ko.
#
# L'estructura (quins enllaços surten al menú i al peu) és la de l'anglès.

