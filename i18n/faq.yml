    r: Unes 150 nenes i nens al llarg de les sis setmanes de l'edició de 2026, en grups per
      edat i nivell i amb un límit aproximat de 50 places per setmana. Hi va haver participants
      del CB Grup Barna i d'altres clubs de Barcelona i de la província.
  es:
    q: ¿Cuánta gente pasó por el campus en verano de 2026?
    r: Unas 150 niñas y niños a lo largo de las seis semanas de la edición de 2026, en grupos
      por edad y nivel y con un límite aproximado de 50 plazas por semana. Hubo participantes
