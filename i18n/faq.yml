      El Clot, Distrito de Sant Martí. Es la pista principal del CB Grup Barna.
- id: campus-1
  pagina: /campus/
  ca:
    q: Quins entrenadors i jugadors han passat pel campus?
    r: 'Per les darreres edicions hi han passat Ainhoa López, jugadora professional i internacional
      espanyola formada al Clot; Robert Willet (@bballwillett), entrenador de tecnificació
      NBA; i Malak Shady, referent del bàsquet a xarxes i MVP de 3x3. No hi van de visita
      per a la foto: dirigeixen sessió a pista amb els jugadors i jugadores del campus.'
  es:
    q: ¿Qué entrenadores y jugadores han pasado por el campus?
    r: 'Por las últimas ediciones han pasado Ainhoa López, jugadora profesional e internacional
      española formada en El Clot; Robert Willet (@bballwillett), entrenador de tecnificación
      NBA; y Malak Shady, referente del baloncesto en redes y MVP de 3x3. No van de visita
      para la foto: dirigen sesión en pista con los jugadores y jugadoras del campus.'
  en:
    q: Which coaches and players have visited the camp?
    r: 'Recent editions have hosted Ainhoa López, a professional player and Spain international
      who trained in El Clot; Robert Willet (@bballwillett), an NBA skills trainer; and Malak
      Shady, a basketball creator and 3x3 MVP. They don''t drop in for a photo: they run sessions
      on court with the camp players.'
- id: campus-2
  pagina: /campus/
  ca:
