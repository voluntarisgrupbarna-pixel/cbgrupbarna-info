    q: Amb qui parlo de la categoria del meu fill?
  es:
    q: ¿Con quién hablo de la categoría de mi hijo?
  en:
    q: Who do I talk to about my child's age group?
- id: voluntariat
  pagina: /club/
  pendent: Com s'apunta algú que vol ser entrenador o voluntari, i què cal.
  ca:
    q: Com puc ser entrenador o voluntari al club?
  es:
    q: ¿Cómo puedo ser entrenador o voluntario en el club?
  en:
    q: How can I coach or volunteer at the club?
- id: 3x3-barcelona-1
  pagina: /3x3-barcelona/
  ca:
    q: Quin és el millor torneig de 3x3 a Barcelona?
    r: Depèn del que es busqui. Per a competició federada amb punts FIBA per al rànquing i
      estructura oficial arreu de Catalunya, el Circuit 3x3 FCBQ. Per a un festival urbà internacional
      amb altres esports olímpics, Extreme Barcelona al Parc del Fòrum. Per a un torneig de
      barri amb premi en metàl·lic paritari (1.000€ per al primer equip sènior femení i 1.000€
      per al masculí, únic a Barcelona) i punts FIBA a sènior, el 3x3 Westfield Glòries del
      CB Grup Barna al Clot-Glòries, que el 2026 va reunir 113 equips en tres seus.
  es:
    q: ¿Cuál es el mejor torneo de 3x3 en Barcelona?
    r: Depende de lo que se busque. Para competición federada con puntos FIBA para el ranking
      y estructura oficial en toda Cataluña, el Circuit 3x3 FCBQ. Para un festival urbano
      internacional con otros deportes olímpicos, Extreme Barcelona en el Parc del Fòrum.
      Para un torneo de barrio con premio en metálico paritario (1.000€ para el primer equipo
      sénior femenino y 1.000€ para el masculino, único en Barcelona) y puntos FIBA en sénior,
      el 3x3 Westfield Glòries del CB Grup Barna en El Clot-Glòries, que en 2026 reunió 113
      equipos en tres sedes.
  en:
    q: What is the best 3x3 basketball tournament in Barcelona?
    r: It depends what you are looking for. For federation competition with FIBA ranking points
      and official structure across Catalonia, the Circuit 3x3 FCBQ. For an international
      urban sports festival alongside other Olympic disciplines, Extreme Barcelona at Parc
      del Fòrum. For a neighbourhood tournament with an equal cash prize (€1,000 for the winning
      women's senior team and €1,000 for the men's, unique in Barcelona) and FIBA points at
      senior level, the CB Grup Barna's 3x3 Westfield Glòries in El Clot-Glòries, which brought
      together 113 teams across three venues in 2026.
- id: 3x3-barcelona-2
  pagina: /3x3-barcelona/
  ca:
    q: Hi ha torneigs de 3x3 amb punts FIBA a Barcelona?
    r: Sí. El Circuit 3x3 FCBQ reparteix punts per al rànquing FIBA 3x3 a les categories federades,
      i el 3x3 Westfield Glòries del CB Grup Barna també té oficialitat FIBA amb punts de
      rànquing mundial a les categories sènior des de la 3a edició (2026), amb seguiment a
      FIBA Play.
  es:
    q: ¿Hay torneos de 3x3 con puntos FIBA en Barcelona?
    r: Sí. El Circuit 3x3 FCBQ reparte puntos para el ranking FIBA 3x3 en las categorías federadas,
      y el 3x3 Westfield Glòries del CB Grup Barna también tiene oficialidad FIBA con puntos
      de ranking mundial en las categorías sénior desde la 3ª edición (2026), con seguimiento
      en FIBA Play.
  en:
    q: Are there 3x3 tournaments with FIBA points in Barcelona?
    r: Yes. The Circuit 3x3 FCBQ awards points for the FIBA 3x3 ranking in its federation
      categories, and CB Grup Barna's 3x3 Westfield Glòries also carries FIBA status with
      world ranking points at senior level since its 3rd edition (2026), tracked on FIBA Play.
- id: 3x3-barcelona-3
  pagina: /3x3-barcelona/
  ca:
    q: Té Barcelona parada del Circuito 3x3 CaixaBank?
    r: No. El Circuito 3x3 CaixaBank 2026, el festival de bàsquet urbà més gran d'Espanya
      amb 11 ciutats, no inclou Barcelona entre les seves parades d'aquesta edició.
  es:
    q: ¿Tiene Barcelona parada del Circuito 3x3 CaixaBank?
    r: No. El Circuito 3x3 CaixaBank 2026, el festival de baloncesto urbano más grande de
      España con 11 ciudades, no incluye Barcelona entre sus paradas de esta edición.
  en:
    q: Does Barcelona have a stop on the Circuito 3x3 CaixaBank?
    r: No. The Circuito 3x3 CaixaBank 2026, Spain's largest urban basketball festival with
      11 cities, does not include Barcelona among its stops this edition.
- id: 3x3-barcelona-4
  pagina: /3x3-barcelona/
  ca:
    q: Cal estar federat per jugar un 3x3 a Barcelona?
    r: No sempre. El Circuit 3x3 FCBQ és obert a totes les categories, de premini a sènior,
      sense necessitat de fitxa federada per participar. El 3x3 Westfield Glòries tampoc exigeix
      estar federat a les categories obertes; només als sèniors, on es reparteixen punts FIBA.
      Extreme Barcelona i Street Champion són oberts a qualsevol equip.
  es:
    q: ¿Hace falta estar federado para jugar un 3x3 en Barcelona?
    r: No siempre. El Circuit 3x3 FCBQ es abierto en todas las categorías, de premini a sénior,
      sin necesidad de ficha federada para participar. El 3x3 Westfield Glòries tampoco exige
      estar federado en las categorías abiertas; solo en sénior, donde se reparten puntos
      FIBA. Extreme Barcelona y Street Champion son abiertos a cualquier equipo.
  en:
    q: Do you have to be a federated player to play 3x3 in Barcelona?
    r: Not always. The Circuit 3x3 FCBQ is open across every category, from pre-mini to senior,
      with no federation licence required to take part. The 3x3 Westfield Glòries does not
      require one at its open categories either; only senior, where FIBA points are awarded.
      Extreme Barcelona and Street Champion are open to any team.
- id: 3x3-barcelona-5
  pagina: /3x3-barcelona/
  ca:
    q: On es juga el 3x3 Westfield Glòries?
    r: 'A tres seus del barri del Clot-Glòries a menys de 15 minuts a peu: Westfield Glòries,
      La Nau del Clot i la Rambleta del Clot. El torneig el organitzen el CB Grup Barna, Time
      Chamber i Eix Clot.'
  es:
    q: ¿Dónde se juega el 3x3 Westfield Glòries?
    r: 'En tres sedes del barrio de El Clot-Glòries a menos de 15 minutos a pie: Westfield
      Glòries, La Nau del Clot y la Rambleta del Clot. El torneo lo organizan el CB Grup Barna,
      Time Chamber y Eix Clot.'
  en:
    q: Where is the 3x3 Westfield Glòries played?
    r: 'Across three venues in the El Clot-Glòries neighbourhood, all within a 15-minute walk
      of each other: Westfield Glòries, La Nau del Clot and the Rambleta del Clot. The tournament
      is organised by CB Grup Barna, Time Chamber and Eix Clot.'
- id: barna-amb-dades-informe-1
  pagina: /blog/barna-amb-dades-informe/
  ca:
    q: Què conclou la investigació sobre per què els nens deixen el bàsquet?
    r: Que la diversió pesa dues vegades i mitja més que guanyar partits a l'hora que un infant
      continuï jugant, i que l'abandonament es concentra als 12-14 anys, en el trànsit d'infantil
      a cadet.
- id: barna-amb-dades-informe-2
  pagina: /blog/barna-amb-dades-informe/
  ca:
    q: Qui és el referent del model del CB Grup Barna?
    r: 'Marc Gasol, que va fundar una escola de bàsquet a Girona el 2014 i no va crear el
      primer equip sénior fins al 2017: tres anys de base abans d''un sol equip gran.'
- id: barna-amb-dades-informe-3
  pagina: /blog/barna-amb-dades-informe/
  ca:
    q: En quina posició queda el Barna entre els clubs de formació de Catalunya?
    r: 6è de 22 clubs formatius catalans i espanyols en seguidors d'Instagram, i 3r en estructura
      amb 32 equips federats — el primer club de formació de Barcelona ciutat.
- id: basquet-base-sant-marti-cl-1
  pagina: /blog/basquet-base-sant-marti-clot/
  ca:
    q: Què és el bàsquet base?
    r: És tot el bàsquet formatiu, des de l'escola d'iniciació fins a la categoria júnior.
      L'objectiu no és el resultat sinó formar jugadors i jugadores que segueixin jugant.
  es:
    q: ¿Qué es el baloncesto base?
    r: Es todo el baloncesto formativo, desde la escuela de iniciación hasta la categoría
      júnior. El objetivo no es el resultado sino formar jugadores y jugadoras que sigan jugando.
  en:
    q: What is youth basketball?
    r: It's all formative basketball, from the introductory school through to the junior category.
      The goal isn't results but developing players who keep playing.
- id: basquet-base-sant-marti-cl-2
  pagina: /blog/basquet-base-sant-marti-clot/
  ca:
    q: Quin club de bàsquet hi ha al barri del Clot?
    r: El CB Grup Barna, fundat el 1965, és el club de bàsquet base del Clot, al Districte
      de Sant Martí de Barcelona, amb més de 34 equips federats i unes 450 jugadores i jugadors.
  es:
    q: ¿Qué club de baloncesto hay en el barrio de El Clot?
    r: El CB Grup Barna, fundado en 1965, es el club de baloncesto base de El Clot, en el
      Distrito de Sant Martí de Barcelona, con más de 34 equipos y unas 450 jugadoras y jugadores.
  en:
    q: What basketball club is in the El Clot neighborhood?
    r: CB Grup Barna, founded in 1965, is the youth basketball club of El Clot, in the Sant
      Martí District of Barcelona, with more than 34 teams and around 450 players.
- id: basquet-base-sant-marti-cl-3
  pagina: /blog/basquet-base-sant-marti-clot/
  ca:
    q: Cal fitxa federativa per jugar a bàsquet base?
    r: Sí, per a la competició federada. La tramita el club davant la Federació Catalana de
      Basquetbol i inclou l'assegurança esportiva. A l'escola d'iniciació (4 a 8 anys) no
      cal.
  es:
    q: ¿Hace falta ficha federativa para jugar a baloncesto base?
    r: Sí, para la competición federada. La tramita el club ante la Federación Catalana de
      Baloncesto e incluye el seguro deportivo. En la escuela de iniciación (4 a 8 años) no
      hace falta.
  en:
    q: Do you need federation registration to play youth basketball?
    r: Yes, for federated competition. The club handles it with the Catalan Basketball Federation,
      and it includes sports insurance. At the introductory school (ages 4 to 8) it isn't
      required.
- id: basquet-base-sant-marti-cl-4
  pagina: /blog/basquet-base-sant-marti-clot/
  ca:
    q: Quan comença i acaba la temporada de bàsquet base?
    r: De setembre a juny. Es juga cada cap de setmana, alternant camp propi i camp contrari,
      dins de Barcelona i de la província.
  es:
    q: ¿Cuándo empieza y acaba la temporada de baloncesto base?
    r: De septiembre a junio. Se juega cada fin de semana, alternando campo propio y campo
      contrario, dentro de Barcelona y de la provincia.
  en:
    q: When does the youth basketball season start and end?
    r: From September to June. Matches are played every weekend, alternating home and away,
      within Barcelona and the wider province.
- id: basquet-femeni-barcelona-0-1
  pagina: /blog/basquet-femeni-barcelona-0-75-per-cent/
  ca:
    q: Quina és la taxa de conversió del bàsquet femení a Barcelona?
    r: El 0,75%. De les jugadores formades a la ciutat, menys d'una de cada cent arriba a
      competir en categories estatals, molt per sota de Girona (6,7%), Mataró (4%) o La Seu
      d'Urgell (12,5%).
- id: basquet-femeni-barcelona-0-2
  pagina: /blog/basquet-femeni-barcelona-0-75-per-cent/
  ca:
    q: Quants equips femenins de bàsquet hi ha a Barcelona?
    r: Al voltant de 134 equips formatius femenins, repartits entre 55 clubs federats de la
      ciutat.
- id: basquet-femeni-barcelona-0-3
  pagina: /blog/basquet-femeni-barcelona-0-75-per-cent/
  ca:
    q: Per què les jugadores de Barcelona han de marxar a altres ciutats?
    r: Perquè a Barcelona falta l'esglaó de la LF2. Quan una jugadora supera el nivell autonòmic
      no té on continuar a la ciutat i ha d'anar a Cornellà, Mataró o Girona.
- id: basquet-femeni-barcelona-0-4
  pagina: /blog/basquet-femeni-barcelona-0-75-per-cent/
  ca:
    q: Quin és el club amb més jugadores de bàsquet femení de Barcelona?
    r: 'El CB Grup Barna, amb 250 llicències femenines i un 6,61% de quota de la ciutat: una
      de cada quinze jugadores de bàsquet femení de Barcelona hi entrena.'
- id: basquet-femeni-barcelona-0-5
  pagina: /blog/basquet-femeni-barcelona-0-75-per-cent/
  ca:
    q: Cal més pressupost per millorar el bàsquet femení?
    r: No necessàriament. El CB Grup Barna funciona amb 140.000-160.000 € anuals i en destina
      el 50% al femení, quan la norma del sector ronda el 35%. La diferència està en la distribució,
      no en el volum.
- id: basquet-inclusiu-barna-mag-1
  pagina: /blog/basquet-inclusiu-barna-magics/
  ca:
    q: Què són els Barna Màgics?
    r: L'equip de bàsquet per a persones amb discapacitat intel·lectual del CB Grup Barna,
      integrat a l'estructura del club en igualtat de condicions amb la resta d'equips, en
      col·laboració amb la Fundació Mullor i ACELL.
- id: basquet-inclusiu-barna-mag-2
  pagina: /blog/basquet-inclusiu-barna-magics/
  ca:
    q: Cal experiència prèvia per jugar-hi?
    r: No. Hi ha jugadors i jugadores que hi arriben sense haver jugat mai. Com a la resta
      d'equips del club, el primer dia és de prova i sense compromís.
- id: basquet-inclusiu-barna-mag-3
  pagina: /blog/basquet-inclusiu-barna-magics/
  ca:
    q: On entrenen i competeixen?
    r: Entrenen a la Nau del Clot, la mateixa instal·lació que la resta d'equips del club,
      al Districte de Sant Martí de Barcelona, i competeixen dins del circuit d'esport adaptat
      d'ACELL.
- id: basquet-inclusiu-barna-mag-4
  pagina: /blog/basquet-inclusiu-barna-magics/
  ca:
    q: Què és el programa +BÀSQUET de la FCBQ?
    r: Un programa de la Federació Catalana de Basquetbol per estendre la pràctica del bàsquet
      al territori. El CB Grup Barna n'ha estat protagonista durant la temporada 2025-26.
- id: basquet-inclusiu-barna-mag-5
  pagina: /blog/basquet-inclusiu-barna-magics/
  ca:
    q: Com es pot apuntar algú a l'equip?
    r: Escrivint al WhatsApp del club (+34 698 425 153) o deixant el contacte al formulari
      del web. El club explica horaris, com funciona la fitxa i concerta un primer entrenament
      de prova.
- id: campus-basquet-barcelona-g-1
  pagina: /blog/campus-basquet-barcelona-guia/
  ca:
    q: Quina diferència hi ha entre un campus de lleure i un de tecnificació?
    r: Un campus de lleure combina bàsquet amb piscina, jocs i excursions i busca que el nen
      passi bé la setmana. Un campus de tecnificació dedica les hores a entrenar aspectes
      concrets del joc —tir, bot, un contra un— amb grups reduïts i correcció individual.
  es:
    q: ¿Qué diferencia hay entre un campus de ocio y uno de tecnificación?
    r: Un campus de ocio combina baloncesto con piscina, juegos y excursiones y busca que
      el niño pase bien la semana. Un campus de tecnificación dedica las horas a entrenar
      aspectos concretos del juego —tiro, bote, uno contra uno— con grupos reducidos y corrección
      individual.
  en:
    q: What's the difference between a leisure camp and a skills-development camp?
    r: A leisure camp combines basketball with swimming, games and outings, aiming for the
      child to have a good week. A skills-development camp spends its hours training specific
      parts of the game —shooting, dribbling, one-on-one— with smaller groups and individual
      correction.
- id: campus-basquet-barcelona-g-2
  pagina: /blog/campus-basquet-barcelona-guia/
  ca:
    q: Quantes places hauria de tenir un campus de bàsquet?
    r: 'El que importa no és el total sinó la ràtio: per sobre de dotze o catorze jugadors
      per entrenador ja no hi ha correcció individual possible. Els campus de tecnificació
      limiten les places per aquest motiu.'
  es:
    q: ¿Cuántas plazas debería tener un campus de baloncesto?
    r: 'Lo que importa no es el total sino la ratio: por encima de doce o catorce jugadores
      por entrenador ya no hay corrección individual posible. Los campus de tecnificación
      limitan las plazas por este motivo.'
  en:
    q: How many spots should a basketball camp have?
    r: 'What matters isn''t the total but the ratio: above twelve or fourteen players per
      coach, individual correction is no longer possible. Skills-development camps cap places
      for exactly this reason.'
- id: campus-basquet-barcelona-g-3
  pagina: /blog/campus-basquet-barcelona-guia/
  ca:
    q: Cal ser d'un club per anar a un campus de bàsquet?
    r: Als campus oberts, no. El campus del CB Grup Barna, per exemple, accepta jugadors i
      jugadores de qualsevol club de Barcelona i de la província.
  es:
    q: ¿Hay que ser de un club para ir a un campus de baloncesto?
    r: En los campus abiertos, no. El campus del CB Grup Barna, por ejemplo, acepta jugadores
      y jugadoras de cualquier club de Barcelona y de la provincia.
  en:
    q: Do you have to belong to a club to attend a basketball camp?
    r: Not at open camps. The CB Grup Barna camp, for example, accepts players from any club
      in Barcelona and the wider province.
- id: campus-basquet-barcelona-g-4
  pagina: /blog/campus-basquet-barcelona-guia/
  ca:
    q: On es fa el campus de bàsquet del CB Grup Barna?
    r: Al barri del Clot, Districte de Sant Martí de Barcelona. Es pot demanar informació
      i entrar a la llista d'avisos pel WhatsApp del club, al +34 698 425 153.
  es:
    q: ¿Dónde se hace el campus de baloncesto del CB Grup Barna?
    r: En el barrio de El Clot, Distrito de Sant Martí de Barcelona. Se puede pedir información
      y entrar en la lista de avisos por el WhatsApp del club, al +34 698 425 153.
  en:
    q: Where is the CB Grup Barna basketball camp held?
    r: In the El Clot neighborhood, Sant Martí District of Barcelona. You can ask for information
      and join the notification list via the club's WhatsApp, at +34 698 425 153.
- id: campus-time-chamber-2026-1
  pagina: /blog/campus-time-chamber-2026/
  ca:
    q: Quant costa el campus Time Chamber?
    r: 195€ la setmana completa (9h a 17h, amb àpat inclòs) i 160€ la mitja jornada (9h a
      13:30h). Es pot pagar en fins a 3 terminis.
- id: campus-time-chamber-2026-2
  pagina: /blog/campus-time-chamber-2026/
  ca:
    q: Quines setmanes té el campus?
    r: 'Sis: Flow Camp, TC Basics, Shooting Academy, One & One Mastery, Ballhandling Lab i
      Skills Lab Experience, cadascuna amb un focus tècnic diferent.'
- id: campus-time-chamber-2026-3
  pagina: /blog/campus-time-chamber-2026/
  ca:
    q: Cal ser del CB Grup Barna per apuntar-s'hi?
    r: No. El campus és obert a jugadors i jugadores de qualsevol club de Barcelona i de la
      província.
- id: club-basquet-segur-igualta-1
  pagina: /blog/club-basquet-segur-igualtat-families/
  ca:
    q: Un club de bàsquet ha de tenir pla d'igualtat?
    r: No totes les entitats hi estan obligades per volum, però tenir-lo aprovat per la junta,
      amb indicadors i revisió anual, és el senyal més clar que el compromís és real i no
      declaratiu.
- id: club-basquet-segur-igualta-2
  pagina: /blog/club-basquet-segur-igualtat-families/
  ca:
    q: Què és la LOPIVI i com afecta un club esportiu?
    r: És la llei de protecció integral a la infància i l'adolescència davant la violència.
      Obliga les entitats que treballen amb menors a tenir mesures de protecció i una figura
      de referència, i a comprovar els certificats de delictes sexuals del personal.
- id: club-basquet-segur-igualta-3
  pagina: /blog/club-basquet-segur-igualtat-families/
  ca:
    q: Què hauria de contenir un protocol contra l'assetjament?
    r: Definicions clares, mesures de prevenció, una persona de referència identificable,
      un canal de comunicació confidencial, terminis d'avaluació i resolució, mesures cautelars
      i garantia de no represàlia.
- id: club-basquet-segur-igualta-4
  pagina: /blog/club-basquet-segur-igualtat-families/
  ca:
    q: Per què és rellevant l'hora d'entrenament del sènior femení?
    r: Perquè quan les pistes són escasses revela qui té prioritat. Una franja de 21:30-23:00
      fa impossible que hi entrenin jugadores de 16 o 17 anys en període lectiu.
- id: club-basquet-segur-igualta-5
  pagina: /blog/club-basquet-segur-igualtat-families/
  ca:
    q: El CB Grup Barna té beques per a famílies?
    r: Sí. El club manté beques socials perquè cap nena o nen es quedi fora per motius econòmics.
      Es poden consultar escrivint al club sense compromís.
- id: club-formacio-i-competitiu-1
  pagina: /blog/club-formacio-i-competitiu-catalunya/
  ca:
    q: Quants equips té el CB Grup Barna?
    r: Més de 34 equips federats, de Pre-Mini a Sènior, amb estructura masculina i femenina
      i fins a tres nivells per categoria (A, B i Negre), segons la fitxa oficial del club
      a basquetcatala.cat.
  es:
    q: ¿Cuántos equipos tiene el CB Grup Barna?
    r: Más de 34 equipos, de Pre-Mini a Sénior, con estructura masculina y femenina y hasta
      tres niveles por categoría (A, B y Negre), según la ficha oficial del club en basquetcatala.cat.
  en:
    q: How many teams does CB Grup Barna have?
    r: Over 34+ teams, from Pre-Mini to Senior, with parallel boys' and girls' structures
      and up to three levels per category (A, B and Negre), according to the club's official
      record on basquetcatala.cat.
- id: club-formacio-i-competitiu-2
  pagina: /blog/club-formacio-i-competitiu-catalunya/
  ca:
    q: Què és la Súper Copa de la FCBQ?
    r: És la màxima categoria sènior territorial organitzada per la Federació Catalana de
      Bàsquet. El CB Grup Barna hi competeix amb els seus dos primers equips, masculí i femení,
      la temporada 2026-27.
  es:
    q: ¿Qué es la Súper Copa de la FCBQ?
    r: Es la máxima categoría sénior territorial organizada por la Federació Catalana de Bàsquet.
      El CB Grup Barna compite en ella con sus dos primeros equipos, masculino y femenino,
      la temporada 2026-27.
  en:
    q: What is the FCBQ Súper Copa?
    r: It's the top senior territorial category run by the Catalan Basketball Federation.
      CB Grup Barna competes in it with both its first teams, men's and women's, in the 2026-27
      season.
- id: club-formacio-i-competitiu-3
  pagina: /blog/club-formacio-i-competitiu-catalunya/
  ca:
    q: El Barna juga contra el Barça o la Penya?
    r: 'No amb els primers equips: el Barça juga a Lliga ACB i la Penya (Joventut Badalona)
      també, fora de les competicions territorials de la FCBQ. Amb categories de formació
      sí que es coincideix, dins del mateix mapa federatiu.'
  es:
    q: ¿El Barna juega contra el Barça o la Penya?
    r: 'No con los primeros equipos: el Barça juega en Liga ACB y la Penya (Joventut Badalona)
      también, fuera de las competiciones territoriales de la FCBQ. Con categorías de formación
      sí se coincide, dentro del mismo mapa federativo.'
  en:
    q: Does Barna play against Barça or Joventut?
    r: 'Not at first-team level: Barça play in Liga ACB and Joventut Badalona too, outside
      the FCBQ''s territorial competitions. In youth categories, paths do cross within the
      same federated framework.'
- id: club-formacio-i-competitiu-4
  pagina: /blog/club-formacio-i-competitiu-catalunya/
  ca:
    q: Què diferencia el Barna d'un club de barri petit?
    r: Tenir estructura completa, de Pre-Mini a Sènior, i un primer equip sènior propi en
      els dos gèneres competint a Súper Copa —una cosa que ni el Barça, ni la Penya ni Girona
      tenen dins de la mateixa entitat que la seva base.
  es:
    q: ¿Qué diferencia al Barna de un club de barrio pequeño?
    r: Tener estructura completa, de Pre-Mini a Sénior, y un primer equipo sénior propio en
      los dos géneros compitiendo en Súper Copa —algo que ni el Barça, ni la Penya ni Girona
      tienen dentro de la misma entidad que su cantera.
  en:
    q: What sets Barna apart from a small neighbourhood club?
    r: Having a complete structure, from Pre-Mini to Senior, and its own senior team in both
      genders competing in Súper Copa — something neither Barça, nor Joventut, nor Girona
      have within the same entity as their youth academy.
- id: entrenadores-basquet-barce-1
  pagina: /blog/entrenadores-basquet-barcelona/
  ca:
    q: Quantes entrenadores té el CB Grup Barna?
    r: 38 entrenadores actives, que representen el 65,5% de l'staff tècnic del club i entrenen
      38 equips cada setmana.
- id: entrenadores-basquet-barce-2
  pagina: /blog/entrenadores-basquet-barcelona/
  ca:
    q: Quin percentatge d'entrenadores hi ha al bàsquet en general?
    r: Les dones són el 35,7% de les llicències de jugadores, el 24,1% del personal en formació
      tècnica i només el 9% al Curs Superior d'entrenadora. A les presidències dels clubs
      de Barcelona analitzats, el 0%.
- id: entrenadores-basquet-barce-3
  pagina: /blog/entrenadores-basquet-barcelona/
  ca:
    q: Cal tenir titulació per entrenar en un club de base?
    r: La titulació federativa és el camí formal, però moltes entrenadores en actiu no la
      tenen pel cost i l'horari del curs. El Fons Barna 8M proposa finançar-la amb compromís
      de permanència al club.
- id: entrenadores-basquet-barce-4
  pagina: /blog/entrenadores-basquet-barcelona/
  ca:
    q: Què és el Fons Barna 8M?
    r: Una proposta del CB Grup Barna presentada a la Federació Catalana de Basquetbol el
      4 de març de 2026 per becar la titulació de les entrenadores en actiu i canviar el criteri
      d'accés als programes de mentoria.
- id: entrenadores-basquet-barce-5
  pagina: /blog/entrenadores-basquet-barcelona/
  ca:
    q: Per què importa que una dona entreni un equip masculí?
    r: Perquè normalitza l'autoritat esportiva femenina alhora per a les nenes, per als nens
      i per a les famílies. És l'exposició continuada, no la comunicació, la que canvia la
      percepció.
- id: equipacio-femenina-basquet-1
  pagina: /blog/equipacio-femenina-basquet/
  ca:
    q: Què vol dir «shrink it and pink it»?
    r: És el patró de la indústria esportiva que consisteix a agafar un producte dissenyat
      per a homes, reduir-ne la talla i, en el millor dels casos, canviar-ne el color per
      vendre'l com a femení.
- id: equipacio-femenina-basquet-2
  pagina: /blog/equipacio-femenina-basquet/
  ca:
    q: Per què no serveix una equipació masculina de talla petita?
    r: 'Perquè les diferències entre el cos masculí i el femení no són d''escala sinó estructurals:
      ràtio maluc-cintura, amplada d''espatlla i longitud del tors. Una S masculina no equival
      a una S femenina.'
- id: equipacio-femenina-basquet-3
  pagina: /blog/equipacio-femenina-basquet/
  ca:
    q: L'uniforme pot influir en l'abandonament esportiu?
    r: Sí. La recerca acadèmica recent documenta que la preocupació per l'aspecte físic a
      causa de l'uniforme és un tema recurrent entre adolescents que han deixat l'esport,
      i que la manca d'opció en el disseny és un factor significatiu.
- id: equipacio-femenina-basquet-4
  pagina: /blog/equipacio-femenina-basquet/
  ca:
    q: Per què és important el color del pantaló?
    r: Perquè un pantaló clar durant la menstruació genera ansietat per possibles taques en
      plena competició. El teixit fosc resol el problema sense cap cost afegit si es té en
      compte des del disseny.
- id: equipacio-femenina-basquet-5
  pagina: /blog/equipacio-femenina-basquet/
  ca:
    q: Què és la Línia Femenina del CB Grup Barna?
    r: La primera col·lecció d'equipació d'un club de base a Catalunya dissenyada des de zero
      per al cos femení, amb patrons nous, materials funcionals i cocreació amb les jugadores
      del club.
- id: fons-barna-8m-fcbq-1
  pagina: /blog/fons-barna-8m-fcbq/
  ca:
    q: Què demana exactament el Fons Barna 8M?
    r: Un fons de beques de la FCBQ per pagar el Curs de Tècnic Esportiu Nivell 0 a entrenadores
      en actiu sense carnet, amb cofinançament proposat del 30% club i 70% FCBQ, i el redisseny
      del Programa Mentoria d'Entrenadores perquè hi pugui accedir qui ja entrena, no només
      qui ja té titulació.
- id: fons-barna-8m-fcbq-2
  pagina: /blog/fons-barna-8m-fcbq/
  ca:
    q: Quantes entrenadores té el CB Grup Barna sense carnet federatiu?
    r: 38, el 65% de tot l'staff tècnic del club. Formen jugadores cada setmana i moltes dirigeixen
      equips masculins, però no apareixen a les estadístiques oficials de la FCBQ.
- id: fons-barna-8m-fcbq-3
  pagina: /blog/fons-barna-8m-fcbq/
  ca:
    q: Quan es va presentar la proposta?
    r: El 4 de març de 2026, amb motiu del Dia Internacional de la Dona, en una carta dirigida
      al president de la Federació Catalana de Basquetbol.
- id: nova-farmacia-clot-nou-par-1
  pagina: /blog/nova-farmacia-clot-nou-partner-barna/
  ca:
    q: Qui és Nova Farmàcia Clot?
    r: Nova Farmàcia Clot és una farmàcia de barri situada al Carrer del Clot 88, Barcelona,
      al mateix barri on juga el CB Grup Barna.
- id: nova-farmacia-clot-nou-par-2
  pagina: /blog/nova-farmacia-clot-nou-partner-barna/
  ca:
    q: Des de quan és partner del CB Grup Barna?
    r: Des de la temporada 2026/27, com a nova incorporació a l'ecosistema de patrocinadors
      i partners del club.
- id: nova-farmacia-clot-nou-par-3
  pagina: /blog/nova-farmacia-clot-nou-partner-barna/
  ca:
    q: On puc veure la fitxa de Nova Farmàcia Clot?
    r: A cbgrupbarna.info/patrocinadors/partners/nova-farmacia-clot/, dins del mural de partners
      de cbgrupbarna.info/patrocinadors/.
- id: patrocinadors-partners-cb--1
  pagina: /blog/patrocinadors-partners-cb-grup-barna/
  ca:
    q: Quants patrocinadors té el CB Grup Barna?
    r: El CB Grup Barna té 23 partners i patrocinadors actius amb fitxa pròpia a la temporada
      2026/27 —incloent Wilson, proveïdor oficial de bàsquetes— més diversos col·laboradors
      institucionals i de premsa (Ajuntament de Barcelona, Generalitat de Catalunya, mitjans
      del barri).
- id: patrocinadors-partners-cb--2
  pagina: /blog/patrocinadors-partners-cb-grup-barna/
  ca:
    q: Qui són els patrocinadors del CB Grup Barna?
    r: Entre els partners del CB Grup Barna hi ha Westfield Glòries, Time Chamber, Eix Clot,
      Herbolaris Montserrat, Clínica Dental Bac de Roda, Aquamiga, Armand Òptics, Manual Colors,
      La Melosa, Foto Jané, Mercat dels Encants, Tot Salut, Ovella Negra, Romeo Abogados,
      Fundació Mullor, Eix Comercial Sant Martí, GBK · Globasket, Illa Fantasia, Panteres
      Grogues, Stepback Podologia, Instax Fujifilm, Nova Farmàcia Clot i Wilson. La llista
      completa i actualitzada és a cbgrupbarna.info/patrocinadors/.
- id: patrocinadors-partners-cb--3
  pagina: /blog/patrocinadors-partners-cb-grup-barna/
  ca:
    q: Com es fa una empresa patrocinadora del CB Grup Barna?
    r: Escrivint per WhatsApp al +34 698 425 153 o per correu a marqueting@cbgrupbarna.info.
      El club prepara una proposta concreta segons l'objectiu de la marca, amb nivells des
      de 300 € l'any i col·laboració en espècie per a qui aporta producte o servei.
- id: patrocinadors-partners-cb--4
  pagina: /blog/patrocinadors-partners-cb-grup-barna/
  ca:
    q: On puc veure la fitxa de cada patrocinador del Barna?
    r: A cbgrupbarna.info/patrocinadors/ hi ha el mur amb tots els partners i, fent clic a
      cadascun, la fitxa individual amb l'empresa, l'oferta per a la família del Barna (si
      en té) i l'Instagram. El mapa amb ubicacions és a cbgrupbarna.info/partners-mapa/.
- id: patrocinar-club-basquet-ba-1
  pagina: /blog/patrocinar-club-basquet-barri/
  ca:
    q: Quants seguidors té el CB Grup Barna a Instagram?
    r: 5.382, amb un creixement del +92% en tres temporades — el primer club de bàsquet de
      barri de Barcelona en projecció digital.
- id: patrocinar-club-basquet-ba-2
  pagina: /blog/patrocinar-club-basquet-barri/
  ca:
    q: A qui arriba una marca que patrocina el Barna?
    r: 'Sobretot a pares i mares del barri d''entre 35 i 54 anys que viuen a Barcelona: el
      públic que decideix la compra, no els adolescents.'
- id: patrocinar-club-basquet-ba-3
  pagina: /blog/patrocinar-club-basquet-barri/
  ca:
    q: Quines maneres hi ha de col·laborar amb el club?
    r: Quatre nivells, de la presència digital senzilla al naming d'un event, més col·laboracions
      en espècie a mida de cada empresa.
- id: per-que-les-noies-deixen-e-1
  pagina: /blog/per-que-les-noies-deixen-el-basquet/
  ca:
    q: A quina edat deixen l'esport la majoria de noies?
    r: El punt crític se situa entre els 13 i els 16 anys. A 15-16 anys només el 8% de les
      noies compleix els mínims d'activitat física recomanats, davant del 23,2% dels nois.
- id: per-que-les-noies-deixen-e-2
  pagina: /blog/per-que-les-noies-deixen-el-basquet/
  ca:
    q: És veritat que deixar l'esport millora els resultats acadèmics?
    r: 'La recerca apunta al contrari: l''exercici físic regular millora la concentració,
      la memòria i el rendiment escolar. Retirar una adolescent de l''esport per estudiar
      més acostuma a ser contraproduent.'
- id: per-que-les-noies-deixen-e-3
  pagina: /blog/per-que-les-noies-deixen-el-basquet/
  ca:
    q: Què he de preguntar a un club per saber si retindrà la meva filla?
    r: 'Tres preguntes ho diuen gairebé tot: si hi ha equip femení a júnior i sènior, a quina
      hora entrena el sènior femení, i quantes entrenadores dones té el club.'
- id: per-que-les-noies-deixen-e-4
  pagina: /blog/per-que-les-noies-deixen-el-basquet/
  ca:
    q: Per què és important que hi hagi entrenadores dones?
    r: Perquè una nena que no veu mai cap dona a la banqueta rep el missatge implícit que
      dirigir no és per a ella. L'exposició continuada a entrenadores reverteix aquest biaix,
      tant en les nenes com en els nens i les famílies.
- id: per-que-les-noies-deixen-e-5
  pagina: /blog/per-que-les-noies-deixen-el-basquet/
  ca:
    q: El CB Grup Barna té equip femení a totes les categories?
    r: Sí. De l'Escoleta de 4 a 8 anys fins al sènior, passant per premini, mini, infantil,
      cadet i júnior. La temporada 2026-27 hi ha 8 equips femenins amb competició federada
      FCBQ.
- id: proteccio-menor-pla-igualt-1
  pagina: /blog/proteccio-menor-pla-igualtat/
  ca:
    q: El CB Grup Barna té pla d'igualtat?
    r: Sí. El Pla d'Igualtat 2026-2029, aprovat per la Junta Directiva l'abril de 2026, amb
      cinc eixos, indicadors de seguiment amb objectius per al 2028 i revisió anual.
- id: proteccio-menor-pla-igualt-2
  pagina: /blog/proteccio-menor-pla-igualtat/
  ca:
    q: Què vol dir que un club està adaptat a la LOPIVI?
    r: Que té protocol propi de protecció de la infància, una persona delegada de protecció
      al menor amb formació específica, un canal de comunicació confidencial i el certificat
      negatiu de delictes sexuals acreditat per tot el personal.
- id: proteccio-menor-pla-igualt-3
  pagina: /blog/proteccio-menor-pla-igualtat/
  ca:
    q: Tots els entrenadors tenen el certificat de delictes sexuals?
    r: Sí. Tot el personal del club —cos tècnic, delegats, voluntariat i junta directiva—
      acredita el certificat negatiu de delictes sexuals, com exigeix la llei per a qui treballa
      amb menors.
- id: proteccio-menor-pla-igualt-4
  pagina: /blog/proteccio-menor-pla-igualtat/
  ca:
    q: Com es comunica una situació d'assetjament al club?
    r: A la persona de referència en matèria d'igualtat, per via presencial, telefònica o
      electrònica. El protocol garanteix confidencialitat, una avaluació inicial en un màxim
      de 72 hores i resolució en un màxim de 15 dies.
- id: proteccio-menor-pla-igualt-5
  pagina: /blog/proteccio-menor-pla-igualtat/
  ca:
    q: Hi ha represàlies per denunciar?
    r: No. El protocol garanteix expressament la no represàlia contra qui comunica una situació,
      la confidencialitat de totes les persones implicades i el dret a acompanyament i suport
      emocional durant el procés.
- id: proteccio-menor-pla-igualt-6
  pagina: /blog/proteccio-menor-pla-igualtat/
  ca:
    q: Quins objectius d'igualtat té el club per al 2028?
    r: Passar del 65,5% al 70% d'staff tècnic femení, arribar a un mínim del 40% de dones
      a la junta directiva, aconseguir que 10 de les 38 entrenadores tinguin llicència federativa
      i mantenir la paritat d'equips 1:1 i el 50% d'inversió al femení.
- id: campus-basquet-barcelona-1
  pagina: /campus-basquet-barcelona/
  ca:
    q: Quin és el millor campus de bàsquet a Barcelona?
    r: 'No n''hi ha un de millor per a tothom: depèn de què busqui la família. Si el que es
      vol és marca i experiència de club gran, el referent és el Barça Escola a la Ciutat
      Esportiva Joan Gamper. Si el que es vol és alt rendiment amb allotjament, hi ha opcions
      residencials com Campus Gigantes o ITW Sport. Si el que es vol és tecnificació de veritat
      sense sortir de Barcelona ciutat, amb grups petits i preu de club de barri, el campus
      del CB Grup Barna amb Time Chamber al Clot treballa amb un límit aproximat de 50 places
      per setmana, cada setmana té un focus tècnic diferent i l''estiu de 2026 hi van passar
      unes 150 nenes i nens. Els criteris que decideixen són quatre: ràtio de jugadors per
      entrenador, com es fan els grups, si és tecnificació o lleure, i què inclou el preu.'
  es:
    q: ¿Cuál es el mejor campus de baloncesto en Barcelona?
    r: 'No hay uno mejor para todo el mundo: depende de lo que busque la familia. Si se busca
      marca y experiencia de club grande, el referente es el Barça Escola en la Ciudad Deportiva
      Joan Gamper. Si se busca alto rendimiento con alojamiento, existen opciones residenciales
      como Campus Gigantes o ITW Sport. Si se busca tecnificación real sin salir de Barcelona
      ciudad, con grupos pequeños y precio de club de barrio, el campus del CB Grup Barna
      con Time Chamber en El Clot trabaja con un límite aproximado de 50 plazas por semana,
      cada semana tiene un foco técnico distinto y en verano de 2026 pasaron unas 150 niñas
      y niños. Los criterios que deciden son cuatro: ratio de jugadores por entrenador, cómo
      se hacen los grupos, si es tecnificación o ocio, y qué incluye el precio.'
  en:
    q: What is the best basketball camp in Barcelona?
    r: 'There is no single best camp for everyone: it depends on what the family is looking
      for. For the brand and the big-club experience, the reference is Barça Escola at the
      Joan Gamper Sports City. For high performance with accommodation, there are residential
      options such as Campus Gigantes or ITW Sport. For real skills work without leaving the
      city of Barcelona, in small groups and at neighbourhood-club prices, the CB Grup Barna
      camp with Time Chamber in El Clot runs with a limit of roughly 50 places per week, a
      different technical focus each week, and around 150 girls and boys came through it in
      summer 2026. Four criteria decide it: players per coach, how groups are formed, whether
      it is skills work or recreation, and what the price includes.'
- id: campus-basquet-barcelona-2
  pagina: /campus-basquet-barcelona/
  ca:
    q: Quant costa un campus de bàsquet a Barcelona?
    r: Un campus urbà de jornada completa amb àpat es mou habitualment entre 150 i 250 euros
      per setmana; els campus residencials, amb allotjament i pensió completa, pugen a diversos
      centenars d'euros per setmana. Al CB Grup Barna la setmana completa de 9h a 17h amb
      àpat de migdia inclòs és de 195 euros, i la mitja jornada de 9h a 13:30h és de 160 euros.
      Convé comprovar sempre si el preu inclou àpat, acollida i equipació.
  es:
    q: ¿Cuánto cuesta un campus de baloncesto en Barcelona?
    r: Un campus urbano de jornada completa con comida suele moverse entre 150 y 250 euros
      por semana; los campus residenciales, con alojamiento y pensión completa, suben a varios
      cientos de euros por semana. En el CB Grup Barna la semana completa de 9h a 17h con
      comida incluida son 195 euros, y la media jornada de 9h a 13:30h son 160 euros. Conviene
      comprobar siempre si el precio incluye comida, acogida y equipación.
  en:
    q: How much does a basketball camp in Barcelona cost?
    r: A full-day city camp with lunch usually costs between 150 and 250 euros per week; residential
      camps, with accommodation and full board, run to several hundred euros per week. At
      CB Grup Barna the full week from 9am to 5pm with lunch included is 195 euros, and the
      half day from 9am to 1:30pm is 160 euros. Always check whether the price includes lunch,
      early drop-off and kit.
- id: campus-basquet-barcelona-3
  pagina: /campus-basquet-barcelona/
  ca:
    q: Quina diferència hi ha entre un campus de tecnificació i un casal amb pilota?
    r: 'Un campus de tecnificació dedica cada sessió a un aspecte concret del joc —tir, manejo
      de pilota, 1x1, lectura de joc— amb molta repetició i grups fets per edat i nivell.
      Un casal esportiu combina bàsquet amb piscina, jocs i excursions: està pensat per a
      la conciliació i per passar-ho bé, no per millorar tècnicament. Les dues coses són vàlides,
      però no s''han de comprar l''una per l''altra.'
  es:
    q: ¿Qué diferencia hay entre un campus de tecnificación y un casal con balón?
    r: 'Un campus de tecnificación dedica cada sesión a un aspecto concreto del juego —tiro,
      manejo de balón, 1x1, lectura de juego— con mucha repetición y grupos formados por edad
      y nivel. Un casal deportivo combina baloncesto con piscina, juegos y excursiones: está
      pensado para la conciliación y para pasarlo bien, no para mejorar técnicamente. Ambas
      cosas son válidas, pero no hay que comprar una esperando la otra.'
  en:
    q: What is the difference between a skills camp and a day camp with a ball?
    r: 'A skills camp devotes each session to one specific part of the game — shooting, ball
      handling, one-on-one, reading the game — with a high volume of repetitions and groups
      formed by age and level. A sports day camp mixes basketball with swimming, games and
      outings: it is designed for childcare over the holidays and for having fun, not for
      technical improvement. Both are valid, but you should not pay for one expecting the
      other.'
- id: campus-basquet-barcelona-4
  pagina: /campus-basquet-barcelona/
  ca:
    q: Hi ha campus de bàsquet a Barcelona a Nadal i Setmana Santa?
    r: Sí. A banda dels campus d'estiu, hi ha tecnificació en totes les vacances escolars.
      El CB Grup Barna fa sessions de tecnificació amb Time Chamber a Nadal i a Setmana Santa
      a La Nau del Clot, a més del campus d'estiu de sis setmanes.
  es:
    q: ¿Hay campus de baloncesto en Barcelona en Navidad y Semana Santa?
    r: Sí. Además de los campus de verano, hay tecnificación en todas las vacaciones escolares.
      El CB Grup Barna hace sesiones de tecnificación con Time Chamber en Navidad y en Semana
      Santa en La Nau del Clot, además del campus de verano de seis semanas.
  en:
    q: Are there basketball camps in Barcelona at Christmas and Easter?
    r: Yes. Beyond the summer camps, skills sessions run in every school holiday. CB Grup
      Barna runs skills work with Time Chamber at Christmas and Easter at La Nau del Clot,
      on top of the six-week summer camp.
- id: campus-basquet-barcelona-5
  pagina: /campus-basquet-barcelona/
  ca:
    q: A quina edat es pot anar a un campus de bàsquet?
    r: La franja habitual va dels 5-6 anys fins als 17. Els campus de tecnificació d'alt rendiment
      solen començar als 9-10 anys; els campus de club acullen també les edats d'escoleta
      amb un treball més adaptat. Al CB Grup Barna hi ha grups des de l'edat de l'Escoleta
      fins a cadet i júnior, sempre separats per edat i nivell.
  es:
    q: ¿A qué edad se puede ir a un campus de baloncesto?
    r: La franja habitual va de los 5-6 años hasta los 17. Los campus de tecnificación de
      alto rendimiento suelen empezar a los 9-10 años; los campus de club acogen también las
      edades de escuela con un trabajo más adaptado. En el CB Grup Barna hay grupos desde
      la edad de la Escoleta hasta cadete y júnior, siempre separados por edad y nivel.
  en:
    q: What ages are basketball camps for?
    r: The usual range is from 5-6 years old up to 17. High-performance skills camps normally
      start at 9-10; club camps also take the youngest ages with adapted work. At CB Grup
      Barna there are groups from Escoleta age up to cadet and junior, always split by age
      and level.
- id: campus-basquet-barcelona-6
  pagina: /campus-basquet-barcelona/
  ca:
    q: Cal jugar al club per apuntar-se al seu campus?
    r: 'Als campus oberts, no. El campus del CB Grup Barna admet jugadors i jugadores de qualsevol
      club de Barcelona i de la província: cada setmana hi ha places per a gent del Barna
      i places per a gent de fora.'
  es:
    q: ¿Hace falta jugar en el club para apuntarse a su campus?
    r: 'En los campus abiertos, no. El campus del CB Grup Barna admite jugadores y jugadoras
      de cualquier club de Barcelona y de la provincia: cada semana hay plazas para gente
      del Barna y plazas para gente de fuera.'
  en:
    q: Do you have to play for the club to join its camp?
    r: 'Not at open camps. The CB Grup Barna camp takes players from any club in Barcelona
      and the province: each week there are places for Barna players and places for players
      from outside.'
- id: campus-nadal-basquet-barce-1
  pagina: /campus-nadal-basquet-barcelona/
  ca:
    q: Hi ha campus de bàsquet a Barcelona per Nadal?
    r: Sí. El CB Grup Barna organitza tecnificació de bàsquet durant les vacances escolars
      de Nadal a La Nau del Clot, al Districte de Sant Martí de Barcelona, en format curt
      de pocs dies. És l'equivalent hivernal del campus d'estiu, per qui vol mantenir el to
      i treballar un aspecte concret enmig de la temporada.
  es:
    q: ¿Hay campus de baloncesto en Barcelona en Navidad?
    r: Sí. El CB Grup Barna organiza tecnificación de baloncesto durante las vacaciones escolares
      de Navidad en La Nau del Clot, en el Distrito de Sant Martí de Barcelona, en formato
      corto de pocos días. Es el equivalente invernal del campus de verano, para quien quiere
      mantener el tono y trabajar un aspecto concreto en mitad de la temporada.
- id: campus-nadal-basquet-barce-2
  pagina: /campus-nadal-basquet-barcelona/
  ca:
    q: Quan són les dates del campus de Nadal?
    r: Els dies feiners de les vacances escolars de Nadal. Les dates exactes i el preu de
