<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; overflow: hidden; }
  /* La página real, enmascarada bajo este dominio (Time Chamber) */
  iframe#tc {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: 0; display: block;
  }
  /* Fallback por si el navegador bloquea el iframe */
  .fallback {
    position: fixed; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; padding: 24px;
  }
  .fallback a {
    margin-top: 18px; background: #E31E24; color: #fff; text-decoration: none;
    font-weight: 800; padding: 14px 26px; border-radius: 50px;
  }
</style>
</head>
<body>
  <iframe id="tc" title="Time Chamber Basketball Academy · Programa Intensive Verano"
          src="https://cbgrupbarna.info/intensive/"
          allow="fullscreen"
          referrerpolicy="no-referrer-when-downgrade"></iframe>

  <div class="fallback" id="fb">
    <h1>Time Chamber Basketball Academy</h1>
    <p>Programa Intensive de Verano · Tecnificación de basket</p>
    <a href="https://cbgrupbarna.info/intensive/">Entrar</a>
  </div>

  <script>
    // Si el iframe no carga (bloqueado), mostramos el enlace de respaldo.
    var fired = false;
    var ifr = document.getElementById('tc');
    ifr.addEventListener('load', function () { fired = true; });
    setTimeout(function () {
      if (!fired) {
        ifr.style.display = 'none';
        document.getElementById('fb').style.display = 'flex';
      }
    }, 3500);
  </script>
</body>
</html>
