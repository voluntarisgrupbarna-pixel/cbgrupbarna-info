- id: cistella-petita-1
  pagina: /cistella-petita/
  ca:
    q: Què és la Cistella Petita?
    r: 'El festival de minibàsquet del CB Grup Barna i del barri, pensat perquè els infants
      de 3 a 8 anys visquin el seu gran dia com a jugadors: partits adaptats, jocs, medalles
      i famílies a la graderia.'
  es:
    q: ¿Qué es la Cistella Petita?
    r: 'El festival de minibasket del CB Grup Barna y del barrio, pensado para que los niños
      y niñas de 3 a 8 años vivan su gran día como jugadores: partidos adaptados, juegos,
      medallas y familias en la grada.'
  en:
    q: What is Cistella Petita?
    r: 'CB Grup Barna''s mini-basketball festival for the neighbourhood, built so that children
      aged 3 to 8 get their big day as players: adapted games, play, medals and families in
      the stands.'
- id: cistella-petita-2
  pagina: /cistella-petita/
  ca:
    q: Qui hi pot participar?
    r: Infants de 3 a 8 anys, siguin o no de l'Escoleta del club. És sovint el primer contacte
      de moltes criatures amb el bàsquet i amb el CB Grup Barna.
  es:
    q: ¿Quién puede participar?
    r: Niños y niñas de 3 a 8 años, sean o no de la Escoleta del club. Es a menudo el primer
      contacto de muchas criaturas con el baloncesto y con el CB Grup Barna.
  en:
    q: Who can take part?
    r: Children aged 3 to 8, whether or not they are in the club's Escoleta. For many of them
      it is the first contact with basketball and with CB Grup Barna.
- id: cistella-petita-3
  pagina: /cistella-petita/
