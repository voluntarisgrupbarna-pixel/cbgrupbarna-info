- id: patrocinadors-2
  pagina: /patrocinadors/
  ca:
    q: Quants patrocinadors i partners té el CB Grup Barna?
    r: 23 partners i patrocinadors actius amb fitxa pròpia a la temporada 2026/27 —incloent
      Wilson, proveïdor oficial de bàsquetes— més diversos col·laboradors institucionals i
      de premsa (Ajuntament de Barcelona, Generalitat de Catalunya, mitjans del barri).
  es:
    q: ¿Cuántos patrocinadores y partners tiene el CB Grup Barna?
    r: 23 partners y patrocinadores activos con ficha propia en la temporada 2026/27 —incluyendo
      Wilson, proveedor oficial de balones— más varios colaboradores institucionales y de
      prensa (Ajuntament de Barcelona, Generalitat de Catalunya, medios del barrio).
  en:
    q: How many sponsors and partners does CB Grup Barna have?
    r: 23 active partners and sponsors with their own pages in the 2026/27 season — including
      Wilson, the official ball supplier — plus several institutional and press collaborators
      (Ajuntament de Barcelona, Generalitat de Catalunya, local media).
- id: patrocinadors-3
  pagina: /patrocinadors/
  ca:
    q: Quin tipus d'empreses patrocinen el CB Grup Barna?
    r: Sobretot comerç i entitats del barri del Clot i Sant Martí, salut i benestar (òptica,
      clínica dental, podologia, herbolari, farmàcia), oci i turisme (centre comercial, parc
      aquàtic), serveis professionals (advocats, impremta) i entitats esportives o socials
      que col·laboren amb el club.
  es:
    q: ¿Qué tipo de empresas patrocinan al CB Grup Barna?
    r: Sobre todo comercio y entidades del barrio de El Clot y Sant Martí, salud y bienestar
      (óptica, clínica dental, podología, herbolario, farmacia), ocio y turismo (centro comercial,
      parque acuático), servicios profesionales (abogados, imprenta) y entidades deportivas
      o sociales que colaboran con el club.
  en:
    q: What kind of companies sponsor CB Grup Barna?
    r: Mostly shops and organisations from El Clot and Sant Martí, health and wellbeing (opticians,
      dental clinic, podiatry, herbalist, pharmacy), leisure and tourism (shopping centre,
      water park), professional services (solicitors, printers) and sporting or social organisations
      that work with the club.
- id: patrocinadors-4
  pagina: /patrocinadors/
  ca:
    q: On puc veure la fitxa de cada patrocinador del Barna?
    r: 'Al mural de partners d''aquesta pàgina: cada logo enllaça a la fitxa individual de
      l''empresa, amb la seva activitat, l''oferta per a la família del Barna (si en té) i
      el seu Instagram. També hi ha un mapa geolocalitzat a cbgrupbarna.info/partners-mapa/.'
  es:
    q: ¿Dónde puedo ver la ficha de cada patrocinador del Barna?
    r: 'En el mural de partners de esta página: cada logo enlaza a la ficha individual de
      la empresa, con su actividad, la oferta para la familia del Barna (si la tiene) y su
      Instagram. También hay un mapa geolocalizado en cbgrupbarna.info/partners-mapa/.'
  en:
    q: Where can I see each Barna sponsor's page?
    r: 'On the partner wall on this page: every logo links to that company''s own page, with
      what they do, any offer for Barna families, and their Instagram. There is also a map
      at cbgrupbarna.info/partners-mapa/.'
- id: patrocinadors-5
  pagina: /patrocinadors/
  ca:
    q: Com em faig patrocinador o partner del CB Grup Barna?
    r: Escriu-nos per WhatsApp (+34 698 425 153) o envia un correu a marqueting@cbgrupbarna.info.
      Preparem una proposta concreta segons el que vulgui aconseguir la teva marca, sense
      packs de farciment ni promeses impossibles de mesurar.
  es:
    q: ¿Cómo me hago patrocinador o partner del CB Grup Barna?
    r: Escribe por WhatsApp (+34 698 425 153) o envía un correo a marqueting@cbgrupbarna.info.
      Preparamos una propuesta concreta según lo que quiera conseguir tu marca, sin packs
      de relleno ni promesas imposibles de medir.
  en:
    q: How do I become a sponsor or partner of CB Grup Barna?
    r: Write to us on WhatsApp (+34 698 425 153) or send an email to marqueting@cbgrupbarna.info.
      We prepare a concrete proposal based on what your brand wants to achieve, with no filler
      packages or impossible-to-measure promises.
- id: patrocinadors-6
  pagina: /patrocinadors/
  ca:
    q: Quines formes de col·laborar hi ha?
    r: Tres punts de partida transparents —Presència digital, Marca en moviment i Patrocini
      esportiu— més la col·laboració a mida per a marques que volen un objectiu i uns entregables
      molt concrets.
  es:
    q: ¿Qué formas de colaborar hay?
    r: Tres puntos de partida transparentes —Presencia digital, Marca en movimiento y Patrocinio
      deportivo— más la colaboración a medida para marcas que quieren un objetivo y unos entregables
      muy concretos.
  en:
    q: What ways are there to collaborate?
    r: Three transparent starting points — Digital Presence, Brand in Motion and Sports Sponsorship
      — plus tailor-made collaboration for brands that want a clear goal and very specific
      deliverables.
- id: patrocinadors-7
  pagina: /patrocinadors/
  ca:
    q: Puc col·laborar amb producte o servei en comptes de diners?
    r: 'Sí. Moltes col·laboracions del club són en espècie: material esportiu, transport,
      fisioteràpia, càtering d''esdeveniments o impremta. Es valoren igual que una aportació
      econòmica i s''adapten a un nivell de contraprestació equivalent.'
  es:
    q: ¿Puedo colaborar con producto o servicio en vez de dinero?
    r: 'Sí. Muchas colaboraciones del club son en especie: material deportivo, transporte,
      fisioterapia, catering de eventos o imprenta. Se valoran igual que una aportación económica
      y se adaptan a un nivel de contraprestación equivalente.'
  en:
    q: Can I collaborate with a product or service instead of money?
    r: 'Yes. Many of the club''s collaborations are in kind: sports equipment, transport,
      physiotherapy, event catering or printing. They are valued the same as a monetary contribution
      and matched to an equivalent collaboration tier.'
- id: patrocinadors-8
  pagina: /patrocinadors/
  ca:
    q: Què rep la meva empresa a canvi?
    r: Contingut amb context (no un logo aïllat), presència física a La Nau, equipacions,
      torneigs i campus, accés a una comunitat de més de 450 famílies i una proposta a mida
      amb entregables concrets per a cada marca.
  es:
    q: ¿Qué recibe mi empresa a cambio?
    r: Contenido con contexto (no un logo aislado), presencia física en La Nau, equipaciones,
      torneos y campus, acceso a una comunidad de más de 450 familias y una propuesta a medida
      con entregables concretos para cada marca.
  en:
    q: What does my company get in return?
    r: Content with context (not an isolated logo), physical presence at La Nau, kits, tournaments
      and camps, access to a community of more than 450 families, and a tailor-made proposal
      with specific deliverables for each brand.
- id: patrocinadors-9
  pagina: /patrocinadors/
  ca:
    q: Producció de lones o material específic inclosa?
    r: 'No, llevat d''acord exprés: es pressuposta a part segons el que necessiti l''activació.'
  es:
    q: ¿Producción de lonas o material específico incluida?
    r: 'No, salvo acuerdo expreso: se presupuesta aparte según lo que necesite la activación.'
  en:
    q: Is banner or specific material production included?
    r: 'No, unless expressly agreed: it is quoted separately depending on what the activation
      needs.'
- id: femeni-equips
  pagina: /femeni/
  ca:
    q: Quants equips femenins té el CB Grup Barna?
    r: La temporada 2026-27 el club té 8 equips femenins amb competició federada FCBQ, des
      d'Infantil fins a Sènior, més els grups d'Escoleta i l'equip d'esport adaptat Barna
      Màgics. El Sènior Femení A competeix a la Super Copa Femenina.
  es:
    q: ¿Cuántos equipos femeninos tiene el CB Grup Barna?
    r: En la temporada 2026-27 el club tiene 8 equipos femeninos con competición federada
      FCBQ, desde Infantil hasta Sénior, más los grupos de Escoleta y el equipo de deporte
      adaptado Barna Màgics. El Sénior Femenino A compite en la Super Copa Femenina.
  en:
    q: How many women's teams does CB Grup Barna have?
    r: In the 2026-27 season the club has 8 women's teams in FCBQ league competition, from
      Infantil up to senior, plus the Escoleta groups and the Barna Màgics adapted-sport team.
      Senior Femení A plays in the Super Copa Femenina.
- id: femeni-pressupost
  pagina: /femeni/
  ca:
    q: Quina part del pressupost destina el club al bàsquet femení?
    r: El 50% del pressupost total. La mitjana del sector és del 35%. És el primer dels tres
      pilars del Mètode Barna.
  es:
    q: ¿Qué parte del presupuesto destina el club al baloncesto femenino?
    r: El 50% del presupuesto total. La media del sector es del 35%. Es el primero de los
      tres pilares del Método Barna.
  en:
    q: How much of the club's budget goes to women's basketball?
    r: 50% of the total budget. The sector average is 35%. It is the first of the three pillars
      of the Barna Method.
- id: femeni-sense-experiencia
  pagina: /femeni/
  ca:
    q: Una nena pot començar a jugar a bàsquet sense experiència?
    r: Sí. L'Escoleta acull nenes i nens de 4 a 8 anys sense cap experiència prèvia, i a les
      categories de formació s'entra durant tot el curs si hi ha plaça. El club manté beques
      socials perquè cap família es quedi fora per motius econòmics.
  es:
    q: ¿Una niña puede empezar a jugar a baloncesto sin experiencia?
    r: Sí. La Escoleta acoge a niñas y niños de 4 a 8 años sin ninguna experiencia previa,
      y en las categorías de formación se entra durante todo el curso si hay plaza. El club
      mantiene becas sociales para que ninguna familia se quede fuera por motivos económicos.
  en:
    q: Can a girl start playing basketball with no experience?
    r: Yes. The Escoleta takes girls and boys aged 4 to 8 with no previous experience at all,
      and you can join the development age groups at any point in the season if there is a
      place. The club keeps hardship bursaries so that no family is left out for financial
      reasons.
- id: femeni-entrenadores
  pagina: /femeni/
  ca:
    q: Qui entrena els equips femenins del Grup Barna?
    r: El club té 38 entrenadores actives, el 65,5% de l'staff tècnic. Moltes són exjugadores
      formades a casa, i entrenen equips femenins, mixtos i també masculins.
  es:
    q: ¿Quién entrena los equipos femeninos del Grup Barna?
    r: El club tiene 38 entrenadoras activas, el 65,5% del staff técnico. Muchas son exjugadoras
      formadas en casa, y entrenan equipos femeninos, mixtos y también masculinos.
  en:
    q: Who coaches the Grup Barna women's teams?
    r: The club has 38 active female coaches, 65.5% of the coaching staff. Many are former
      players who came up through the club, and they coach women's, mixed and men's teams
      alike.
- id: femeni-on-entrena
  pagina: /femeni/
  ca:
    q: On entrena el bàsquet femení del CB Grup Barna?
    r: A La Nau del Clot, C/ Llacuna 170-172, Parc del Clot, 08018 Barcelona, al Districte
      de Sant Martí.
  es:
    q: ¿Dónde entrena el baloncesto femenino del CB Grup Barna?
    r: En La Nau del Clot, C/ Llacuna 170-172, Parc del Clot, 08018 Barcelona, en el Distrito
      de Sant Martí.
  en:
    q: Where does CB Grup Barna women's basketball train?
    r: At La Nau del Clot, C/ Llacuna 170-172, Parc del Clot, 08018 Barcelona, in the Sant
      Martí district.
- id: femeni-te-equip
  pagina: /femeni/
  ca:
    q: El CB Grup Barna té equip femení de bàsquet?
    r: 'Sí. El bàsquet femení és una de les dues línies del club, amb el mateix pressupost
      i la mateixa prioritat que la masculina: més de 200 jugadores en competició, des de
      l''Escoleta fins al Sènior A, que competeix a la Super Copa Femenina FCBQ.'
  es:
    q: ¿Tiene el CB Grup Barna equipo femenino de baloncesto?
    r: 'Sí. El baloncesto femenino es una de las dos líneas del club, con el mismo presupuesto
      y la misma prioridad que la masculina: más de 200 jugadoras en competición, desde la
      Escoleta hasta el Sénior A, que compite en la Super Copa Femenina FCBQ.'
  en:
    q: Does CB Grup Barna have a women's basketball team?
    r: 'Yes. Women''s basketball is one of the club''s two lines, with the same budget and
      the same priority as the men''s: over 200 players in competition, from the Escoleta
      up to Senior A, which competes in the Super Copa Femenina FCBQ.'
- id: femeni-metode
  pagina: /femeni/
  ca:
    q: Què és el Mètode Barna?
    r: És el model propi de tecnificació femenina del club, amb recerca pròpia sobre la bretxa
      de gènere al bàsquet de Barcelona i de Catalunya. Ha estat finalista del Premi Dona
      i Esport en dues edicions consecutives.
  es:
    q: ¿Qué es el Método Barna?
    r: Es el modelo propio de tecnificación femenina del club, con investigación propia sobre
      la brecha de género en el baloncesto de Barcelona y Cataluña. Ha sido finalista del
      Premi Dona i Esport en dos ediciones consecutivas.
  en:
    q: What is the Barna Method?
    r: It's the club's own model for women's player development, built on in-house research
      into the gender gap in Barcelona and Catalan basketball. It has been a finalist for
      the Premi Dona i Esport award two years running.
- id: femeni-edat
  pagina: /femeni/
  ca:
    q: A quina edat pot començar una nena a jugar a bàsquet al Barna?
    r: Als 4 anys, a l'Escoleta, en grups mixtos. La competició federada femenina comença
      a premini (8-9 anys) i continua fins al Sènior.
  es:
    q: ¿A qué edad puede empezar una niña a jugar a baloncesto en el Barna?
    r: A los 4 años, en la Escoleta, en grupos mixtos. La competición federada femenina empieza
      en premini (8-9 años) y continúa hasta el Sénior.
  en:
    q: At what age can a girl start playing basketball at Barna?
    r: At 4 years old, in the Escoleta, in mixed groups. Federated women's competition starts
      at premini (age 8-9) and continues through to Senior.
- id: faq-1
  pagina: /faq/
  ca:
    q: Què és el CB Grup Barna?
    r: Un club de bàsquet formatiu del Clot, Barcelona, fundat el 1965, amb més de 34 equips,
      estructura masculina i femenina, Escoleta, equips sèniors a Super Copa FCBQ i esport
      adaptat.
  es:
    q: ¿Qué es el CB Grup Barna?
    r: Un club de baloncesto formativo del Clot, Barcelona, fundado en 1965, con más de 34
      equipos, estructura masculina y femenina, Escoleta, equipos séniors en Super Copa FCBQ
      y deporte adaptado.
  en:
    q: What is CB Grup Barna?
    r: A development basketball club from El Clot, Barcelona, founded in 1965, with more than
      34 teams, boys' and girls' structures, an Escoleta, senior teams in the Super Copa FCBQ
      and adapted sport.
- id: faq-2
  pagina: /faq/
  ca:
    q: Com m'apunto al CB Grup Barna?
    r: Deixant les dades al formulari d'informació de la portada o escrivint pel WhatsApp
      del club. Per a infants de 4 a 8 anys, la porta d'entrada sol ser l'Escoleta.
  es:
    q: ¿Cómo me apunto al CB Grup Barna?
    r: Dejando los datos en el formulario de información de la portada o escribiendo por el
      WhatsApp del club. Para niños y niñas de 4 a 8 años, la puerta de entrada suele ser
      la Escoleta.
  en:
    q: How do I join CB Grup Barna?
    r: Leave your details in the information form on the home page, or write to the club on
      WhatsApp. For children aged 4 to 8, the way in is usually the Escoleta.
- id: faq-3
  pagina: /faq/
  ca:
    q: On entrena i juga el CB Grup Barna?
    r: La seu principal és la Nau del Clot, al carrer de la Llacuna, Districte de Sant Martí.
      El club també fa servir cinc pistes més del barri, segons l'equip i l'horari.
  es:
    q: ¿Dónde entrena y juega el CB Grup Barna?
    r: La sede principal es La Nau del Clot, en la calle de la Llacuna, Distrito de Sant Martí.
      El club usa también otras cinco pistas del barrio, según el equipo y el horario.
  en:
    q: Where does CB Grup Barna train and play?
    r: The main venue is La Nau del Clot, on carrer de la Llacuna, in the Sant Martí district.
      The club also uses five other courts in the neighbourhood, depending on the team and
      the time.
- id: faq-4
  pagina: /faq/
  ca:
    q: Quant costa apuntar-se al club una temporada?
    r: 'La quota va per franges d''edat i per categoria: l''Escoleta, els equips federats
      i el campus tenen preus diferents, i dins dels federats també varia segons la categoria.
      No publiquem la taula de preus al web, però te la donem de seguida: escriu-nos al WhatsApp
      +34 698 425 153 o a marqueting@cbgrupbarna.info amb l''any de naixement i et diem la
      quota exacta que li tocaria, el mateix dia. Abans de decidir res, el primer entrenament
      és de prova i gratuït, i el club manté beques socials perquè cap infant es quedi fora
      per motius econòmics.'
  es:
    q: ¿Cuánto cuesta apuntarse al club una temporada?
    r: 'La cuota va por franjas de edad y por categoría: la Escoleta, los equipos federados
      y el campus tienen precios distintos, y dentro de los federados también varía según
      la categoría. No publicamos la tabla de precios en la web, pero te la damos enseguida:
      escríbenos al WhatsApp +34 698 425 153 o a marqueting@cbgrupbarna.info con el año de
      nacimiento y te decimos la cuota exacta que le tocaría, el mismo día. Antes de decidir
      nada, el primer entrenamiento es de prueba y gratuito, y el club mantiene becas sociales
      para que ningún niño o niña se quede fuera por motivos económicos.'
  en:
    q: How much does it cost to join the club for a season?
    r: 'Fees go by age band and by age group: the Escoleta, the league teams and the camp
      are priced differently, and within the league teams it varies by age group too. We do
      not publish the price list on the site, but we will tell you straight away: message
      us on WhatsApp +34 698 425 153 or write to marqueting@cbgrupbarna.info with the year
      of birth and we will give you the exact fee that would apply, the same day. Before you
      decide anything, the first session is a free trial, and the club keeps hardship bursaries
      so that no child is left out for financial reasons.'
- id: organigrama-presidencia
  pagina: /organigrama/
  ca:
    q: Qui presideix el CB Grup Barna?
    r: La temporada 2026-27 la presidència és de Santos García Yagüe i la vicepresidència,
      de Pere Solanas. La direcció tècnica és d'Adrià Mateo. La llista sencera de la Junta
      i de les coordinacions és en aquesta pàgina, tal com consta a la documentació oficial
      del club.
  es:
    q: ¿Quién preside el CB Grup Barna?
    r: En la temporada 2026-27 la presidencia es de Santos García Yagüe y la vicepresidencia,
      de Pere Solanas. La dirección técnica es de Adrià Mateo. La lista completa de la Junta
      y de las coordinaciones está en esta página, tal como consta en la documentación oficial
      del club.
  en:
    q: Who is the president of CB Grup Barna?
    r: For the 2026-27 season the president is Santos García Yagüe and the vice-president
      is Pere Solanas. Adrià Mateo is technical director. The full list of the board and the
      section coordinators is on this page, as recorded in the club's official documents.
- id: organigrama-a-qui-escriure
  pagina: /organigrama/
  ca:
    q: Amb qui parlo segons el que necessiti?
    r: 'Per a l''Escoleta (4 a 8 anys), amb Julio Torralba, al 646 205 526. Per a consultes
      generals del club, a marqueting@cbgrupbarna.info o al WhatsApp +34 698 425 153. Per
      a patrocinis i col·laboracions, a la direcció de màrqueting. I per a qualsevol qüestió
      de protecció del menor hi ha un canal confidencial a part: protecciomenorcbgrupbarna@gmail.com.'
  es:
    q: ¿Con quién hablo según lo que necesite?
    r: 'Para la Escoleta (4 a 8 años), con Julio Torralba, en el 646 205 526. Para consultas
      generales del club, en marqueting@cbgrupbarna.info o en el WhatsApp +34 698 425 153.
      Para patrocinios y colaboraciones, con la dirección de marketing. Y para cualquier cuestión
      de protección del menor hay un canal confidencial aparte: protecciomenorcbgrupbarna@gmail.com.'
  en:
    q: Who do I contact about what?
    r: 'For the Escoleta (ages 4 to 8), Julio Torralba on 646 205 526. For general club enquiries,
      marqueting@cbgrupbarna.info or WhatsApp +34 698 425 153. For sponsorship and partnerships,
      the marketing director. And for anything to do with child protection there is a separate
      confidential channel: protecciomenorcbgrupbarna@gmail.com.'
- id: historia-des-de-quan
  pagina: /historia/
  ca:
    q: Des de quan existeix el CB Grup Barna?
    r: 'Des del 1965: seixanta-un anys al barri del Clot. Va néixer com a secció de bàsquet
      del Centre Parroquial de Sant Martí del Clot, dins d''una entitat poliesportiva oberta
      a tot el jovent del barri.'
  es:
    q: ¿Desde cuándo existe el CB Grup Barna?
    r: 'Desde 1965: sesenta y un años en el barrio de El Clot. Nació como sección de baloncesto
      del Centre Parroquial de Sant Martí del Clot, dentro de una entidad polideportiva abierta
      a todos los jóvenes del barrio.'
  en:
    q: How long has CB Grup Barna been going?
    r: 'Since 1965: sixty-one years in the El Clot neighbourhood. It started as the basketball
      section of the Centre Parroquial de Sant Martí del Clot, inside a multi-sport organisation
      open to every young person in the area.'
- id: faq-ajuts
  pagina: /faq/
  ca:
    q: Hi ha beques o ajuts si una família no pot pagar la quota?
    r: Sí. El club manté beques socials perquè cap infant es quedi fora per motius econòmics.
      Es demanen escrivint al club, a marqueting@cbgrupbarna.info o al WhatsApp +34 698 425
      153, i es tracten de manera confidencial.
  es:
    q: ¿Hay becas o ayudas si una familia no puede pagar la cuota?
    r: Sí. El club mantiene becas sociales para que ningún niño o niña se quede fuera por
      motivos económicos. Se piden escribiendo al club, a marqueting@cbgrupbarna.info o al
      WhatsApp +34 698 425 153, y se tratan de forma confidencial.
  en:
    q: Are there bursaries or help for families who cannot afford the fee?
    r: Yes. The club keeps hardship bursaries so that no child is left out for financial reasons.
      You can ask for one by writing to the club at marqueting@cbgrupbarna.info or on WhatsApp
      +34 698 425 153, and requests are handled confidentially.
- id: documents-assegurança
  pagina: /documents/
  ca:
    q: Els jugadors i jugadores estan assegurats?
    r: Sí. Tota jugadora i jugador federat està cobert per l'assegurança esportiva obligatòria
      de la Federació Catalana de Basquetbol (FCBQ). La informació i el protocol en cas d'accident
      durant un entrenament o un partit es gestionen des de la mateixa federació.
  es:
    q: ¿Los jugadores y jugadoras están asegurados?
    r: Sí. Toda jugadora y jugador federado está cubierto por el seguro deportivo obligatorio
      de la Federació Catalana de Basquetbol (FCBQ). La información y el protocolo en caso
      de accidente durante un entrenamiento o un partido se gestionan desde la propia federación.
  en:
    q: Are the players insured?
    r: Yes. Every registered player is covered by the compulsory sports insurance of the Catalan
      Basketball Federation (FCBQ). The details and the procedure if there is an accident
      during training or a game are handled by the federation itself.
- id: faq-quin-lema
  pagina: /club/
  ca:
    q: Quin és el lema del CB Grup Barna?
    r: 'La Cultura del Progrés. No eduquem des del sacrifici: eduquem des del progrés. L''esforç
      importa, però no explica sol el resultat — hi calen també aprenentatge, descans, acompanyament,
      oportunitats i adaptació.'
  es:
    q: ¿Cuál es el lema del CB Grup Barna?
    r: 'La Cultura del Progreso. No educamos desde el sacrificio: educamos desde el progreso.
      El esfuerzo importa, pero no explica solo el resultado — hacen falta también aprendizaje,
      descanso, acompañamiento, oportunidades y adaptación.'
  en:
    q: What is CB Grup Barna's motto?
    r: 'The Culture of Progress. We do not teach through sacrifice: we teach through progress.
      Effort matters, but it does not explain the result on its own — learning, rest, support,
      opportunities and adaptation all count too.'
- id: desplacaments-qui-porta
  pagina: /partits/calendaris/
  ca:
    q: Qui porta els nens als partits de fora?
    r: Les famílies. Els pares i mares del mateix equip s'organitzen entre ells per als desplaçaments,
      i és una de les coses que més acaben unint un equip.
  es:
    q: ¿Quién lleva a los niños a los partidos de fuera?
    r: Las familias. Los padres y madres del mismo equipo se organizan entre ellos para los
      desplazamientos, y es una de las cosas que más acaban uniendo a un equipo.
  en:
    q: Who takes the children to away games?
    r: The families. Parents from the same team organise lifts between themselves, and it
      turns out to be one of the things that brings a team together.
- id: calendaris-1
  pagina: /partits/calendaris/
  ca:
    q: Com descarrego el calendari del meu equip?
    r: 'Busca l''equip a la llista, toca la imatge o el botó de descàrrega i es desa al mòbil
      o ordinador: una imatge per als equips amb una sola fitxa, un PDF de diverses pàgines
      per als sèniors, que juguen lliga d''ida i tornada.'
  es:
    q: ¿Cómo descargo el calendario de mi equipo?
    r: 'Busca el equipo en la lista, toca la imagen o el botón de descarga y se guarda en
      el móvil u ordenador: una imagen para los equipos con una sola ficha, un PDF de varias
      páginas para los séniors, que juegan liga de ida y vuelta.'
  en:
    q: How do I download my team's calendar?
    r: 'Find your team in the list, tap the image or the download button and it saves to your
      phone or computer: an image for teams with a single fixture list, a multi-page PDF for
      the senior teams, who play a home-and-away league.'
- id: calendaris-2
  pagina: /partits/calendaris/
  ca:
    q: Per què no hi ha calendari del meu equip?
    r: Els equips de promoció (premini, mini, preinfantil) reben el calendari de la FCBQ més
      tard que la resta de categories. Es publicarà aquí en el moment que la federació el
      faci oficial.
  es:
    q: ¿Por qué no hay calendario de mi equipo?
    r: Los equipos de promoción (premini, mini, preinfantil) reciben el calendario de la FCBQ
      más tarde que el resto de categorías. Se publicará aquí en el momento en que la federación
      lo haga oficial.
  en:
    q: Why isn't there a calendar for my team?
    r: Development teams (pre-mini, mini, pre-youth) receive their calendar from the FCBQ
      later than the rest of the categories. It will be published here as soon as the federation
      makes it official.
- id: calendaris-3
  pagina: /partits/calendaris/
  ca:
    q: Què faig si un partit ha canviat d'hora o de pista?
    r: Si la Federació Catalana de Basquetbol modifica un partit després que s'hagi fet la
      fitxa descarregable, la targeta de l'equip mostra un avís perquè comprovis les dades
      actualitzades a l'aplicació de partits del club, que es revisa cada dia.
  es:
    q: ¿Qué hago si un partido ha cambiado de hora o de pista?
    r: Si la Federación Catalana de Basquetbol modifica un partido después de que se haya
      generado la ficha descargable, la tarjeta del equipo muestra un aviso para que compruebes
      los datos actualizados en la aplicación de partidos del club, que se revisa cada día.
  en:
    q: What do I do if a match has changed time or venue?
    r: If the Catalan Basketball Federation changes a match after the downloadable fixture
      list was generated, the team's card shows a notice so you can check the updated details
      in the club's match app, which is reviewed every day.
- id: calendaris-4
  pagina: /partits/calendaris/
  ca:
    q: Amb quina freqüència s'actualitzen els calendaris?
    r: 'El calendari en directe de /partits/ es sincronitza cada dia amb el calendari oficial
      de la FCBQ. Les fitxes descarregables són fixes: si un partit concret canvia, l''app
      sempre té la dada correcta.'
  es:
    q: ¿Con qué frecuencia se actualizan los calendarios?
    r: 'El calendario en directo de /partits/ se sincroniza cada día con el calendario oficial
      de la FCBQ. Las fichas descargables son fijas: si un partido concreto cambia, la app
      siempre tiene el dato correcto.'
  en:
    q: How often are the calendars updated?
    r: 'The live calendar at /partits/ syncs every day with the official FCBQ calendar. The
      downloadable fixture lists are fixed: if a specific match changes, the app always has
      the correct data.'
