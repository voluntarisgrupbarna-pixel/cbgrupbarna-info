name: lighthouse · rendiment i qualitat

# El pressupost de pes (pes-pressupost.yml) vigila mida de fitxer, no
# rendiment real de la pàgina (LCP, CLS, INP) ni accessibilitat/SEO tal com
# ho veuria Google. Aquest workflow tapa aquest forat sobre unes quantes
# pàgines representatives.
#
# El llindar de "performance" és tou (warn): els runners compartits de
# GitHub Actions no donen un rendiment constant i fer-lo bloquejant portaria
# fallades dels sorolloses, no reals. Accessibilitat i SEO són molt més
# deterministes sobre HTML estàtic, per això sí que bloquegen.

on:
  pull_request:
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Servir el lloc en local
        run: |
          python3 -m http.server 4173 &
          sleep 2

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173/
            http://localhost:4173/partits/
            http://localhost:4173/campus/
            http://localhost:4173/escoleta/
            http://localhost:4173/blog/
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: .github/lighthouserc.json
