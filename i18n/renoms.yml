# Adreces traduïdes: quina ruta tenia una pàgina i quina té ara.
#
# Aquest fitxer és el registre de les redireccions que hi ha al lloc. Cada
# entrada vol dir que a `de` hi ha una pàgina que no fa res més que portar a
# `a`, i que hi ha de continuar havent-n'hi: hi ha enllaços publicats, gent
# que ho té guardat i cercadors que encara hi porten. **No s'esborra mai una
# entrada d'aquí.**
#
# Només s'hi renomena el que té valor de cerca: un article que en anglès es
# deia «que-es-basquet-3x3» no el troba ningú que busqui en anglès. Les
# seccions de navegació NO es toquen —/partits/, /partits/calendaris/,
# /fotos/, /campus/— perquè ningú les busca pel nom i canviar-les trencaria
# enllaços interns, el sitemap i els .ics que la gent ja té subscrits al
# mòbil. El motiu de cada renúncia és a i18n/excepcions.yml.

renoms:
  # ── Els articles del blog. El slug és la seva identitat de cerca. ────────
  - de: /en/blog/que-es-basquet-3x3/
    a:  /en/blog/what-is-3x3-basketball/
