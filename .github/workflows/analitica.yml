name: analitica · informe diari de GA4

# Cada matinada baixa l'informe de GA4 (28 dies) i el deixa a
# admin/analitica/dades.json, que és l'únic que llegeix el panell
# d'/admin/analitica/. La clau del service account només viu als secrets;
# si encara no hi és, l'script ho diu i surt en verd (instruccions per
# donar-la d'alta a la capçalera de .github/scripts/ga4-informe.py).

on:
  schedule:
    - cron: '38 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dependència de signatura (RS256)
        run: pip install --quiet cryptography
      - name: Baixar l'informe
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python3 .github/scripts/ga4-informe.py
      - name: Publicar si ha canviat
        run: |
          if git diff --quiet -- admin/analitica/dades.json; then
            echo "Cap canvi a l'informe."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add admin/analitica/dades.json
          git commit -m "analitica: informe diari [skip ci]"
          git push

      - name: Avisa si el robot ha fallat
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titol = '🔴 Robot caigut: ${{ github.workflow }}';
            const cos = 'El workflow **${{ github.workflow }}** ha fallat: ' +
              context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
              '/actions/runs/' + context.runId + ' (' + new Date().toISOString() + ').';
            const { data: oberts } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'robot-caigut'
            });
            const existent = oberts.find(i => i.title === titol);
            if (existent) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existent.number, body: cos });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: titol, body: cos, labels: ['robot-caigut'] });
            }

      - name: Tanca l'avís si ara ha anat bé
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const titol = '🔴 Robot caigut: ${{ github.workflow }}';
            const { data: oberts } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'robot-caigut'
            });
            const existent = oberts.find(i => i.title === titol);
            if (existent) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existent.number, body: 'Ha tornat a anar bé a la següent execució. Es tanca automàticament.' });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existent.number, state: 'closed' });
            }
