  .intro{color:var(--muted);font-size:.85rem;max-width:56ch;margin:-.8rem 0 1.5rem}
  .team{margin-top:1.8rem}
  .team h2{font-family:'Anton',sans-serif;font-size:1.4rem;color:var(--red);border-bottom:1px solid var(--line);padding-bottom:.35rem;margin-bottom:.8rem}
  .players{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.9rem;display:flex;align-items:center;gap:.8rem}

  .lang-switch { display: flex; align-items: center; gap: 6px; font-family: 'Anton', sans-serif; font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }

  </div>
</header>
<div class="wrap">
  <h1>THE <span>ROSTER</span></h1>
  <div class="sub">CB Grup Barna players by team · 2025-2026 season</div>
  <p class="intro">Browse the full CB Grup Barna roster, team by team: from the Escoleta to the senior squads, every registered player at the club in El Clot, Barcelona.</p>
  <div id="roster"><div class="empty">Loading roster…</div></div>
</div>
<script src="/jugadors/jugadors.js"></script>
<script>
  const jug = Array.isArray(window.JUGADORS) ? window.JUGADORS : [];
  const box = document.getElementById('roster');
  if (!jug.length) {
    box.innerHTML = '<div class="empty">We\'ll publish the roster very soon. 🏀</div>';
  } else {
    const byTeam = {};
    jug.forEach(j => { (byTeam[j.equip] = byTeam[j.equip] || []).push(j); });
    box.innerHTML = Object.keys(byTeam).sort().map(t => `
      <section class="team">
        <h2>${t}</h2>
        <div class="players">
          ${byTeam[t].map(j => `
            <div class="pcard">
              ${j.foto ? `<img class="pfoto" src="/jugadors/fotos/${j.foto}" alt="${j.nom} ${j.cognoms}">` : `<div class="pfoto"></div>`}
              <div class="dorsal">${j.dorsal ?? ''}</div>
              <div>
                <div class="pname">${j.nom} ${j.cognoms}</div>
                ${j.posicio ? `<div class="ppos">${j.posicio}</div>` : ''}
              </div>
            </div>`).join('')}
        </div>
      </section>`).join('');
  }
</script>
