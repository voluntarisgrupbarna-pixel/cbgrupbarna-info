# Configuración de marca CB Grup Barna — rellenar con valores oficiales
# (paleta/tipografía en el knowledge "Barna" y skill disseny-estetic-club)
# Los scripts de scripts/ leen este archivo.

# Ruta al logo PNG con transparencia (déjalo vacío si aún no lo tienes en disco)
LOGO_PATH=""

# Color de acento del club en hex (para subtítulos, rótulos, barras). Placeholder:
BRAND_COLOR="#1B2A4A"
BRAND_COLOR_2="#E63329"

# Tipografía para rótulos y subtítulos (ruta a .ttf, o nombre de fuente del sistema)
# Si está vacío, los scripts usan una sans-serif por defecto.
FONT_PATH=""

# Hashtag por defecto del club
DEFAULT_HASHTAG="#SomGrupBarna"

# Opacidad de la marca de agua (0-1)
WATERMARK_OPACITY="0.85"

# Posición de la marca de agua: TL, TR, BL, BR
WATERMARK_POS="BR"
