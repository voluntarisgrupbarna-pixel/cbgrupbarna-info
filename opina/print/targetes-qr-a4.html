<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Targetes QR A4 · Ressenyes CB Grup Barna</title>
<style>
  /* Full A4 amb 8 targetes de butxaca (105 × 74 mm) per retallar i repartir
     a les grades, al taulell o de mà en mà. Imprimir a A4, marges "cap" i
     amb "Gràfics de fons" activat; retallar per les línies. */
  @font-face{font-family:'CBGB Display';src:url('BigShoulders-Bold.ttf') format('truetype');font-weight:700}
  @page{size:A4 portrait;margin:0}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#4a4a4a}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:'Helvetica Neue',Arial,sans-serif}

  .sheet{width:210mm;height:297mm;margin:0 auto;background:#fff;display:grid;
         grid-template-columns:repeat(2,105mm);grid-template-rows:repeat(4,74.25mm)}
  .card{background:#050505;color:#fff;position:relative;overflow:hidden;
        border:.3mm dashed rgba(255,255,255,.22);
        display:flex;align-items:center;gap:5mm;padding:7mm 6mm}
  .card::before{content:'';position:absolute;left:-14mm;top:-18mm;width:70mm;height:55mm;
        background:radial-gradient(circle,rgba(226,6,19,.34),transparent 66%)}
  .card::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2.6mm;background:#E20613}

  .qr{background:#fff;border-radius:2mm;padding:1.8mm;width:29mm;flex:none;position:relative;z-index:2}
  .qr img{width:100%;display:block}

  .txt{position:relative;z-index:2;flex:1;min-width:0}
  .brand{display:flex;align-items:center;gap:2.6mm;margin-bottom:2.6mm}
  .brand img{width:8mm;height:8mm;object-fit:contain}
  .brand .nm{font-family:'CBGB Display',Impact,sans-serif;font-size:12pt;line-height:1;letter-spacing:.3pt}
  .brand .nm span{color:#E20613}
  h2{font-family:'CBGB Display',Impact,sans-serif;font-size:19pt;line-height:.9;text-transform:uppercase;margin-bottom:2mm}
  h2 em{font-style:normal;color:#E20613}
  .st{font-size:7.6pt;line-height:1.35;color:#c9c9c9;margin-bottom:2.6mm}
  .url{font-family:'CBGB Display',Impact,sans-serif;font-size:12.5pt;letter-spacing:.3pt;line-height:1}
  .url span{color:#E20613}
  .stars{color:#FFC107;font-size:8pt;letter-spacing:2pt;margin-top:1.6mm}

  @media screen{ body{padding:10mm 0} .sheet{box-shadow:0 0 18mm rgba(0,0,0,.6)} }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
// Les 8 targetes son identiques: es generen per no repetir el marcatge.
var CARD = '' +
  '<div class="card">' +
    '<div class="qr"><img src="../qr.svg" alt="Codi QR"></div>' +
    '<div class="txt">' +
      '<div class="brand"><img src="../../logo.png" alt=""><div class="nm">CB GRUP <span>BARNA</span></div></div>' +
      '<h2>Ens ajudes<br>en <em>1 minut</em>?</h2>' +
      '<div class="st">Escaneja el codi i deixa la teva ressenya del club a Google.</div>' +
      '<div class="url">cbgrupbarna.info<span>/opina</span></div>' +
      '<div class="stars">★★★★★</div>' +
    '</div>' +
  '</div>';
document.getElementById('sheet').innerHTML = CARD.repeat(8);
</script>
<script src="/js/lang-switch.js" defer></script>
</body>
</html>
