name: update-partits

# Robot FCBQ: cada dia a les 06:00 UTC (8:00 a Barcelona en horari d'estiu;
# 7:00 en horari d'hivern — GitHub Actions només programa en UTC, no hi ha
# manera de seguir el canvi d'hora espanyol amb un sol cron) es connecta a
# basquetcatala.cat (calendari global i mensual del club 24), compara amb
# partits/data.json i actualitza hores, pistes, dates i resultats. Els
# canvis queden marcats a cada partit (rètol "MODIFICAT" durant 7 dies) i
# registrats a partits/canvis.json perquè la app els mostri i perquè la
# rutina diària n'informi. Després, regenera les fitxes descarregables de
# /partits/calendaris/ (una imatge o PDF per equip): només es torna a
# dibuixar la fitxa d'un equip si les seves dades han canviat de debò.
# Finalment, torna a escriure el resum estàtic (SEO/SEO-IA) de propers
# partits, resultats i JSON-LD dins partits/index.html i els enllaços de
# descàrrega dins partits/calendaris/index.html, perquè els bots que no
# executen JavaScript vegin dades reals i actuals. També regenera un
# calendari .ics per equip (partits/calendaris/ics/) perquè les famílies
# s'hi subscriguin des de Google/Apple/Outlook i rebin sols els canvis. I
# genera una pàgina estàtica pròpia per equip a partits/equips/{id}/ (més
# un índex a partits/equips/), amb el nom, la competició, el balanç i el
# calendari com a HTML real i indexable, no només dins l'estat de l'app.
#
# Cap de setmana, quan hi ha partits, es repeteix cada 20 minuts entre les
# 08:00 i les 22:00 (hora de Barcelona, aprox. — GitHub Actions treballa en
# UTC) per intentar recollir els resultats abans, amb una passada garantida
# a les 22:00 el diumenge perquè els resultats de la tarda tinguin temps de
# publicar-se. És un intent de màxim esforç: si la federació no ha penjat
# encara el resultat, simplement no hi ha res nou i no es fa cap commit.
#
# Si la federació no respon o bloqueja el robot, no passa res: la via manual
# de /partits/ → Gestió segueix activa i no es toca res.
# També es pot llançar a mà des de la pestanya Actions (workflow_dispatch).

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "*/20 7-20 * * 6,0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instal·lar dependències
        run: pip install --quiet pillow
      - name: Baixar i comparar el calendari FCBQ
        run: python .github/scripts/update-partits.py
      - name: Regenerar fitxes de calendari per equip
        run: python .github/scripts/generate-calendaris.py
      - name: Actualitzar resum estàtic per a SEO / SEO-IA
        run: python .github/scripts/generate-seo-snapshot.py
      - name: Escuts dels rivals per a la pàgina de partits
        run: python scripts/build-escuts-rivals.py
      # Ha d'anar just després: /es/partits/ i /en/partits/ es generen a partir
      # de la catalana, i si no, es queden amb la instantània del dia abans.
      - name: Regenerar Dies de partit en castellà i anglès
        run: python scripts/build-partits-idiomes.py
      - name: Les FAQ de /partits/ en el seu idioma (el traductor de pàgina no les sap)
        run: python .github/scripts/generate-faq.py
      - name: Regenerar calendaris .ics per equip
        run: python .github/scripts/generate-ics.py
      - name: Regenerar pàgines pròpies per equip
        run: python .github/scripts/generate-team-pages.py

      # Les fitxes d'equip que s'acaben de generar també s'han de poder
      # cercar. Aquest commit porta [skip ci], o sigui que el workflow del
      # sitemap no s'engegarà: l'índex s'ha de refer aquí mateix.
      - name: Refer l'índex del cercador
        run: python .github/scripts/generate-search-index.py
      - name: Commit si hi ha canvis
        run: |
          git config user.name "cbgb-robot"
          git config user.email "cbgrupbarna@gmail.com"
          git add partits/data.json partits/canvis.json partits/calendaris/ partits/index.html partits/equips/ es/partits/index.html en/partits/index.html cerca-index.json
          if git diff --cached --quiet; then
            echo "Sense canvis"
          else
            git commit -m "partits: actualitzacio diaria FCBQ [skip ci]"
            git push
          fi
