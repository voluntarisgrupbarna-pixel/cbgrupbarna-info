    q: Per a quines edats és el campus de Nadal?
    r: 'Per a jugadors i jugadores de base, des de l''edat de l''Escoleta fins a categories
      cadet i júnior. Els grups es fan per edat i nivell: qui comença no entrena amb qui porta
