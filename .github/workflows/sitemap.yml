name: SEO · sitemap, índex de cerca i avís als cercadors

# El sitemap es mantenia a mà, i per això anava quedant enrere: hi havia
# pàgines publicades que no hi sortien i dates que no corresponien a cap canvi
# real. Ara es reconstrueix sol cada cop que es publica una pàgina.
#
# Al mateix pas es refà l'índex del cercador (/cerca-index.json), que es
# calcula de les mateixes pàgines: si una es publica, es retira o canvia de
# títol, el cercador se n'ha d'assabentar el mateix dia. Van junts a posta,
# en un sol commit: dos workflows empenyent alhora sobre el mateix push es
# trepitgen i el segon rebota.
#
# Després avisa IndexNow (Bing, Yandex, Seznam, Naver) de les URLs que han
# canviat en aquest push. Google no fa servir IndexNow: aquell se n'assabenta
# pel sitemap, i si cal córrer, per la Search Console.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'scripts/build-sitemap.py'
      - '.github/scripts/generate-search-index.py'
      - 'i18n/routes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Cal l'historial sencer: amb un clon superficial, el commit anterior
          # al push pot no existir-hi i el diff surt buit sense dir-ho.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Aquest pas va PRIMER a posta. El pas que desa el sitemap fa un commit,
      # i un commit mou HEAD: si calculéssim el diff després, compararíem el
      # commit del sitemap amb ell mateix i no hi trobaríem cap pàgina. Per
      # això ens ancorem als dos SHA del push, que no es mouen.
      - name: Veure quines pàgines ha tocat aquest push
        env:
          ABANS: ${{ github.event.before }}
          ARA: ${{ github.sha }}
        run: |
          : > /tmp/urls.txt
          if [ -z "$ABANS" ] || [ "$ABANS" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::Push sense commit anterior (branca nova). No s'avisa ningú."
            exit 0
          fi
          if ! git cat-file -e "$ABANS^{commit}" 2>/dev/null; then
            echo "::warning::El commit anterior ($ABANS) no és a l'historial. No s'avisa ningú."
            exit 0
          fi
          canviats=$(git diff --name-only --diff-filter=AM "$ABANS" "$ARA" -- '*.html')
          for f in $canviats; do
            case "$f" in
              */admin.html|admin/*|*/print/*|*/cartell.html|*/estadistiques.html|*/app.html) continue ;;
            esac
            echo "https://cbgrupbarna.info/${f%index.html}" >> /tmp/urls.txt
          done
          echo "::notice::$(wc -l < /tmp/urls.txt) pàgines públiques tocades en aquest push."

      - name: Reconstruir el sitemap
        run: python3 scripts/build-sitemap.py

      - name: Reconstruir l'índex del cercador
        run: python3 .github/scripts/generate-search-index.py

      - name: Desar-ho si ha canviat
        run: |
          if git diff --quiet sitemap.xml cerca-index.json; then
            echo "::notice::El sitemap i l'índex de cerca ja estaven al dia."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml cerca-index.json
            git commit -m "chore(seo): reconstrueix el sitemap i l'índex de cerca [skip ci]"
            git push
            echo "::notice::Sitemap i índex de cerca actualitzats."
          fi

      - name: Avisar els cercadors
        run: |
          if [ ! -s /tmp/urls.txt ]; then
            echo "::notice::Cap pàgina pública tocada. No cal avisar ningú."
          else
            python3 scripts/indexnow.py $(cat /tmp/urls.txt)
          fi
