- id: revisio-medica
  pagina: /documents/
  pendent: 'Si el club demana revisió mèdica per federar-se. L''assegurança sí que està resolta:
    tota jugadora i jugador federat està cobert per la de la FCBQ.'
  ca:
    q: Cal fer revisió mèdica per jugar al club?
  es:
    q: ¿Hace falta revisión médica para jugar en el club?
