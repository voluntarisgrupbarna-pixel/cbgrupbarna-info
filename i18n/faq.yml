  pagina: /faq/
  pendent: Quina equipació és obligatòria, què costa i on es compra.
  ca:
    q: Quina equipació cal comprar i quant costa?
  es:
    q: ¿Qué equipación hay que comprar y cuánto cuesta?
  en:
    q: What kit do we need to buy and how much is it?
- id: equip-qui-decideix
  pagina: /basquet-formatiu/
  pendent: Qui decideix l'equip i si hi ha proves de nivell, i què vol dir equip A i B.
  ca:
    q: Qui decideix a quin equip va i què vol dir equip A i equip B?
  es:
    q: ¿Quién decide a qué equipo va y qué quiere decir equipo A y equipo B?
  en:
    q: Who decides which team a child joins, and what do A and B teams mean?
- id: desplacaments
  pagina: /partits/calendaris/
  pendent: Quants partits es juguen fora al llarg d'una temporada i com s'organitzen els desplaçaments
