name: backup · mirall del repositori

# Copia incremental de main cap a un repositori de backup separat, per si
# mai es perd l'accés a aquest (compte robat, repositori esborrat per error,
# etc.). Substitueix el mirall manual descrit a la skill mapa-web-cbgb §9:
# ara corre sol cada nit, un push incremental, sense haver-se'n de recordar.
#
# Necessita dos secrets que cal donar d'alta a mà UN COP (Settings > Secrets
# and variables > Actions), vegeu BACKUP-REPOSITORI.md per als passos:
#   BACKUP_REPO_URL   -> https://github.com/<usuari>/cbgrupbarna-info-backup.git
#   BACKUP_REPO_TOKEN -> Personal Access Token amb permis "Contents: Read and
#                        write" nomes sobre aquell repo de backup
#
# Si algun dels dos falta, el workflow ho diu i surt en verd sense fer res
# (no es un error, nomes falta el pas manual d'un cop).

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  mirall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Comprovar que hi ha els secrets
        env:
          URL: ${{ secrets.BACKUP_REPO_URL }}
          TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "::notice::Falten BACKUP_REPO_URL i/o BACKUP_REPO_TOKEN. Vegeu BACKUP-REPOSITORI.md per donar-los d'alta. Sortint sense fer res."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'
        with:
          fetch-depth: 0

      - name: Push incremental cap al mirall
        if: env.SKIP != '1'
        env:
          URL: ${{ secrets.BACKUP_REPO_URL }}
          TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -e
          authed=$(echo "$URL" | sed "s#https://#https://x-access-token:${TOKEN}@#")
          git remote add backup "$authed"
          git push backup "HEAD:refs/heads/main"

      - name: Avisa si el robot ha fallat
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titol = '🔴 Robot caigut: ${{ github.workflow }}';
            const cos = 'El workflow **${{ github.workflow }}** ha fallat: ' +
              context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
              '/actions/runs/' + context.runId + ' (' + new Date().toISOString() + '). ' +
              'El backup no s\'ha actualitzat aquesta nit.';
            const { data: oberts } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'robot-caigut'
            });
            const existent = oberts.find(i => i.title === titol);
            if (existent) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existent.number, body: cos });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: titol, body: cos, labels: ['robot-caigut'] });
            }

      - name: Tanca l'avís si ara ha anat bé
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const titol = '🔴 Robot caigut: ${{ github.workflow }}';
            const { data: oberts } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'robot-caigut'
            });
            const existent = oberts.find(i => i.title === titol);
            if (existent) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existent.number, body: 'Ha tornat a anar bé a la següent execució. Es tanca automàticament.' });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existent.number, state: 'closed' });
            }
