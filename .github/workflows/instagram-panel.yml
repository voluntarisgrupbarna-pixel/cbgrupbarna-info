name: Panell Instagram (fetch dades)

# Actualitza panel-instagram/data.json amb dades reals de la Instagram Graph API.
# El token viu a GitHub Secrets (mai al codi). Si els secrets no hi són, el job
# no falla: el panell segueix mostrant les dades de demostració.

on:
  schedule:
    - cron: '17 6 * * *'      # cada dia ~08:17 hora de Barcelona (06:17 UTC)
  workflow_dispatch:           # botó manual "Run workflow"

permissions:
  contents: write

concurrency:
  group: instagram-panel
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Comprova secrets
        id: check
        run: |
          if [ -z "${{ secrets.IG_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.IG_USER_ID }}" ]; then
            echo "::notice::IG_ACCESS_TOKEN o IG_USER_ID no configurats — es manté el mode DEMO."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Instagram
        if: steps.check.outputs.ready == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
        run: node scripts/fetch-instagram.mjs

      - name: Commit canvis si n'hi ha
        if: steps.check.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet panel-instagram/data.json; then
            echo "Sense canvis a data.json"
          else
            git add panel-instagram/data.json
            git commit -m "chore(panel-ig): actualitza dades Instagram [skip ci]"
            git push
          fi
