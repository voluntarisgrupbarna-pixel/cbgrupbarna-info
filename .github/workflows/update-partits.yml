name: update-partits

# Robot FCBQ: CADA DIA a les 07:00 (05:00 UTC) es connecta a basquetcatala.cat
# (calendari global del club 24), compara amb partits/data.json i actualitza
# hores, pistes, dates i resultats. Els canvis queden marcats a cada partit
# (rètol "MODIFICAT" durant 7 dies) i registrats a partits/canvis.json perquè
# la app els mostri i perquè la rutina diària n'informi. Si la federació no
# respon o bloqueja el robot, no passa res: la via PDF de /partits/ segueix
# activa. També es pot llançar a mà des de la pestanya Actions.
#
# Cap de setmana, quan hi ha partits, es repeteix cada 20 minuts entre les
# 08:00 i les 21:00 (hora de Barcelona, aprox. — GitHub Actions treballa en
# UTC) per intentar recollir els resultats abans. És un intent de màxim
# esforç: si la federació no ha penjat encara el resultat, simplement no hi
# ha res nou i no es fa cap commit.

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "*/20 7-19 * * 6,0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar i comparar el calendari FCBQ
        run: python .github/scripts/update-partits.py
      - name: Commit si hi ha canvis
        run: |
          git config user.name "cbgb-robot"
          git config user.email "cbgrupbarna@gmail.com"
          git add partits/data.json partits/canvis.json
          if git diff --cached --quiet; then
            echo "Sense canvis"
          else
            git commit -m "partits: actualitzacio diaria FCBQ [skip ci]"
            git push
          fi
