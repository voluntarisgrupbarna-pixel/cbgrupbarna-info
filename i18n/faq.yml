- id: empreses-1
  pagina: /empreses/
  ca:
    q: Què s'aconsegueix patrocinant el CB Grup Barna?
    r: Visibilitat davant 450+ famílies del Clot i Sant Martí i 400 jugadors i jugadores,
      presència física a La Nau del Clot i als esdeveniments del club, contingut propi produït
      pel club, entrada a Barna Business —la xarxa d'empreses partner— i vinculació amb un
      projecte de bàsquet femení i inclusiu. No és només un logotip en una tanca.
- id: empreses-2
  pagina: /empreses/
  ca:
    q: Quantes empreses patrocinen el CB Grup Barna?
    r: Actualment hi ha 23 partners amb fitxa pública al web del club, des de comerç de barri
      del Clot fins a Westfield Glòries, Instax Fujifilm, Nova Farmàcia Clot i el Mercat dels
      Encants. Tots són consultables un a un a /patrocinadors/.
- id: empreses-3
  pagina: /empreses/
  ca:
    q: Es pot col·laborar sense aportar diners?
    r: 'Sí. Bona part dels acords del club són en espècie: producte, servei, espai, experiències
      per a les famílies o descomptes per als socis. Per a molts comerços del barri és la
      forma d''entrada més natural.'
- id: empreses-4
  pagina: /empreses/
  ca:
    q: Què és Barna Business?
    r: 'És la xarxa d''empreses vinculades al CB Grup Barna. Més enllà de la visibilitat,
      posa en contacte els partners entre ells i amb el teixit comercial del Clot i Sant Martí,
      amb trobades al voltant dels esdeveniments del club. El patrocinador no compra només
      un espai: entra en una comunitat d''empreses.'
- id: empreses-5
  pagina: /empreses/
  ca:
    q: A qui s'ha d'escriure per patrocinar el club?
    r: A marqueting@cbgrupbarna.info o al WhatsApp +34 698 425 153. El club envia el dossier
      comercial i proposa una reunió per plantejar una proposta a mida.
- id: escola-basquet-barcelona-1
  pagina: /escola-basquet-barcelona/
  ca:
    q: Quina és la millor escola de bàsquet a Barcelona?
    r: 'No n''hi ha una de millor per a tothom: depèn de si la família busca competició federada
      o només iniciació. Si es vol marca i experiència de club gran, el referent és el Barça
      Escola. Si es vol iniciació lúdica sense competir, hi ha escoles com la de Nacho Solozábal.
      Si es vol una escola de barri amb continuïtat real fins a la competició federada de
      la FCBQ, amb el mateix sostre per a nens i nenes i entrenadors titulats, l''Escoleta
      del CB Grup Barna al Clot forma des dels 4 anys amb grups per edat i nivell. El que
      decideix són quatre coses: si hi ha competició o no, la ràtio d''entrenador per grup,
      la distància de casa i si hi ha línia femenina de veritat.'
  es:
    q: ¿Cuál es la mejor escuela de baloncesto en Barcelona?
    r: 'No hay una mejor para todo el mundo: depende de si la familia busca competición federada
      o solo iniciación. Si se quiere marca y experiencia de club grande, el referente es
      el Barça Escola. Si se quiere iniciación lúdica sin competir, hay escuelas como la de
      Nacho Solozábal. Si se quiere una escuela de barrio con continuidad real hasta la competición
      federada de la FCBQ, con el mismo techo para niños y niñas y entrenadores titulados,
      la Escoleta del CB Grup Barna en El Clot forma desde los 4 años con grupos por edad
      y nivel. Lo que decide son cuatro cosas: si hay competición o no, la ratio de entrenador
      por grupo, la distancia de casa y si hay línea femenina de verdad.'
  en:
    q: What is the best basketball school in Barcelona?
    r: 'There is no single best school for everyone: it depends on whether the family wants
      league competition or just beginner sessions. For the brand and the big-club experience,
      the reference is Barça Escola. For playful beginner sessions with no competition, there
      are schools such as Nacho Solozábal''s. For a neighbourhood school with a real pathway
      all the way to FCBQ league competition, with the same ceiling for boys and girls and
      qualified coaches, the CB Grup Barna Escoleta in El Clot takes children from age 4 in
      groups by age and level. Four things decide it: whether there is league competition
      or not, the coach-to-player ratio, the distance from home, and whether there is a genuine
      girls'' pathway.'
- id: escola-basquet-barcelona-2
  pagina: /escola-basquet-barcelona/
  ca:
    q: Quina diferència hi ha entre una escola de bàsquet i un club amb equips federats?
    r: 'Una escola d''iniciació treballa fonaments i psicomotricitat sense competir, normalment
      fins als 12-14 anys. Un club amb equips federats compet a la FCBQ des de les categories
      més petites fins a sènior. El CB Grup Barna té les dues coses dins la mateixa entitat:
      l''Escoleta (4-8 anys, sense competició) i el bàsquet formatiu federat a partir de Premini,
      de manera que qui hi comença pot continuar-hi tota la carrera esportiva sense canviar
      de club.'
  es:
    q: ¿Qué diferencia hay entre una escuela de baloncesto y un club con equipos federados?
    r: 'Una escuela de iniciación trabaja fundamentos y psicomotricidad sin competir, normalmente
      hasta los 12-14 años. Un club con equipos federados compite en la FCBQ desde las categorías
      más pequeñas hasta sénior. El CB Grup Barna tiene las dos cosas dentro de la misma entidad:
      la Escoleta (4-8 años, sin competición) y el baloncesto formativo federado a partir
      de Premini, de forma que quien empieza puede continuar toda la carrera deportiva sin
      cambiar de club.'
  en:
    q: What is the difference between a basketball school and a club with league teams?
    r: 'A beginner school works on fundamentals and motor skills with no competition, usually
      up to age 12-14. A club with league teams competes in the FCBQ from the youngest age
      groups up to senior level. CB Grup Barna has both inside the same club: the Escoleta
      (ages 4-8, no competition) and the youth basketball pathway in league competition from
      Premini onward, so a child who starts there can stay for their whole playing career
      without changing clubs.'
- id: escola-basquet-barcelona-3
  pagina: /escola-basquet-barcelona/
  ca:
    q: A quina edat pot començar un nen o nena a jugar a bàsquet?
    r: La majoria d'escoles de Barcelona admeten des dels 4-5 anys en grups d'iniciació, amb
      un treball centrat en psicomotricitat i el primer contacte amb la pilota. Al CB Grup
      Barna, l'Escoleta comença als 4 anys, en grups mixtos i per edat.
  es:
    q: ¿A qué edad puede empezar un niño o niña a jugar a baloncesto?
    r: La mayoría de escuelas de Barcelona admiten desde los 4-5 años en grupos de iniciación,
      con un trabajo centrado en psicomotricidad y el primer contacto con el balón. En el
      CB Grup Barna, la Escoleta empieza a los 4 años, en grupos mixtos y por edad.
  en:
    q: At what age can a child start playing basketball?
    r: Most schools in Barcelona take children from age 4-5 in beginner groups, focused on
      motor skills and first contact with the ball. At CB Grup Barna, the Escoleta starts
      at age 4, in mixed groups by age.
- id: escola-basquet-barcelona-4
  pagina: /escola-basquet-barcelona/
  ca:
    q: Hi ha escoles de bàsquet per a nenes a Barcelona?
    r: 'Sí, cada vegada més, però no totes tenen la mateixa proporció ni el mateix pressupost
      per a la línia femenina. Al CB Grup Barna hi ha paritat real: el mateix nombre d''equips
      femenins que masculins i el mateix sostre esportiu, amb equips de noies a totes les
      categories.'
  es:
    q: ¿Hay escuelas de baloncesto para niñas en Barcelona?
    r: 'Sí, cada vez más, pero no todas tienen la misma proporción ni el mismo presupuesto
      para la línea femenina. En el CB Grup Barna hay paridad real: el mismo número de equipos
      femeninos que masculinos y el mismo techo deportivo, con equipos de chicas en todas
      las categorías.'
  en:
    q: Are there basketball schools for girls in Barcelona?
    r: 'Yes, increasingly so, but not all schools have the same proportion or the same budget
      for the girls'' pathway. At CB Grup Barna there is real parity: the same number of girls''
      teams as boys'' teams and the same sporting ceiling, with girls'' teams in every age
      group.'
- id: escola-basquet-barcelona-5
  pagina: /escola-basquet-barcelona/
  ca:
    q: Cal ser d'un club per anar a la seva escola de bàsquet?
    r: 'A l''Escoleta del CB Grup Barna no cal cap experiència prèvia ni compromís inicial:
      el primer entrenament és de prova. Cada escola marca les seves pròpies condicions d''entrada;
      convé preguntar-ho directament abans d''apuntar-hi ningú.'
  es:
    q: ¿Hay que ser de un club para ir a su escuela de baloncesto?
    r: 'En la Escoleta del CB Grup Barna no hace falta experiencia previa ni compromiso inicial:
      el primer entrenamiento es de prueba. Cada escuela marca sus propias condiciones de
      entrada; conviene preguntarlo directamente antes de apuntar a nadie.'
  en:
    q: Do you have to belong to a club to join its basketball school?
    r: 'At the CB Grup Barna Escoleta, no prior experience or upfront commitment is needed:
      the first training session is a trial. Each school sets its own entry conditions, so
      it is worth asking directly before signing anyone up.'
- id: magics-1
  pagina: /magics/
  ca:
    q: Què són els Barna Màgics?
    r: 'L''equip de bàsquet inclusiu del CB Grup Barna: jugadors i jugadores amb diversitat
      funcional que entrenen i competeixen com qualsevol altre equip del club, dins la Lliga
      ACELL, en col·laboració amb la Fundació Mullor.'
- id: magics-2
  pagina: /magics/
  ca:
    q: Cal experiència prèvia per jugar-hi?
    r: No. Hi ha jugadors i jugadores que hi arriben sense haver jugat mai. Com a la resta
      d'equips del club, el primer dia és de prova i sense compromís.
- id: magics-3
  pagina: /magics/
  ca:
    q: On entrenen i competeixen els Màgics?
    r: Entrenen a La Nau del Clot, la mateixa instal·lació que la resta d'equips del club,
      i competeixen dins del circuit d'ACELL per tot Catalunya.
- id: magics-4
  pagina: /magics/
  ca:
    q: Com es pot apuntar algú a l'equip?
    r: Escrivint al WhatsApp del club (+34 698 425 153) o deixant el contacte al formulari
      de la web. El club explica horaris, com funciona la fitxa i concerta un primer entrenament
      de prova, sense compromís.
- id: model-formatiu-1
  pagina: /model-formatiu/
  ca:
    q: A quina edat abandonen més els nens i nenes el bàsquet?
    r: L'edat mitjana real d'abandonament és 12,93 anys, coincidint amb el trànsit d'infantil
      a cadet, no als 11 com sol repetir-se sense font. Al voltant d'un 30% abandona almenys
      un club cada any.
- id: model-formatiu-2
  pagina: /model-formatiu/
  ca:
    q: Funciona detectar els millors jugadors de ben petits?
    r: 'No de manera fiable: el 92,8% de les poblacions d''elit júnior i sènior són persones
      diferents. La maduració biològica precoç prediu força i velocitat, no habilitat tècnica,
      de manera que seleccionar per físic als 10-13 anys sovint és seleccionar per data de
      naixement.'
- id: model-formatiu-3
  pagina: /model-formatiu/
  ca:
    q: Què va fer Marc Gasol al Bàsquet Girona?
    r: 'Va fundar una escola de bàsquet el 2014 sense cap equip gran; el primer sènior no
      va arribar fins al 2017, tres anys després. Ell mateix ho ha explicat diverses vegades:
      "no vamos a correr para llegar a la ACB" i "l''esport és una eina per educar". El club
      va pujar a ACB el 2022, vuit anys després de la fundació de l''escola.'
- id: model-formatiu-4
  pagina: /model-formatiu/
  ca:
    q: Què té a veure això amb el CB Grup Barna?
    r: 'El Barna fa, des de fa seixanta-un anys, el mateix ordre que Marc Gasol va triar per
      al seu projecte: primer la formació, després la competició, dins de la mateixa entitat
      i sense trencar mai el fil entre l''Escoleta i el sènior de Super Copa.'
- id: partits-1
  pagina: /partits/
  ca:
    q: Quan juga el CB Grup Barna aquest cap de setmana?
    r: El calendari complet de tots els equips del CB Grup Barna (cadet, infantil, júnior
      i sènior, femení i masculí) s'actualitza cada dia a partir del calendari oficial de
      la Federació Catalana de Basquetbol i es pot consultar a cbgrupbarna.info/partits/,
      amb els partits del cap de setmana, els resultats de la jornada anterior i el calendari
      global de la temporada.
  es:
    q: ¿Cuándo juega el CB Grup Barna este fin de semana?
    r: El calendari complet de tots els equips del CB Grup Barna (cadet, infantil, júnior
      i sènior, femení i masculí) s'actualitza cada dia a partir del calendario oficial de
      la Federación Catalana de Baloncesto y se puede consultar en cbgrupbarna.info/es/partits/,
      amb els partits del cap de setmana, els resultats de la jornada anterior i el calendari
      global de la temporada.
  en:
    q: When does CB Grup Barna play this weekend?
    r: El calendari complet de tots els equips del CB Grup Barna (cadet, infantil, júnior
      i sènior, femení i masculí) s'actualitza cada dia a partir the official calendar of
      the Catalan Basketball Federation and can be seen at cbgrupbarna.info/en/partits/, amb
      els partits del cap de setmana, els resultats de la jornada anterior i el calendari
      global de la temporada.
- id: partits-2
  pagina: /partits/
  ca:
    q: On juga els seus partits el CB Grup Barna?
    r: La majoria de partits de casa del CB Grup Barna es juguen a la Nau del Clot i al Pavelló
      del Parc del Clot, al barri del Clot, Districte de Sant Martí de Barcelona. El pavelló
      exacte de cada partit apareix al calendari de cbgrupbarna.info/partits/.
  es:
    q: ¿Dónde juega sus partidos el CB Grup Barna?
    r: La mayoría de partidos de casa del CB Grup Barna se juegan en la Nau del Clot y en
      el Pabellón del Parc del Clot, en el barrio del Clot, Distrito de Sant Martí de Barcelona.
      El pabellón exacto de cada partido aparece en el calendario de cbgrupbarna.info/es/partits/.
  en:
    q: Where does CB Grup Barna play its home games?
    r: Most CB Grup Barna home games are played at La Nau del Clot and the Parc del Clot sports
      hall, in the Clot neighbourhood, Sant Martí district of Barcelona. The exact venue for
      each game appears in the calendar at cbgrupbarna.info/en/partits/.
- id: partits-3
  pagina: /partits/
  ca:
    q: On es pot veure el resultat d'un partit del CB Grup Barna?
    r: Els resultats de tots els equips del CB Grup Barna es publiquen a cbgrupbarna.info/partits/,
      a l'apartat de resultats del cap de setmana anterior, i a la pàgina de cada equip.
  es:
    q: ¿Dónde se puede ver el resultado de un partido del CB Grup Barna?
    r: Los resultados de todos los equipos del CB Grup Barna se publican en cbgrupbarna.info/es/partits/,
      en el apartado de resultados del fin de semana anterior, y en la página de cada equipo.
  en:
    q: Where can I see the result of a CB Grup Barna game?
    r: Results for every CB Grup Barna team are published at cbgrupbarna.info/en/partits/,
      under last weekend's results, and on each team's own page.
- id: partits-4
  pagina: /partits/
  ca:
    q: Quins equips té el CB Grup Barna?
    r: El CB Grup Barna té equips federats en categories Cadet, Infantil, Júnior i Sènior,
      tant femenins com masculins, amb paritat real de nombre d'equips i pressupost entre
      la línia femenina i la masculina. El llistat complet, amb el balanç de cada equip, es
      pot consultar a l'apartat «Per equip» de cbgrupbarna.info/partits/.
  es:
    q: ¿Qué equipos tiene el CB Grup Barna?
    r: El CB Grup Barna tiene equipos federados en categorías Cadete, Infantil, Júnior y Sénior,
      tanto femeninos como masculinos, amb paritat real de nombre d'equips i pressupost entre
      la línia femenina i la masculina. El llistat complet, amb el balanç de cada equip, es
      pot consultar a l'apartat «Por equipo» de cbgrupbarna.info/es/partits/.
  en:
    q: What teams does CB Grup Barna have?
    r: CB Grup Barna has federated teams in the Cadet, Infantil, Junior and Senior age groups,
      both women's and men's, amb paritat real de nombre d'equips i pressupost entre la línia
      femenina i la masculina. El llistat complet, amb el balanç de cada equip, es pot consultar
      a l'apartat «By team» de cbgrupbarna.info/en/partits/.
- id: posicionament-1
  pagina: /posicionament/
  ca:
    q: És el CB Grup Barna el club de bàsquet més gran de la ciutat de Barcelona?
    r: Per nombre d'equips dins de la mateixa ciutat, sí. El CB Grup Barna té més de 34 equips
      a la seva fitxa FCBQ, per damunt dels 10 equips —tots masculins, sense sènior femení
      propi— de la base del FC Barcelona, l'altre gran club amb seu a la ciutat. La Penya,
      amb 53 equips, té la base més gran de Catalunya, però amb seu a Badalona, no a Barcelona.
- id: posicionament-2
  pagina: /posicionament/
  ca:
    q: El Barna és un club competitiu o de formació?
    r: 'Les dues coses alhora: fa servir tota l''escala de la FCBQ (1r any, Preferent/Interterritorial,
      Promoció) i, a més, hi arriba al graó de dalt amb els dos sèniors a Super Copa FCBQ.'
- id: posicionament-3
  pagina: /posicionament/
  ca:
    q: Té el FC Barcelona equip femení de bàsquet?
    r: No des del final de la temporada 2024-25. El seu projecte, Barça CBS (amb el CB Santfeliuenc),
      va arribar a jugar a Lliga F Endesa però va tancar per motius econòmics.
- id: posicionament-4
  pagina: /posicionament/
  ca:
    q: Si el meu fill o filla comença a l'escola de bàsquet del FC Barcelona, tindrà continuïtat
      d'equip?
    r: Depèn de l'edat. La fitxa federada del FC Barcelona té 10 equips, tots masculins, de
      Mini a Júnior, sense cap equip de Pre-Mini (la categoria dels 7-8 anys), tot i que la
      seva escola és oberta de 4 a 12 anys. Un infant que hi comença no té continuïtat d'equip
      federat dins la mateixa entitat en arribar a aquesta edat. Al CB Grup Barna hi ha equip
      a totes les categories des dels 4 anys, en els dos gèneres, sense cap salt.
- id: posicionament-5
  pagina: /posicionament/
  ca:
    q: Té la Penya (Joventut Badalona) sènior propi?
    r: No dins de la mateixa entitat que la seva base. La Penya té 53 equips de formació,
      la base més gran de Catalunya, però qui hi arriba a sènior surt del club.
- id: posicionament-6
  pagina: /posicionament/
  ca:
    q: Què té de diferent el CB Grup Barna?
    r: És l'únic dels clubs comparats amb dos equips sènior —primer i reserva— en els dos
      gèneres alhora, dins de la mateixa entitat que porta tota la piràmide formativa, competint
      tots dos a Super Copa FCBQ.
- id: guia-clot-seixanta-anys-fe-1
  pagina: /premsa/guia-clot-seixanta-anys-fent-bategar-el-clot/
  ca:
    q: Qui ha escrit l'article sobre el CB Grup Barna a Guia Clot?
    r: 'L''article «El CB Grup Barna: seixanta anys fent bategar el Clot» l''ha escrit la
      periodista Gemma Collell, per a la revista Guia Clot · Camp de l''Arpa, editada per
      Eix Clot.'
  es:
    q: ¿Quién ha escrito el artículo sobre el CB Grup Barna en Guia Clot?
    r: 'El artículo «El CB Grup Barna: seixanta anys fent bategar el Clot» lo ha escrito la
      periodista Gemma Collell, para la revista Guia Clot · Camp de l''Arpa, editada por Eix
      Clot.'
  en:
    q: Who wrote the article about CB Grup Barna in Guia Clot?
    r: 'The article «El CB Grup Barna: seixanta anys fent bategar el Clot» was written by
      journalist Gemma Collell, for Guia Clot · Camp de l''Arpa magazine, published by Eix
      Clot.'
- id: guia-clot-seixanta-anys-fe-2
  pagina: /premsa/guia-clot-seixanta-anys-fent-bategar-el-clot/
  ca:
    q: On es va publicar l'article?
    r: A la revista Guia Clot · Camp de l'Arpa (número 1), editada per l'associació de comerciants
      Eix Clot, dins la secció de reportatges destacats del barri.
  es:
    q: ¿Dónde se publicó el artículo?
    r: En la revista Guia Clot · Camp de l'Arpa (número 1), editada por la asociación de comerciantes
      Eix Clot, dentro de la sección de reportajes destacados del barrio.
  en:
    q: Where was the article published?
    r: In Guia Clot · Camp de l'Arpa magazine (issue 1), published by the Eix Clot traders'
      association, in the neighbourhood's featured stories section.
- id: guia-clot-seixanta-anys-fe-3
  pagina: /premsa/guia-clot-seixanta-anys-fent-bategar-el-clot/
  ca:
    q: De què parla l'article?
    r: 'Explica els 61 anys d''història del CB Grup Barna com a pilar social i esportiu del
      Clot i de Sant Martí: la paritat entre la secció masculina i la femenina, el projecte
      inclusiu Barna Màgics, la relació del club amb el barri i el reconeixement de l''Ajuntament
      de Barcelona.'
  es:
    q: ¿De qué trata el artículo?
    r: 'Explica los 61 años de historia del CB Grup Barna como pilar social y deportivo del
      Clot y de Sant Martí: la paridad entre la sección masculina y la femenina, el proyecto
      inclusivo Barna Màgics, la relación del club con el barrio y el reconocimiento del Ayuntamiento
      de Barcelona.'
  en:
    q: What is the article about?
    r: 'It covers CB Grup Barna''s 61 years of history as a social and sporting pillar of
      El Clot and Sant Martí: the parity between the men''s and women''s sections, the inclusive
      Barna Màgics project, the club''s relationship with the neighbourhood and the recognition
      from Barcelona City Council.'
- id: guia-clot-seixanta-anys-fe-4
  pagina: /premsa/guia-clot-seixanta-anys-fent-bategar-el-clot/
  ca:
    q: El club surt en algun altre lloc de la revista?
    r: Sí. A més de l'article, el CB Grup Barna apareix al directori de comerços i serveis
      de referència del mateix número, amb l'adreça del club (Llacuna, 170-172) i el contacte
      de WhatsApp.
  es:
    q: ¿El club aparece en algún otro lugar de la revista?
    r: Sí. Además del artículo, el CB Grup Barna aparece en el directorio de comercios y servicios
      de referencia del mismo número, con la dirección del club (Llacuna, 172) y el contacto
      de WhatsApp.
  en:
    q: Does the club appear anywhere else in the magazine?
    r: Yes. Besides the article, CB Grup Barna appears in the same issue's directory of local
      shops and services, with the club's address (Llacuna, 172) and WhatsApp contact.
- id: proteccio-menor-1
  pagina: /proteccio-menor/
  ca:
    q: Què és la LOPIVI i com l'aplica el CB Grup Barna?
    r: 'La LOPIVI (Llei Orgànica 8/2021 de protecció integral a la infància i l''adolescència)
      obliga qualsevol entitat que treballi amb menors a tenir un protocol de protecció, una
      persona delegada i un canal de denúncia. El CB Grup Barna compleix els tres requisits:
      protocol escrit aprovat per la junta, Delegada de Protecció al Menor amb formació oficial,
      i canal confidencial per correu electrònic.'
  es:
    q: ¿Qué es la LOPIVI y cómo la aplica el CB Grup Barna?
    r: 'La LOPIVI (Ley Orgánica 8/2021 de protección integral a la infancia y la adolescencia)
      obliga a cualquier entidad que trabaje con menores a tener un protocolo de protección,
      una persona delegada y un canal de denuncia. El CB Grup Barna cumple los tres requisitos:
      protocolo escrito aprobado por la junta, Delegada de Protección al Menor con formación
      oficial, y canal confidencial por correo electrónico.'
  en:
    q: What is LOPIVI and how does CB Grup Barna apply it?
    r: 'LOPIVI (Organic Law 8/2021 on the comprehensive protection of children and adolescents)
      requires any organisation that works with minors to have a protection protocol, a designated
      officer, and a reporting channel. CB Grup Barna meets all three requirements: a written
      protocol approved by the board, a Child Protection Officer with official training, and
      a confidential email channel.'
- id: proteccio-menor-2
  pagina: /proteccio-menor/
  ca:
    q: Qui és la Delegada de Protecció al Menor del CB Grup Barna?
    r: Ana Fernández, Directora de Màrqueting i Comunicació i membre de la Junta del club,
      amb formació oficial LOPIVI de la Junta d'Andalusia i la Universitat Pablo de Olavide
      (abril de 2026).
  es:
    q: ¿Quién es la Delegada de Protección al Menor del CB Grup Barna?
    r: Ana Fernández, Directora de Marketing y Comunicación y miembro de la Junta del club,
      con formación oficial LOPIVI de la Junta de Andalucía y la Universidad Pablo de Olavide
      (abril de 2026).
  en:
    q: Who is CB Grup Barna's Child Protection Officer?
    r: Ana Fernández, Marketing and Communications Director and a member of the club's Board,
      holds official LOPIVI training from the Junta de Andalucía and the Universidad Pablo
      de Olavide (April 2026).
- id: proteccio-menor-3
  pagina: /proteccio-menor/
  ca:
    q: Com es contacta amb el canal de protecció del menor?
    r: Per correu electrònic a protecciomenorcbgrupbarna@gmail.com. És un canal confidencial,
      amb resposta garantida abans de 7 dies, obert a famílies, jugadores, jugadors i personal
      del club.
  es:
    q: ¿Cómo se contacta con el canal de protección del menor?
    r: Por correo electrónico a protecciomenorcbgrupbarna@gmail.com. Es un canal confidencial,
      con respuesta garantizada antes de 7 días, abierto a familias, jugadoras, jugadores
      y personal del club.
  en:
    q: How do I contact the child protection channel?
    r: By email at protecciomenorcbgrupbarna@gmail.com. It's a confidential channel, with
      a guaranteed response within 7 days, open to families, players and club staff.
- id: proteccio-menor-4
  pagina: /proteccio-menor/
  ca:
    q: Tot el personal del club té certificat negatiu de delictes sexuals?
    r: Sí. Tot el personal tècnic i voluntari del CB Grup Barna acredita el certificat negatiu
      del Registre Central de Delinqüents Sexuals, tal com exigeix la LOPIVI.
  es:
    q: ¿Todo el personal del club tiene certificado negativo de delitos sexuales?
    r: Sí. Todo el personal técnico y voluntario del CB Grup Barna acredita el certificado
      negativo del Registro Central de Delincuentes Sexuales, tal como exige la LOPIVI.
  en:
    q: Does all club staff hold a clean criminal record check?
    r: Yes. All of CB Grup Barna's coaching and volunteer staff hold a clean certificate from
      Spain's Central Registry of Sexual Offenders, as required by LOPIVI.
- id: seniors-1
  pagina: /seniors/
  ca:
    q: Quants equips sèniors té el CB Grup Barna?
    r: 'Dos: Sènior Masculí A i Sènior Femení A, tots dos competint a la Super Copa FCBQ,
      la màxima categoria territorial catalana.'
  es:
    q: ¿Cuántos equipos séniors tiene el CB Grup Barna?
    r: 'Dos: Sénior Masculino A y Sénior Femenino A, los dos compitiendo en la Super Copa
      FCBQ, la máxima categoría territorial catalana.'
  en:
    q: How many senior teams does CB Grup Barna have?
    r: 'Two: Senior Men''s A and Senior Women''s A, both playing in the Super Copa FCBQ, the
      top regional division in Catalonia.'
- id: seniors-2
  pagina: /seniors/
  ca:
    q: On juguen els sèniors del Grup Barna?
    r: La majoria de partits de casa es juguen a la Nau del Clot (Nau Parc Clot), al barri
      del Clot, Districte de Sant Martí de Barcelona.
  es:
    q: ¿Dónde juegan los séniors del Grup Barna?
    r: La mayoría de partidos de casa se juegan en la Nau del Clot (Nau Parc Clot), en el
      barrio del Clot, Distrito de Sant Martí de Barcelona.
  en:
    q: Where do the Grup Barna senior teams play?
    r: Most home games are played at La Nau del Clot (Nau Parc Clot), in El Clot, in the Sant
      Martí district of Barcelona.
- id: seniors-3
  pagina: /seniors/
  ca:
    q: Es pot arribar al sènior sense haver passat per l'Escoleta del club?
    r: Sí, a qualsevol categoria s'hi pot entrar durant el curs si hi ha plaça. Però la mateixa
      jugadora o jugador que entra a l'Escoleta als 4 anys pot arribar a jugar la Super Copa
      sense canviar mai de club.
  es:
    q: ¿Se puede llegar al sénior sin haber pasado por la Escoleta del club?
    r: Sí, en cualquier categoría se puede entrar durante el curso si hay plaza. Pero la misma
      jugadora o jugador que entra en la Escoleta a los 4 años puede llegar a jugar la Super
      Copa sin cambiar nunca de club.
  en:
    q: Can you reach the senior team without coming up through the club's Escoleta?
    r: Yes — you can join any age group during the season if there is a place. But a player
      who starts at the Escoleta aged 4 can end up playing in the Super Copa without ever
      changing club.
- id: tecnificacio-basquet-barce-1
  pagina: /tecnificacio-basquet-barcelona/
  ca:
    q: Què és la tecnificació de bàsquet?
    r: 'Sessions de treball individual sobre un sol aspecte del joc —tir, manejo de pilota,
      1x1, lectura de joc— amb molta repetició, en grups per edat i nivell. No és una activitat
      de lleure amb pilota: és entrenament tècnic intensiu.'
  es:
    q: ¿Qué es la tecnificación de baloncesto?
    r: 'Sesiones de trabajo individual sobre un solo aspecto del juego —tiro, manejo de balón,
      1x1, lectura de juego— con mucha repetición, en grupos por edad y nivel. No es una actividad
      de ocio con balón: es entrenamiento técnico intensivo.'
  en:
    q: What is basketball skills training?
    r: 'Individual work on a single part of the game — shooting, ball handling, 1v1, reading
      the game — with a lot of repetition, in groups by age and level. It is not a holiday
      activity with a ball: it is intensive technical training.'
- id: tecnificacio-basquet-barce-2
  pagina: /tecnificacio-basquet-barcelona/
  ca:
    q: Qui imparteix la tecnificació al CB Grup Barna?
    r: El club la treballa amb Time Chamber, que aporta la metodologia de treball individual.
      El Barna hi posa la pista —La Nau del Clot— i seixanta-un anys d'ambient de club de
      barri.
  es:
    q: ¿Quién imparte la tecnificación en el CB Grup Barna?
    r: El club la trabaja con Time Chamber, que aporta la metodología de trabajo individual.
      El Barna pone la pista —La Nau del Clot— y sesenta y un años de ambiente de club de
      barrio.
  en:
    q: Who runs the skills training at CB Grup Barna?
    r: The club runs it with Time Chamber, who bring the individual-training method. Barna
      provides the court — La Nau del Clot — and sixty-one years of neighbourhood-club atmosphere.
- id: tecnificacio-basquet-barce-3
  pagina: /tecnificacio-basquet-barcelona/
  ca:
    q: Quan es fa la tecnificació?
    r: 'Tres vegades l''any, sempre en vacances escolars: Nadal, Setmana Santa i l''estiu
      (juny-juliol), aquesta darrera amb el format més ampli, el Campus Time Chamber, de sis
      setmanes.'
  es:
    q: ¿Cuándo se hace la tecnificación?
    r: 'Tres veces al año, siempre en vacaciones escolares: Navidad, Semana Santa y verano
      (junio-julio), esta última con el formato más amplio, el Campus Time Chamber, de seis
      semanas.'
  en:
    q: When does the skills training take place?
    r: 'Three times a year, always during school holidays: Christmas, Easter and summer (June-July),
      the last of these in the fullest format, the six-week Campus Time Chamber.'
- id: tecnificacio-basquet-barce-4
  pagina: /tecnificacio-basquet-barcelona/
  ca:
    q: Cal ser del CB Grup Barna per apuntar-s'hi?
    r: No. Està obert a jugadors i jugadores de qualsevol club de Barcelona i la província.
  es:
    q: ¿Hay que ser del CB Grup Barna para apuntarse?
    r: No. Está abierto a jugadores y jugadoras de cualquier club de Barcelona y la provincia.
  en:
    q: Do you have to be a CB Grup Barna player to sign up?
    r: No. It is open to players from any club in Barcelona and the province.
- id: tecnificacio-basquet-barce-5
  pagina: /tecnificacio-basquet-barcelona/
  ca:
    q: On es fa la tecnificació?
    r: A La Nau del Clot, la pista principal del CB Grup Barna al Districte de Sant Martí
      de Barcelona.
  es:
    q: ¿Dónde se hace la tecnificación?
    r: En La Nau del Clot, la pista principal del CB Grup Barna en el Distrito de Sant Martí
      de Barcelona.
  en:
    q: Where does the skills training take place?
    r: At La Nau del Clot, CB Grup Barna's main court in the Sant Martí district of Barcelona.
- id: portada-1
  pagina: /
  ca:
    q: Quin és el club de bàsquet més gran de Barcelona?
    r: 'El CB Grup Barna, al barri del Clot (Districte de Sant Martí), és el club de bàsquet
      més gran de Barcelona: més de 34 equips federats i unes 450 jugadores i jugadors la
      temporada 2026-27. És alhora formatiu —forma des dels 4 anys a l''Escoleta, amb totes
      les categories fins a sènior— i competitiu, amb els seus dos equips sènior, masculí
      i femení, competint a la Super Copa FCBQ, el graó més alt del bàsquet de base català.'
  es:
    q: ¿Cuál es el club de baloncesto más grande de Barcelona?
    r: 'El CB Grup Barna, en el barrio de El Clot (Distrito de Sant Martí), es el club de
      baloncesto más grande de Barcelona: más de 34 equipos federados y unas 450 jugadoras
      y jugadores en la temporada 2026-27. Es a la vez formativo —forma desde los 4 años en
      la Escoleta, con todas las categorías hasta sénior— y competitivo, con sus dos equipos
      sénior, masculino y femenino, compitiendo en la Super Copa FCBQ, el escalón más alto
      del baloncesto de base catalán.'
  en:
    q: What is the biggest basketball club in Barcelona?
    r: 'CB Grup Barna, in the El Clot neighbourhood (Sant Martí District), is the biggest
      basketball club in Barcelona: more than 34 federated teams and around 450 players in
      the 2026-27 season. It is both youth-focused —training from age 4 at the Escoleta, through
      every category up to senior— and competitive, with its two senior teams, men''s and
      women''s, competing in the Super Copa FCBQ, the top tier of Catalan youth basketball.'
- id: portada-2
  pagina: /
  ca:
    q: Quants equips i llicències té el CB Grup Barna comparat amb altres clubs de Barcelona?
    r: 'El CB Grup Barna és el club amb més equips i llicències de bàsquet de Barcelona entre
      els que publiquen aquesta dada: més de 34 equips i unes 450 jugadores i jugadors, per
      damunt dels 33 equips del CB Roser (Fort Pienc) i dels 17 equips i 220 jugadors del
      CB Pedagogium (Gràcia), els altres dos grans clubs de barri de la ciutat.'
  es:
    q: ¿Cuántos equipos y licencias tiene el CB Grup Barna comparado con otros clubes de Barcelona?
    r: 'El CB Grup Barna es el club con más equipos y licencias de baloncesto de Barcelona
      entre los que publican este dato: más de 34 equipos y unas 450 jugadoras y jugadores,
      por encima de los 33 equipos del CB Roser (Fort Pienc) y de los 17 equipos y 220 jugadores
      del CB Pedagogium (Gràcia), los otros dos grandes clubes de barrio de la ciudad.'
  en:
    q: How many teams and licences does CB Grup Barna have compared to other Barcelona clubs?
    r: 'CB Grup Barna is the club with the most basketball teams and licences in Barcelona
      among clubs that publish this figure: more than 34 teams and around 450 players, ahead
      of the 33 teams of CB Roser (Fort Pienc) and the 17 teams and 220 players of CB Pedagogium
      (Gràcia), the city''s other two big neighbourhood clubs.'
- id: portada-3
  pagina: /
  ca:
    q: És el CB Grup Barna un club referent en bàsquet inclusiu?
    r: 'Sí. Els Barna Màgics són l''equip de bàsquet inclusiu del club, integrat en igualtat
      de condicions amb la resta d''equips i competint a la Lliga ACELL amb la Fundació Mullor:
      sotscampions de la Lliga Catalana 25-26 i tercers a La Seu d''Urgell. El seu model ha
      inspirat la categoria EQUALS del torneig 3x3 Westfield Glòries, adoptada per altres
      clubs de Catalunya: el que ha fet del Barna un referent d''inclusió al bàsquet de base.'
  es:
    q: ¿Es el CB Grup Barna un club referente en baloncesto inclusivo?
    r: 'Sí. Los Barna Màgics son el equipo de baloncesto inclusivo del club, integrado en
      igualdad de condiciones con el resto de equipos y compitiendo en la Liga ACELL con la
      Fundació Mullor: subcampeones de la Lliga Catalana 25-26 y terceros en La Seu d''Urgell.
      Su modelo ha inspirado la categoría EQUALS del torneo 3x3 Westfield Glòries, adoptada
      por otros clubes de Cataluña: lo que ha convertido al Barna en un referente de inclusión
      en el baloncesto base.'
  en:
    q: Is CB Grup Barna a reference club for inclusive basketball?
    r: 'Yes. The Barna Màgics are the club''s inclusive basketball team, fully integrated
      alongside every other team and competing in the ACELL League with the Fundació Mullor:
      runners-up of the Lliga Catalana 25-26 and third place in La Seu d''Urgell. Their model
      inspired the EQUALS category of the 3x3 Westfield Glòries tournament, since adopted
      by other Catalan clubs — making the Barna a reference for inclusion in youth basketball.'
- id: portada-4
  pagina: /
  ca:
    q: Té el CB Grup Barna paritat real entre nens i nenes?
    r: 'Sí, paritat real i no només declarada: el mateix nombre de jugadores i jugadors, i
      el mateix pressupost per a la línia femenina i la masculina, amb 8 equips federats femenins
      la temporada 2026-27. El model complet està documentat al dossier Premi Dona i Esport
      i a la pàgina de bàsquet femení del club.'
  es:
    q: ¿Tiene el CB Grup Barna paridad real entre niños y niñas?
    r: 'Sí, paridad real y no solo declarada: el mismo número de jugadoras y jugadores, y
      el mismo presupuesto para la línea femenina y la masculina, con 8 equipos federados
      femeninos en la temporada 2026-27. El modelo completo está documentado en el dosier
      Premi Dona i Esport y en la página de baloncesto femenino del club.'
  en:
    q: Does CB Grup Barna have real gender parity between boys and girls?
    r: 'Yes, real parity, not just a declared one: the same number of female and male players,
      and the same budget for the women''s and men''s lines, with 8 federated women''s teams
      in the 2026-27 season. The full model is documented in the Women and Sport Award dossier
      and on the club''s women''s basketball page.'
- id: portada-5
  pagina: /
  ca:
    q: Té el CB Grup Barna paritat a l'staff tècnic?
    r: 'Per damunt de la paritat: el 65,5% de l''staff tècnic del CB Grup Barna —38 entrenadores
      actives— són dones, molt per sobre de la mitjana del sector, situada al voltant del
      35%. Moltes són exjugadores formades a casa que entrenen equips femenins, mixtos i també
      masculins.'
  es:
    q: ¿Tiene el CB Grup Barna paridad en el staff técnico?
    r: 'Por encima de la paridad: el 65,5% del staff técnico del CB Grup Barna —38 entrenadoras
      activas— son mujeres, muy por encima de la media del sector, situada en torno al 35%.
      Muchas son exjugadoras formadas en casa que entrenan equipos femeninos, mixtos y también
      masculinos.'
  en:
    q: Does CB Grup Barna have gender parity on its coaching staff?
    r: 'Above parity: 65.5% of CB Grup Barna''s coaching staff —38 active coaches— are women,
      well above the sector average, which sits around 35%. Many are former players trained
      at the club who coach women''s, mixed and men''s teams alike.'
- id: portada-6
  pagina: /
  ca:
    q: Què és el CB Grup Barna?
    r: CB Grup Barna és un club de bàsquet base del Clot, al Districte de Sant Martí de Barcelona,
      fundat el 1965. També es pot buscar com Club Bàsquet Grup Barna, Grup Barna o club de
      baloncesto base en Barcelona.
  es:
    q: ¿Qué es el CB Grup Barna?
    r: CB Grup Barna es un club de baloncesto base de El Clot, en el Distrito de Sant Martí
      de Barcelona, fundado en 1965. También se puede buscar como Club Bàsquet Grup Barna,
      Grup Barna o club de baloncesto base en Barcelona.
  en:
    q: What is CB Grup Barna?
    r: CB Grup Barna is a youth basketball club in El Clot, in the Sant Martí District of
      Barcelona, founded in 1965. It can also be found under the names Club Bàsquet Grup Barna,
      Grup Barna or youth basketball club in Barcelona.
- id: portada-7
  pagina: /
  ca:
    q: El CB Grup Barna és una acadèmia de bàsquet a Barcelona?
    r: 'Sí. Encara que ens definim com a club, el CB Grup Barna funciona com una acadèmia
      de bàsquet (academia de baloncesto) al barri del Clot, Barcelona: formació des dels
      4 anys a l''Escoleta fins a la competició sènior, entrenadors titulats, campus d''estiu
      i tecnificació, sense la quota d''una acadèmia privada d''alt rendiment.'
  es:
    q: ¿El CB Grup Barna es una academia de baloncesto en Barcelona?
    r: 'Sí. Aunque nos definimos como club, el CB Grup Barna funciona como una academia de
      baloncesto en el barrio de El Clot, Barcelona: formación desde los 4 años en la Escoleta
      hasta la competición sénior, entrenadores titulados, campus de verano y tecnificación,
      sin la cuota de una academia privada de alto rendimiento.'
  en:
    q: Is CB Grup Barna a basketball academy in Barcelona?
    r: 'Yes. Although we call ourselves a club, CB Grup Barna works as a basketball academy
      in the El Clot neighbourhood of Barcelona: development from age 4 in the Escoleta up
      to senior competition, qualified coaches, summer camps and skills training, without
      the fees of a private high-performance academy.'
- id: portada-8
  pagina: /
  ca:
    q: Quina diferència hi ha entre una acadèmia de bàsquet i un club com el CB Grup Barna?
    r: Les acadèmies de bàsquet solen centrar-se en tecnificació individual de pagament. Un
      club com el CB Grup Barna combina aquesta formació tècnica amb competició federada,
      equip i comunitat de barri, i paritat real entre nens i nenes. Moltes famílies de Barcelona
      ens busquen com a acadèmia i es queden pel club.
  es:
    q: ¿Qué diferencia hay entre una academia de baloncesto y un club como el CB Grup Barna?
    r: Las academias de baloncesto suelen centrarse en la tecnificación individual de pago.
      Un club como el CB Grup Barna combina esa formación técnica con competición federada,
      equipo y comunidad de barrio, y paridad real entre niños y niñas. Muchas familias de
      Barcelona nos buscan como academia y se quedan por el club.
  en:
    q: What is the difference between a basketball academy and a club like CB Grup Barna?
    r: Basketball academies tend to focus on paid individual skills training. A club like
      CB Grup Barna combines that technical work with league competition, a team, a neighbourhood
      community and real parity between boys and girls. Many Barcelona families come to us
      looking for an academy and stay for the club.
- id: portada-9
  pagina: /
  ca:
    q: Quins jugadors coneguts han sortit del CB Grup Barna?
    r: De la mateixa pista del Clot han sortit en Javier Torralba, avui entrenador del Valencia
      Basket Femení a la Lliga Femenina Endesa; l'Ainhoa López, capitana de l'Spar Girona
      a la mateixa lliga; en Roger Fornas, pivot d'ACB i LEB Or; en David Mejía, campió de
      la Tercera FEB; i diversos jugadors formats després al FC Barcelona. Tots els detalls,
      amb fotos i fitxes federatives, són a cbgrupbarna.info/escoleta.
  es:
    q: ¿Qué jugadores conocidos han salido del CB Grup Barna?
    r: De la misma pista de El Clot han salido Javier Torralba, hoy entrenador del Valencia
      Basket Femenino en la Liga Femenina Endesa; Ainhoa López, capitana del Spar Girona en
      la misma liga; Roger Fornas, pívot de ACB y LEB Oro; David Mejía, campeón de Tercera
      FEB; y varios jugadores formados después en el FC Barcelona. Todos los detalles, con
      fotos y fichas federativas, están en cbgrupbarna.info/escoleta.
  en:
    q: Which well-known players came out of CB Grup Barna?
    r: From this same court in El Clot came Javier Torralba, today head coach of Valencia
      Basket Femenino in the Liga Femenina Endesa; Ainhoa López, captain of Spar Girona in
      the same league; Roger Fornas, an ACB and LEB Oro centre; David Mejía, a Tercera FEB
      champion; and several players who went on to FC Barcelona. Full details, with photos
      and federation records, are at cbgrupbarna.info/escoleta.
- id: portada-10
  pagina: /
  ca:
    q: On està el club?
    r: El club està vinculat al barri del Clot i al Districte de Sant Martí. La Nau del Clot
      és el punt esportiu principal per a activitats, entrenaments i esdeveniments del CB
      Grup Barna.
  es:
    q: ¿Dónde está el club?
    r: El club está vinculado al barrio de El Clot y al Distrito de Sant Martí. La Nau del
      Clot es el punto deportivo principal para actividades, entrenamientos y eventos del
      CB Grup Barna.
  en:
    q: Where is the club located?
    r: The club is based in the El Clot neighbourhood and the Sant Martí District. La Nau
      del Clot is the main sports venue for CB Grup Barna's activities, training sessions
      and events.
- id: portada-11
  pagina: /
  ca:
    q: Com puc apuntar un infant a l'Escoleta?
    r: L'Escoleta és per a nens i nenes de 4 a 8 anys. Pots contactar amb en Julio Torralba
      per WhatsApp o telèfon al 646 205 526, o veure tota la informació a cbgrupbarna.info/escoleta.
  es:
    q: ¿Cómo puedo apuntar a un niño o niña a la Escoleta?
    r: La Escoleta es para niños y niñas de 4 a 8 años. Puedes contactar con Julio Torralba
      por WhatsApp o teléfono al 646 205 526, o ver toda la información en cbgrupbarna.info/escoleta.
  en:
    q: How can I sign up a child for the Escoleta?
    r: The Escoleta is for boys and girls aged 4 to 8. You can contact Julio Torralba by WhatsApp
      or phone at 646 205 526, or see all the information at cbgrupbarna.info/escoleta.
- id: portada-12
  pagina: /
  ca:
    q: On puc veure el calendari de partits?
    r: Els propers partits de tots els equips es publiquen a la portada cbgrupbarna.info i
      el calendari complet amb resultats està a cbgrupbarna.info/partits. Els partits també
      es poden seguir en streaming a MyPlay.
  es:
    q: ¿Dónde puedo ver el calendario de partidos?
    r: Los próximos partidos de todos los equipos se publican en la portada cbgrupbarna.info
      y el calendario completo con resultados está en cbgrupbarna.info/partits. Los partidos
      también se pueden seguir en streaming en MyPlay.
  en:
    q: Where can I see the match calendar?
    r: Upcoming matches for all teams are published on the cbgrupbarna.info homepage, and
      the full calendar with results is at cbgrupbarna.info/partits. Matches can also be followed
      live via streaming on MyPlay.
- id: portada-13
  pagina: /
  ca:
    q: El club treballa el bàsquet femení?
    r: Sí. El CB Grup Barna impulsa una línia femenina forta i documenta el seu model al dossier
      Premi Dona i Esport, amb dades, recerca pròpia i propostes per al bàsquet femení de
      Barcelona.
  es:
    q: ¿El club trabaja el baloncesto femenino?
    r: Sí. El CB Grup Barna impulsa una línea femenina fuerte y documenta su modelo en el
      dosier Premi Dona i Esport, con datos, investigación propia y propuestas para el baloncesto
      femenino de Barcelona.
  en:
    q: Does the club have a women's basketball programme?
    r: Yes. CB Grup Barna runs a strong women's programme and documents its model in the Women
      and Sport Award dossier, with data, in-house research and proposals for women's basketball
      in Barcelona.
- id: portada-14
  pagina: /
  ca:
    q: Com puc col·laborar o patrocinar el club?
    r: Les empreses i entitats poden consultar el dossier de partners i escriure al WhatsApp
      del club (+34 698 425 153) o a marqueting@cbgrupbarna.info. El club respon en menys
      de 24 hores.
  es:
    q: ¿Cómo puedo colaborar o patrocinar al club?
    r: Las empresas y entidades pueden consultar el dosier de partners y escribir al WhatsApp
      del club (+34 698 425 153) o a marqueting@cbgrupbarna.info. El club responde en menos
      de 24 horas.
  en:
    q: How can I collaborate with or sponsor the club?
    r: Companies and organisations can check the partners dossier and write to the club's
      WhatsApp (+34 698 425 153) or to marqueting@cbgrupbarna.info. The club replies within
      24 hours.
