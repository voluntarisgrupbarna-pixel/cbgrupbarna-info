  ca: {q: "Hi ha ajuts si una família no pot pagar la quota?"}
  es: {q: "¿Hay ayudas si una familia no puede pagar la cuota?"}
  en: {q: "Is there financial help for families who cannot afford the fee?"}

- id: quota-baixa
  pagina: /faq/
  pendent: "Què passa amb la quota si un jugador es dona de baixa a mig any."
  ca: {q: "Què passa si ens hem de donar de baixa a mig any?"}
  es: {q: "¿Qué pasa si tenemos que darnos de baja a mitad de año?"}
  en: {q: "What happens if we have to leave mid-season?"}

- id: equipacio-preu
  pagina: /faq/
  pendent: "Quina equipació és obligatòria, què costa i on es compra."
  ca: {q: "Quina equipació cal comprar i quant costa?"}
  es: {q: "¿Qué equipación hay que comprar y cuánto cuesta?"}
  en: {q: "What kit do we need to buy and how much is it?"}

- id: equip-qui-decideix
  pagina: /basquet-formatiu/
  pendent: "Qui decideix l'equip i si hi ha proves de nivell, i què vol dir equip A i B."
  ca: {q: "Qui decideix a quin equip va i què vol dir equip A i equip B?"}
  es: {q: "¿Quién decide a qué equipo va y qué quiere decir equipo A y equipo B?"}
  en: {q: "Who decides which team a child joins, and what do A and B teams mean?"}

- id: desplacaments
  pagina: /partits/calendaris/
  pendent: >-
    Quants partits es juguen fora al llarg d'una temporada i com s'organitzen
    els desplaçaments (qui porta els nens).
  ca: {q: "Quants desplaçaments hi ha i qui porta els nens als partits de fora?"}
  es: {q: "¿Cuántos desplazamientos hay y quién lleva a los niños a los partidos de fuera?"}
  en: {q: "How many away games are there, and who takes the children?"}

- id: avis-canvis
  pagina: /partits/calendaris/
  pendent: >-
    Per quin canal avisa el club una família si canvia una hora o una pista
    (grup de WhatsApp de l'equip, correu…). El web ja marca «MODIFICAT» set
    dies, però això és el web, no l'avís.
  ca: {q: "Com ens avisen si canvia l'hora o la pista d'un partit?"}
  es: {q: "¿Cómo nos avisan si cambia la hora o la pista de un partido?"}
  en: {q: "How are we told if a game's time or venue changes?"}

- id: faltar-entrenament
  pagina: /faq/
  pendent: "Què s'espera d'una família si un dia el jugador no pot anar a entrenar."
  ca: {q: "Què faig si un dia no pot anar a entrenar?"}
  es: {q: "¿Qué hago si un día no puede ir a entrenar?"}
  en: {q: "What do we do if they cannot make a session?"}

- id: revisio-medica
  pagina: /documents/
  pendent: >-
    Si el club demana revisió mèdica per federar-se. L'assegurança sí que està
    resolta: tota jugadora i jugador federat està cobert per la de la FCBQ.
  ca: {q: "Cal fer revisió mèdica per jugar al club?"}
  es: {q: "¿Hace falta revisión médica para jugar en el club?"}
  en: {q: "Is a medical check-up required to play?"}

- id: coordinador
  pagina: /organigrama/
  pendent: >-
    Qui és la persona de contacte de cada categoria. L'organigrama té la Junta,
    però una família no busca la Junta: busca amb qui parla de la seva
    categoria.
  ca: {q: "Amb qui parlo de la categoria del meu fill?"}
  es: {q: "¿Con quién hablo de la categoría de mi hijo?"}
  en: {q: "Who do I talk to about my child's age group?"}

- id: voluntariat
  pagina: /club/
  pendent: "Com s'apunta algú que vol ser entrenador o voluntari, i què cal."
  ca: {q: "Com puc ser entrenador o voluntari al club?"}
  es: {q: "¿Cómo puedo ser entrenador o voluntario en el club?"}
  en: {q: "How can I coach or volunteer at the club?"}

