preguntes:
- id: po-quan
  pagina: /portes-obertes/
  ca:
    q: Quan són les portes obertes del CB Grup Barna?
    r: 'Tot el setembre. No hi ha una jornada de portes obertes d''un sol dia: durant tot
      el mes qualsevol nen o nena pot venir a fer un entrenament amb nosaltres, sense pagar
      res i sense compromís de quedar-s''hi.'
  es:
    q: ¿Cuándo son las puertas abiertas del CB Grup Barna?
    r: 'Todo septiembre. No hay una jornada de puertas abiertas de un solo día: durante todo
      el mes cualquier niño o niña puede venir a hacer un entrenamiento con nosotros, sin
      pagar nada y sin compromiso de quedarse.'
  en:
    q: When are CB Grup Barna's open days?
    r: 'All through September. There is no single open day: for the whole month any child
      can come and train with us, free of charge and with no commitment to stay.'
- id: po-que-portar
  pagina: /portes-obertes/
  ca:
    q: Què cal portar el primer dia d'entrenament?
    r: Roba d'esport, sabatilles de pista i una ampolla d'aigua. La pilota la posem nosaltres.
      L'entrenament de prova és gratuït.
  es:
    q: ¿Qué hay que llevar el primer día de entrenamiento?
    r: Ropa de deporte, zapatillas de pista y una botella de agua. El balón lo ponemos nosotros.
      El entrenamiento de prueba es gratuito.
  en:
    q: What should we bring on the first training session?
    r: Sports clothes, indoor court shoes and a water bottle. We provide the ball. The trial
      session is free.
- id: po-cal-avisar
  pagina: /portes-obertes/
  ca:
    q: Cal avisar abans de venir a provar un entrenament o em puc presentar?
    r: 'Cal demanar dia abans, perquè cada edat entrena un dia i una hora diferents. Amb el
      nom de la criatura, l''any de naixement i un telèfon o un correu n''hi ha prou: et responem
      el mateix dia amb el dia i l''hora que li toquen.'
  es:
    q: ¿Hay que avisar antes de venir a probar un entrenamiento o me puedo presentar?
    r: 'Hay que pedir día antes, porque cada edad entrena un día y una hora distintos. Con
      el nombre del niño o la niña, el año de nacimiento y un teléfono o un correo basta:
      te respondemos el mismo día con el día y la hora que le tocan.'
  en:
    q: Do we need to book a trial session in advance, or can we just turn up?
    r: 'You need to book, because each age group trains on a different day and time. Just
      send us the child''s name, year of birth and a phone number or email: we reply the same
      day with their day and time.'
- id: po-sense-experiencia
  pagina: /portes-obertes/
  ca:
    q: El meu fill no ha jugat mai a bàsquet. Hi encaixarà?
    r: 'Sí. No cal experiència prèvia: hi ha jugadors i jugadores que hi arriben sense haver
      jugat mai. De 4 a 8 anys van a l''Escoleta, amb equips mixtos i tres grups per edat;
      de 9 anys en amunt, als equips federats per any de naixement. El primer entrenament
      és de prova i gratuït.'
  es:
    q: Mi hijo no ha jugado nunca a baloncesto. ¿Encajará?
    r: 'Sí. No hace falta experiencia previa: hay jugadores y jugadoras que llegan sin haber
      jugado nunca. De 4 a 8 años van a la Escoleta, con equipos mixtos y tres grupos por
      edad; de 9 años en adelante, a los equipos federados por año de nacimiento. El primer
      entrenamiento es de prueba y gratuito.'
  en:
    q: My child has never played basketball. Will they fit in?
    r: 'Yes. No previous experience is needed: plenty of our players arrived having never
      played. Ages 4 to 8 join the Escoleta, in mixed groups by age; from 9 upwards they join
      the league teams, grouped by year of birth. The first session is a free trial.'
- id: po-mirar
  pagina: /portes-obertes/
  ca:
    q: Em puc quedar a mirar l'entrenament?
    r: 'Sí. Si prefereixes venir a veure-ho abans de dir-li res a la criatura, també pots:
      només cal que ens ho diguis en demanar el dia.'
  es:
    q: ¿Me puedo quedar a mirar el entrenamiento?
    r: 'Sí. Si prefieres venir a verlo antes de decirle nada al niño o a la niña, también
      puedes: solo hace falta que nos lo digas al pedir el día.'
  en:
    q: Can I stay and watch the session?
    r: 'Yes. If you would rather come and see it before telling your child anything, that
      is fine too: just say so when you book the day.'
- id: inst-nau-clot
  pagina: /instal-lacions/
  ca:
    q: On és exactament La Nau del Clot?
    r: Al carrer de la Llacuna 170-172, dins del Parc del Clot, 08018 Barcelona. És el pavelló
      de referència del club i la seu principal, al Districte de Sant Martí.
  es:
    q: ¿Dónde está exactamente La Nau del Clot?
    r: En la calle Llacuna 170-172, dentro del Parc del Clot, 08018 Barcelona. Es el pabellón
      de referencia del club y la sede principal, en el Distrito de Sant Martí.
  en:
    q: Where exactly is La Nau del Clot?
    r: At carrer de la Llacuna 170-172, inside Parc del Clot, 08018 Barcelona. It is the club's
      main venue, in the Sant Martí district.
- id: inst-quines-pistes
  pagina: /instal-lacions/
  ca:
    q: A quines pistes entrena i juga el CB Grup Barna?
    r: 'A sis instal·lacions del Districte de Sant Martí, totes properes entre elles: La Nau
      del Clot, Escola Provençals, La Farigola del Clot, La Rambleta del Clot, Escola Casas
      i Claror Marítim.'
  es:
    q: ¿En qué pistas entrena y juega el CB Grup Barna?
    r: 'En seis instalaciones del Distrito de Sant Martí, todas cercanas entre sí: La Nau
      del Clot, Escola Provençals, La Farigola del Clot, La Rambleta del Clot, Escola Casas
      y Claror Marítim.'
  en:
    q: Which courts does CB Grup Barna train and play on?
    r: 'Six venues in the Sant Martí district, all close to each other: La Nau del Clot, Escola
      Provençals, La Farigola del Clot, La Rambleta del Clot, Escola Casas and Claror Marítim.'
- id: inst-quina-toca
  pagina: /instal-lacions/
  ca:
    q: Quina pista li toca al meu equip?
    r: 'Depèn de la categoria i de l''horari, i pot canviar d''una setmana a l''altra. El
      calendari del teu equip ho diu amb exactitud cada setmana: s''actualitza cada dia a
      partir del calendari oficial de la Federació Catalana de Basquetbol.'
  es:
    q: ¿Qué pista le toca a mi equipo?
    r: 'Depende de la categoría y del horario, y puede cambiar de una semana a otra. El calendario
      de tu equipo lo dice con exactitud cada semana: se actualiza a diario a partir del calendario
      oficial de la Federació Catalana de Basquetbol.'
  en:
    q: Which court does my team use?
    r: 'It depends on the age group and the time slot, and it can change from week to week.
      Your team''s calendar has the exact answer every week: it updates daily from the Catalan
      Basketball Federation''s official calendar.'
- id: form-edat-inici
  pagina: /basquet-formatiu/
  ca:
    q: A quina edat pot començar un nen o una nena a jugar a bàsquet?
    r: Al CB Grup Barna es pot començar als 4 anys, a l'Escoleta, sense cap experiència prèvia.
      A partir d'aquí hi ha una categoria per a cada edat fins a l'etapa sènior, a partir
      dels 18 anys.
  es:
    q: ¿A qué edad puede empezar un niño o una niña a jugar a baloncesto?
    r: En el CB Grup Barna se puede empezar a los 4 años, en la Escoleta, sin ninguna experiencia
      previa. A partir de ahí hay una categoría para cada edad hasta la etapa sénior, a partir
      de los 18 años.
  en:
    q: At what age can a child start playing basketball?
    r: At CB Grup Barna you can start at 4, in the Escoleta, with no previous experience.
      From there on there is an age group for every year up to the senior teams, from 18 onwards.
- id: form-mixtos
  pagina: /basquet-formatiu/
  ca:
    q: Hi ha equips mixtos de nens i nenes?
    r: A l'Escoleta els grups són mixtos. A partir de Premini el bàsquet federat català es
      divideix en categoria femenina i masculina, i el CB Grup Barna manté el mateix nombre
      d'equips i el mateix pressupost per a totes dues línies.
  es:
    q: ¿Hay equipos mixtos de niños y niñas?
    r: En la Escoleta los grupos son mixtos. A partir de Premini el baloncesto federado catalán
      se divide en categoría femenina y masculina, y el CB Grup Barna mantiene el mismo número
      de equipos y el mismo presupuesto para las dos líneas.
  en:
    q: Are there mixed teams of boys and girls?
    r: In the Escoleta the groups are mixed. From Premini onwards, Catalan league basketball
      splits into girls' and boys' categories, and CB Grup Barna keeps the same number of
      teams and the same budget for both.
- id: form-sense-experiencia
  pagina: /basquet-formatiu/
  ca:
    q: Necessita experiència prèvia per apuntar-se?
    r: No. La majoria de jugadores i jugadors del club van començar sense haver tocat mai
      una pilota de bàsquet. Es pot entrar en qualsevol categoria durant el curs si hi ha
      plaça, i sempre es pot provar un entrenament abans de decidir.
  es:
    q: ¿Necesita experiencia previa para apuntarse?
    r: No. La mayoría de jugadoras y jugadores del club empezaron sin haber tocado nunca un
      balón de baloncesto. Se puede entrar en cualquier categoría durante el curso si hay
      plaza, y siempre se puede probar un entrenamiento antes de decidir.
  en:
    q: Do they need previous experience to join?
    r: No. Most of the club's players started without ever having touched a basketball. You
      can join any age group during the season if there is a place, and you can always try
      a session before deciding.
- id: form-on-veure-equips
  pagina: /basquet-formatiu/
  ca:
    q: On puc veure els equips i horaris de cada categoria?
    r: Els equips amb competició federada (Infantil, Cadet, Júnior i Sènior) tenen fitxa pròpia
      amb calendari i resultats a cbgrupbarna.info/partits/equips/. Per a Escoleta, Premini,
      Mini i Preinfantil, el millor és escriure per WhatsApp i el club indica el grup i l'horari
      exactes.
  es:
    q: ¿Dónde puedo ver los equipos y horarios de cada categoría?
    r: Los equipos con competición federada (Infantil, Cadete, Júnior y Sénior) tienen ficha
      propia con calendario y resultados en cbgrupbarna.info/partits/equips/. Para Escoleta,
      Premini, Mini y Preinfantil, lo mejor es escribir por WhatsApp y el club indica el grupo
      y el horario exactos.
  en:
    q: Where can I see the teams and times for each age group?
    r: Teams playing in the league (Infantil, Cadet, Júnior and senior) each have their own
      page with fixtures and results at cbgrupbarna.info/partits/equips/. For Escoleta, Premini,
      Mini and Preinfantil, the best thing is to write on WhatsApp and the club will tell
      you the exact group and time.
- id: form-noms-categories
  pagina: /basquet-formatiu/
  ca:
    q: Què vol dir Premini, Mini, Infantil, Cadet i Júnior?
    r: 'Són els noms de les categories per edat del bàsquet català (FCBQ), les mateixes que
      fa servir qualsevol club de Barcelona. Premini i Mini corresponen aproximadament a 7-10
      anys, Preinfantil i Infantil a 10-14 anys, Cadet a 14-16 anys i Júnior a 16-18 anys.
      No cal memoritzar-les: al Grup Barna, digues l''edat i el club t''indica la categoria.'
  es:
    q: ¿Qué quiere decir Premini, Mini, Infantil, Cadete y Júnior?
    r: 'Son los nombres de las categorías por edad del baloncesto catalán (FCBQ), las mismas
      que usa cualquier club de Barcelona. Premini y Mini corresponden aproximadamente a 7-10
      años, Preinfantil e Infantil a 10-14 años, Cadete a 14-16 años y Júnior a 16-18 años.
      No hace falta memorizarlas: en el Grup Barna, di la edad y el club te indica la categoría.'
  en:
    q: What do Premini, Mini, Infantil, Cadet and Júnior mean?
    r: 'They are the names of the age groups in Catalan basketball (FCBQ), the same ones every
      club in Barcelona uses. Premini and Mini are roughly ages 7-10, Preinfantil and Infantil
      10-14, Cadet 14-16 and Júnior 16-18. You do not need to learn them: at Grup Barna, tell
      us the age and the club will tell you the group.'
- id: form-any-naixement
  pagina: /basquet-formatiu/
  ca:
    q: Quin equip li toca segons l'any de naixement?
    r: 'La categoria la decideix l''any de naixement, no l''edat que tingui el dia que ho
      preguntes: és així a tota la Federació Catalana de Basquetbol. Com a referència, l''Escoleta
      va de 4 a 8 anys, Premini i Mini de 8 a 10, Mini i Preinfantil de 10 a 12, Infantil
      de 12 a 14, Cadet de 14 a 16, Júnior de 16 a 18, i Sènior a partir dels 18. Per a la
      confirmació exacta, escriu-nos per WhatsApp amb l''any de naixement i t''ho diem el
      mateix dia.'
  es:
    q: ¿Qué equipo le toca según el año de nacimiento?
    r: 'La categoría la decide el año de nacimiento, no la edad que tenga el día que lo preguntas:
      es así en toda la Federació Catalana de Basquetbol. Como referencia, la Escoleta va
      de 4 a 8 años, Premini y Mini de 8 a 10, Mini y Preinfantil de 10 a 12, Infantil de
      12 a 14, Cadete de 14 a 16, Júnior de 16 a 18, y Sénior a partir de los 18. Para la
      confirmación exacta, escríbenos por WhatsApp con el año de nacimiento y te lo decimos
      el mismo día.'
  en:
    q: Which team is my child in, by year of birth?
    r: 'The age group is decided by year of birth, not by how old they are on the day you
      ask: that is the rule across the Catalan Basketball Federation. As a guide, the Escoleta
      is ages 4 to 8, Premini and Mini 8 to 10, Mini and Preinfantil 10 to 12, Infantil 12
      to 14, Cadet 14 to 16, Júnior 16 to 18, and senior from 18. For an exact answer, message
      us on WhatsApp with the year of birth and we will tell you the same day.'
- id: form-entrenaments-setmana
  pagina: /basquet-formatiu/
  ca:
    q: Quants entrenaments a la setmana hi ha?
    r: 'L''Escoleta entrena dos cops per setmana: dimecres de 17:30 a 18:40 a l''Escola Casas
      i dissabtes de 09:00 a 10:30 a La Nau del Clot. A les categories federades depèn de
      la categoria i del grup; escriu-nos per WhatsApp amb l''edat i t''indiquem els dies
      i les hores exactes.'
  es:
    q: ¿Cuántos entrenamientos a la semana hay?
    r: 'La Escoleta entrena dos veces por semana: miércoles de 17:30 a 18:40 en la Escola
      Casas y sábados de 09:00 a 10:30 en La Nau del Clot. En las categorías federadas depende
      de la categoría y del grupo; escríbenos por WhatsApp con la edad y te indicamos los
      días y las horas exactas.'
  en:
    q: How many training sessions are there each week?
    r: 'The Escoleta trains twice a week: Wednesdays 17:30 to 18:40 at Escola Casas and Saturdays
      09:00 to 10:30 at La Nau del Clot. For the league age groups it depends on the group;
      message us on WhatsApp with the age and we will tell you the exact days and times.'
- id: fotos-retirar-imatge
  pagina: /fotos/
  ca:
    q: Puc demanar que el meu fill o la meva filla no surti a les fotos del club?
    r: Sí, i no cal donar cap explicació. En el cas de menors, la publicació es fa amb l'autorització
      signada per les persones tutores a la fitxa d'inscripció, i es pot retirar quan es vulgui.
      Per treure una imatge concreta, escriu a marqueting@cbgrupbarna.info i la retirem.
  es:
    q: ¿Puedo pedir que mi hijo o mi hija no salga en las fotos del club?
    r: Sí, y no hace falta dar ninguna explicación. En el caso de menores, la publicación
      se hace con la autorización firmada por las personas tutoras en la ficha de inscripción,
      y se puede retirar cuando se quiera. Para quitar una imagen concreta, escribe a marqueting@cbgrupbarna.info
      y la retiramos.
  en:
    q: Can I ask for my child not to appear in the club's photos?
    r: Yes, and you do not need to give a reason. For children, photos are published under
      the consent signed by their guardians on the enrolment form, and that consent can be
      withdrawn at any time. To have a specific image taken down, write to marqueting@cbgrupbarna.info
      and we will remove it.
- id: quota-temporada
  pagina: /faq/
  pendent: El preu de la temporada per categoria. És la pregunta que més es fa i l'única resposta
    que hi ha avui és «cal contactar amb el club», mentre que sí que es publica que una setmana
    de campus val 195 € i un patrocini d'equip, 500 €.
  ca:
    q: Quant costa la temporada al CB Grup Barna?
  es:
    q: ¿Cuánto cuesta la temporada en el CB Grup Barna?
  en:
    q: How much does a season at CB Grup Barna cost?
- id: quota-inclou
  pagina: /faq/
  pendent: 'Què cobreix la quota: fitxa federativa, assegurança, equipació, pistes.'
  ca:
    q: Què inclou la quota?
  es:
    q: ¿Qué incluye la cuota?
  en:
    q: What does the fee cover?
- id: quota-pagament
  pagina: /faq/
  pendent: 'Com es cobra: un sol pagament, mensual o trimestral, i si es domicilia.'
  ca:
    q: Com es paga la quota?
  es:
    q: ¿Cómo se paga la cuota?
  en:
    q: How is the fee paid?
- id: quota-germans
  pagina: /faq/
  pendent: Si hi ha descompte per a germans i de quant.
  ca:
    q: Hi ha descompte per a germans?
  es:
    q: ¿Hay descuento para hermanos?
  en:
    q: Is there a discount for siblings?
