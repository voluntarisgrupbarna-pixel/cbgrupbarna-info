- id: 3x3-1
  pagina: /3x3/
  ca:
    q: Què és el 3×3 Westfield Glòries?
    r: 'És el torneig urbà de bàsquet 3x3 amb punts FIBA que organitzen el CB Grup Barna,
      Time Chamber i Eix Clot al barri del Clot-Glòries de Barcelona. La 3a edició es va jugar
      el 6 i 7 de juny de 2026, repartida en tres seus: Westfield Glòries, La Nau del Clot
      i la Rambleta del Clot.'
  es:
    q: ¿Qué es el 3x3 de Westfield Glòries?
    r: Es el torneo urbano de baloncesto 3x3 que el CB Grup Barna organiza en el centro comercial
      Westfield Glòries de Barcelona, con Time Chamber y el entorno comercial del Clot-Glòries.
      Se juega en pista exterior, en formato 3 contra 3 a una canasta.
  en:
    q: What is the Westfield Glòries 3x3?
    r: It's the street 3x3 basketball tournament that CB Grup Barna organises at the Westfield
      Glòries shopping centre in Barcelona, with Time Chamber and the Clot-Glòries commercial
      area. It's played on an outdoor court, 3-on-3 on a single basket.
- id: 3x3-2
  pagina: /3x3/
  ca:
    q: Qui hi pot jugar?
    r: Hi ha 10 categories, de l'Escoleta (6-7 anys) als sèniors i veterans, més la categoria
      inclusiva Barna Màgics. No cal estar federat per apuntar-se a les categories obertes;
      als sèniors, en canvi, es reparteixen punts del rànquing mundial FIBA 3x3.
  es:
    q: ¿Quién puede jugar?
    r: Hay categorías de base y categorías abiertas, de manera que pueden jugar tanto equipos
      de clubes como grupos de amigos. No hace falta estar federado para apuntarse a las categorías
      abiertas.
  en:
    q: Who can play?
    r: There are youth categories and open categories, so both club teams and groups of friends
      can play. You don't need to be a federated player to sign up for the open categories.
- id: 3x3-3
  pagina: /3x3/
  ca:
    q: Com és el format 3x3?
    r: Equips de 3 a 5 jugadors (3 en pista i fins a 2 suplents) a una sola cistella, en mitja
      pista. Partits curts, de 10 minuts o fins a 21 punts, així que en un mateix dia un equip
      pot jugar diverses eliminatòries seguides. És el format olímpic del bàsquet des dels
      Jocs de Tòquio 2021.
  es:
    q: ¿Cómo es el formato 3x3?
    r: Tres jugadores por equipo a una sola canasta, en media pista. Los partidos son cortos
      y seguidos, así que en un mismo día un equipo juega varias eliminatorias. Es el formato
      olímpico del baloncesto desde los Juegos de Tokio.
  en:
    q: What is the 3x3 format like?
    r: Three players per team on a single basket, on a half court. Matches are short and back
      to back, so on a single day a team can play several knockout rounds. It's the Olympic
      basketball format since the Tokyo Games.
- id: 3x3-4
  pagina: /3x3/
  ca:
    q: Quins premis hi ha?
    r: '2.000€ en premis: 1.000€ per al primer equip Sènior Femení i 1.000€ per al primer
      Sènior Masculí, premi paritari únic a Barcelona. La resta de categories reben trofeus,
      medalles i regals de comerços del barri.'
  es:
    q: ¿Qué premios hay?
    r: '2.000 € en premios: 1.000 € para el primer equipo Sénior Femenino y 1.000 € para el
      primer Sénior Masculino, premio paritario único en Barcelona. El resto de categorías
      reciben trofeos, medallas y regalos de comercios del barrio.'
  en:
    q: What are the prizes?
    r: '€2,000 in prizes: €1,000 for the winning senior women''s team and €1,000 for the winning
      senior men''s team, an equal-prize format unique in Barcelona. All other categories
      get trophies, medals and gifts from local shops.'
- id: 3x3-5
  pagina: /3x3/
  ca:
    q: Quan és la propera edició?
    r: Les dates de la 4a edició s'anunciaran en aquesta pàgina, a la web oficial cbgrupbarna-3x3timechamber.com
      i a Instagram (@cbgrupbarna). Qui vulgui rebre l'avís d'obertura d'inscripcions pot
      demanar-ho pel WhatsApp del club.
  es:
    q: ¿Cuándo es la próxima edición?
    r: Las fechas se anuncian en esta página, en la web oficial cbgrupbarna-3x3timechamber.com
      y en Instagram (@cbgrupbarna). El torneo se suele hacer al inicio del verano. Quien
      quiera recibir el aviso de apertura de inscripciones puede pedirlo por el WhatsApp del
      club.
  en:
    q: When is the next edition?
    r: Dates are announced on this page, on the official website cbgrupbarna-3x3timechamber.com
      and on Instagram (@cbgrupbarna). The tournament is usually held at the start of summer.
      Anyone who wants to be notified when registration opens can ask via the club's WhatsApp.
- id: 3x3-6
  pagina: /3x3/
  ca:
    q: On és exactament?
    r: 'A tres seus a menys de 15 minuts a peu: Westfield Glòries (Av. Diagonal 208), La Nau
      del Clot (Carrer de la Llacuna 170-172) i la Rambleta del Clot, al barri del Clot i
      el Districte de Sant Martí de Barcelona.'
  es:
    q: ¿Dónde es exactamente?
    r: En Westfield Glòries, en la plaza de las Glòries Catalanes de Barcelona, junto al barrio
      de El Clot y al Distrito de Sant Martí.
  en:
    q: Where exactly is it?
    r: At Westfield Glòries, on Plaça de les Glòries Catalanes in Barcelona, right next to
      the El Clot neighbourhood and the Sant Martí District.
- id: a-quina-edat-comencar-basq-1
  pagina: /blog/a-quina-edat-comencar-basquet/
  ca:
    q: A quina edat pot començar un nen a jugar a bàsquet?
    r: Als 4 anys ja es pot començar en una escola d'iniciació o escoleta, on es treballa
      motricitat i coordinació amb pilota sense competició federada. La competició comença
      als 8 anys, a premini.
  es:
    q: ¿A qué edad puede empezar un niño a jugar a baloncesto?
    r: A los 4 años ya se puede empezar en una escuela de iniciación o escuelita, donde se
      trabaja motricidad y coordinación con balón sin competición federada. La competición
      empieza a los 8 años, en premini.
  en:
    q: What age can a child start playing basketball?
    r: From age 4, a child can start at an introductory school or escoleta, working on motor
      skills and coordination with a ball, without federated competition. Competition begins
      at age 8, in premini.
- id: a-quina-edat-comencar-basq-2
  pagina: /blog/a-quina-edat-comencar-basquet/
  ca:
    q: Quina és l'edat del minibàsquet?
    r: El minibàsquet és per a nens i nenes de 10 i 11 anys. Es juga amb cistella més baixa
      i pilota més petita que les d'adult. Abans hi ha el premini, de 8 i 9 anys.
  es:
    q: ¿Cuál es la edad del minibasket?
    r: El minibasket es para niños y niñas de 10 y 11 años. Se juega con canasta más baja
      y balón más pequeño que los de adulto. Antes está el premini, de 8 y 9 años.
  en:
    q: What is the minibasket age range?
    r: Minibasket is for children aged 10 and 11. It's played with a lower hoop and a smaller
      ball than the adult versions. Before that comes premini, at ages 8 and 9.
- id: a-quina-edat-comencar-basq-3
  pagina: /blog/a-quina-edat-comencar-basquet/
  ca:
    q: És tard per començar a jugar a bàsquet als 12 anys?
    r: No. Un jugador o jugadora que comença als 12 anys s'incorpora a la categoria que li
      toca per any de naixement i es posa al dia en una temporada. Als clubs de base l'entrada
      no depèn del nivell.
  es:
    q: ¿Es tarde para empezar a jugar a baloncesto a los 12 años?
    r: No. Un jugador o jugadora que empieza a los 12 años se incorpora a la categoría que
      le corresponde por año de nacimiento y se pone al día en una temporada. En los clubes
      de base la entrada no depende del nivel.
  en:
    q: Is it too late to start playing basketball at age 12?
    r: No. A player who starts at age 12 joins the category that matches their birth year
      and catches up within a season. At grassroots clubs, entry doesn't depend on ability.
- id: a-quina-edat-comencar-basq-4
  pagina: /blog/a-quina-edat-comencar-basquet/
  ca:
    q: Nens i nenes entrenen junts?
    r: A les edats d'iniciació (4 a 8 anys) els equips solen ser mixtos. A partir de la competició
      federada es divideixen en categories masculines i femenines.
  es:
    q: ¿Niños y niñas entrenan juntos?
    r: En las edades de iniciación (4 a 8 años) los equipos suelen ser mixtos. A partir de
      la competición federada se dividen en categorías masculinas y femeninas.
  en:
    q: Do boys and girls train together?
    r: At introductory ages (4 to 8) teams are usually mixed. From federated competition onward
      they are split into men's and women's categories.
- id: com-triar-escola-basquet-b-1
  pagina: /blog/com-triar-escola-basquet-barcelona/
  ca:
    q: Què s'ha de mirar en una escola de bàsquet?
    r: 'Els punts que de debò diferencien són: nombre d''entrenadors per grup, si els grups
      estan separats per edat, la proximitat de casa, si el club té equips federats a totes
      les categories per continuar-hi, si té línia femenina real, el cost anual complet i
      si deixen fer un entrenament de prova.'
  es:
    q: ¿Qué hay que mirar en una escuela de baloncesto?
    r: 'Los puntos que de verdad diferencian son: número de entrenadores por grupo, si los
      grupos están separados por edad, la proximidad de casa, si el club tiene equipos federados
      en todas las categorías para continuar, si tiene línea femenina real, el coste anual
      completo y si dejan hacer un entrenamiento de prueba.'
  en:
    q: What should you look for in a basketball school?
    r: 'The points that really make a difference are: number of coaches per group, whether
      groups are split by age, distance from home, whether the club has federated teams in
      every category to continue in, whether it has a real women''s programme, the full annual
      cost, and whether they allow a trial session.'
- id: com-triar-escola-basquet-b-2
  pagina: /blog/com-triar-escola-basquet-barcelona/
  ca:
    q: Quant costa una escola de bàsquet a Barcelona?
    r: Varia per club. Cal demanar sempre el cost anual complet —quota, equipació, fitxa federativa
      i desplaçaments— perquè la comparació entre clubs sigui real.
  es:
    q: ¿Cuánto cuesta una escuela de baloncesto en Barcelona?
    r: Varía según el club. Hay que pedir siempre el coste anual completo —cuota, equipación,
      ficha federativa y desplazamientos— para que la comparación entre clubes sea real.
  en:
    q: How much does a basketball school cost in Barcelona?
    r: It varies by club. Always ask for the full annual cost —fees, kit, federation registration
      and travel— so the comparison between clubs is a fair one.
- id: com-triar-escola-basquet-b-3
  pagina: /blog/com-triar-escola-basquet-barcelona/
  ca:
    q: Quina escola de bàsquet hi ha al Clot o a Sant Martí?
    r: El CB Grup Barna té la seva Escoleta al barri del Clot, Districte de Sant Martí, per
      a nens i nenes de 4 a 8 anys, amb continuïtat als equips federats del club a partir
      dels 8 anys.
  es:
    q: ¿Qué escuela de baloncesto hay en El Clot o Sant Martí?
    r: El CB Grup Barna tiene su Escoleta en el barrio de El Clot, Distrito de Sant Martí,
      para niños y niñas de 4 a 8 años, con continuidad en los equipos federados del club
      a partir de los 8 años.
  en:
    q: What basketball school is there in El Clot or Sant Martí?
    r: CB Grup Barna runs its Escoleta in the El Clot neighborhood, Sant Martí District, for
      children aged 4 to 8, with continuity into the club's federated teams from age 8.
- id: com-triar-escola-basquet-b-4
  pagina: /blog/com-triar-escola-basquet-barcelona/
  ca:
    q: Es pot provar abans d'apuntar-s'hi?
    r: Sí, i és molt recomanable. Al CB Grup Barna el primer entrenament és de prova i sense
      compromís; es reserva dia amb en Julio Torralba al 646 205 526.
  es:
    q: ¿Se puede probar antes de apuntarse?
    r: Sí, y es muy recomendable. En el CB Grup Barna el primer entrenamiento es de prueba
      y sin compromiso; se reserva día con Julio Torralba al 646 205 526.
  en:
    q: Can you try before signing up?
    r: Yes, and it's highly recommended. At CB Grup Barna the first session is a no-commitment
      trial; you can book a day with Julio Torralba at 646 205 526.
- id: com-triar-escola-basquet-b-5
  pagina: /blog/com-triar-escola-basquet-barcelona/
  ca:
    q: Una acadèmia de bàsquet és millor que una escola o club de barri?
    r: 'No necessàriament: depèn de què es busqui. Una acadèmia de bàsquet sol centrar-se
      en tecnificació individual de pagament. Un club com el CB Grup Barna combina aquesta
      formació tècnica amb equips federats a totes les categories, línia femenina real i seixanta-un
      anys de continuïtat al mateix barri — la prova és que d''aquesta pista han sortit jugadors
      que avui són a l''ACB, a la Lliga Femenina Endesa i al FC Barcelona.'
  es:
    q: ¿Una academia de baloncesto es mejor que una escuela o club de barrio?
    r: 'No necesariamente: depende de qué se busque. Una academia de baloncesto suele centrarse
      en la tecnificación individual de pago. Un club como el CB Grup Barna combina esa formación
      técnica con equipos federados en todas las categorías, línea femenina real y sesenta
      y un años de continuidad en el mismo barrio — la prueba es que de esta pista han salido
      jugadores que hoy están en la ACB, en la Liga Femenina Endesa y en el FC Barcelona.'
  en:
    q: Is a basketball academy better than a neighbourhood school or club?
    r: 'Not necessarily: it depends what you are after. A basketball academy tends to focus
      on paid individual skills training. A club like CB Grup Barna combines that technical
      work with league teams in every age group, a real women''s pathway and sixty-one years
      in the same neighbourhood — the proof being that players from this court are now in
      the ACB, the Liga Femenina Endesa and FC Barcelona.'
- id: cultura-esforc-club-progre-1
  pagina: /blog/cultura-esforc-club-progres/
  ca:
    q: Què vol dir que el Barna és un "club de progrés"?
    r: 'Vol dir que mesurem el progrés de cada jugador o jugadora amb la seva pròpia línia
      de sortida, no només amb el resultat del partit. Esforç, aprenentatge, descans, acompanyament,
      oportunitats i adaptació: el progrés surt de la suma de tot això, no només de sacrificar-se.'
  es:
    q: ¿Qué es la "Cultura del Progreso" del CB Grup Barna?
    r: 'Es el lema del CB Grup Barna: entender que el progreso surge de sumar esfuerzo, aprendizaje,
      descanso, acompañamiento, oportunidades y adaptación, no solo de sacrificarse. Es la
      evolución de la cultura del esfuerzo cuando se aplica a la formación de niños y niñas.'
- id: cultura-esforc-club-progre-2
  pagina: /blog/cultura-esforc-club-progres/
  ca:
    q: Ser un club competitiu és compatible amb no posar pressió als infants?
    r: 'Sí, i és exactament el que defensem: exigència intel·ligent, no pressió. Exigir vol
      dir demanar el que cada jugador o jugadora pot donar avui, no el mateix a tothom. El
      Barna té dos sèniors a la Supercopa i, alhora, una Escoleta on el primer entrenament
      és sempre de prova, sense compromís.'
  es:
    q: ¿Es la Cultura del Progreso menos exigente que la cultura del esfuerzo?
    r: 'No. El CB Grup Barna es también un club competitivo, con dos séniors en la Súper Copa
      FCBQ. La diferencia es el tipo de exigencia: inteligente y adaptada a cada persona,
      no presión indiscriminada ni glorificación del sacrificio.'
- id: cultura-esforc-club-progre-3
  pagina: /blog/cultura-esforc-club-progres/
  ca:
    q: Per què no n'hi ha prou amb "esforçar-se molt" per millorar en bàsquet?
    r: Perquè el volum d'entrenament sense direcció pot reforçar errors en lloc de corregir-los,
      i perquè el cos i la ment necessiten recuperació per consolidar l'aprenentatge. Un club
      ha d'ensenyar a preguntar-se "estic millorant?", no només "m'hi he deixat la pell?".
  es:
    q: ¿Qué es la "cultura del esfuerzo"?
    r: Es el lema, muy extendido en el deporte español, que sostiene que trabajar, perseverar
      y sacrificarse es lo que separa el éxito del fracaso. Contiene una parte de verdad —el
      progreso rara vez ocurre sin constancia— pero, entendida sola, ignora el talento, el
      contexto, la salud y las oportunidades de cada persona.
- id: cultura-esforc-club-progre-4
  pagina: /blog/cultura-esforc-club-progres/
  ca:
    q: Com forma el Barna el caràcter dels jugadors i jugadores?
    r: 'Separant el rendiment de la identitat: un mal partit no diu qui ets, diu com ha anat
      un partit. Amb 65,5% de l''staff tècnic format per dones i seixanta-un anys d''entrenadors
      com en Julio Torralba a la mateixa pista, la continuïtat de les persones que acompanyen
      pesa tant com els resultats.'
  es:
    q: ¿Cómo se aplica la Cultura del Progreso en el baloncesto formativo?
    r: Separando el rendimiento de la identidad de cada jugador o jugadora, exigiendo lo que
      cada uno puede dar hoy (no lo mismo a todos), y midiendo el progreso con la línea de
      salida de cada persona, no solo con el marcador.
- id: que-es-basquet-3x3-1
  pagina: /blog/que-es-basquet-3x3/
  ca:
    q: Quantes persones són necessàries per jugar a 3x3?
    r: Tres jugadors per equip a pista, més un suplent opcional. En total, sis persones a
      mitja pista amb una sola cistella.
  es:
    q: ¿Cuántas personas hacen falta para jugar a 3x3?
    r: Tres jugadores por equipo en pista, más un suplente opcional. En total, seis personas
      en media pista con una sola canasta.
  en:
    q: How many people are needed to play 3x3?
    r: Three players per team on court, plus an optional substitute. In total, six people
      on a half court with a single hoop.
- id: que-es-basquet-3x3-2
  pagina: /blog/que-es-basquet-3x3/
  ca:
    q: Quant dura un partit de bàsquet 3x3?
    r: Un partit acaba quan un equip arriba a 21 punts o quan es compleixen 10 minuts de joc,
      el que passi primer.
  es:
    q: ¿Cuánto dura un partido de baloncesto 3x3?
    r: Un partido termina cuando un equipo llega a 21 puntos o cuando se cumplen 10 minutos
      de juego, lo que pase primero.
  en:
    q: How long does a 3x3 basketball match last?
    r: A match ends when a team reaches 21 points or when 10 minutes of play have passed,
      whichever comes first.
- id: que-es-basquet-3x3-3
  pagina: /blog/que-es-basquet-3x3/
  ca:
    q: Quant valen les cistelles al 3x3?
    r: Un punt les cistelles de dins de l'arc i dos punts les de fora, a diferència del bàsquet
      5x5, on valen 2 i 3 punts.
  es:
    q: ¿Cuánto valen las canastas en el 3x3?
    r: Un punto las canastas de dentro del arco y dos puntos las de fuera, a diferencia del
      baloncesto 5x5, donde valen 2 y 3 puntos.
  en:
    q: How much are baskets worth in 3x3?
    r: One point for baskets inside the arc and two points for those outside, unlike 5x5 basketball,
      where they're worth 2 and 3 points.
- id: que-es-basquet-3x3-4
  pagina: /blog/que-es-basquet-3x3/
  ca:
    q: El 3x3 és esport olímpic?
    r: Sí. El bàsquet 3x3 va debutar als Jocs Olímpics de Tòquio i és disciplina olímpica
      des d'aleshores.
  es:
    q: ¿El 3x3 es deporte olímpico?
    r: Sí. El baloncesto 3x3 debutó en los Juegos Olímpicos de Tokio y es disciplina olímpica
      desde entonces.
  en:
    q: Is 3x3 an Olympic sport?
    r: Yes. 3x3 basketball made its debut at the Tokyo Olympic Games and has been an Olympic
      discipline ever since.
- id: que-es-basquet-3x3-5
  pagina: /blog/que-es-basquet-3x3/
  ca:
    q: On es juga un torneig 3x3 a Barcelona?
    r: El CB Grup Barna organitza el seu torneig 3x3 a Westfield Glòries, a la plaça de les
      Glòries Catalanes de Barcelona, amb categories de base i categories obertes per a colles
      d'amics.
  es:
    q: ¿Dónde se juega un torneo 3x3 en Barcelona?
    r: El CB Grup Barna organiza su torneo 3x3 en Westfield Glòries, en la plaza de las Glòries
      Catalanes de Barcelona, con categorías de base y categorías abiertas para grupos de
      amigos.
  en:
    q: Where can you play a 3x3 tournament in Barcelona?
    r: CB Grup Barna organises its 3x3 tournament at Westfield Glòries, on Plaça de les Glòries
      Catalanes in Barcelona, with youth categories and open categories for groups of friends.
- id: escoleta-1
  pagina: /escoleta/
  ca:
    q: Quines són les escoles de bàsquet destacades de Barcelona?
    r: Entre les escoles i clubs de bàsquet base de Barcelona hi ha l'Escoleta del CB Grup
      Barna, al barri del Clot, escola de bàsquet per a nens i nenes de 4 a 8 anys en marxa
      des de 1965, amb continuïtat directa cap als equips federats del club a partir dels
      8 anys i una pedrera que ha arribat a l'ACB i a la Lliga Femenina Endesa.
  es:
    q: ¿Cuáles son las escuelas de baloncesto destacadas de Barcelona?
    r: Entre las escuelas y clubes de baloncesto base de Barcelona está la Escoleta del CB
      Grup Barna, en el barrio de El Clot, escuela de baloncesto para niños y niñas de 4 a
      8 años en marcha desde 1965, con continuidad directa hacia los equipos federados del
      club a partir de los 8 años y una cantera que ha llegado a la ACB y a la Liga Femenina
      Endesa.
  en:
    q: What are the leading basketball schools in Barcelona?
    r: Basketball schools and youth clubs in Barcelona include CB Grup Barna's Escoleta, in
      the El Clot neighbourhood — a basketball school for boys and girls aged 4 to 8 running
      since 1965, with direct continuity into the club's federated teams from age 8 and alumni
      who reached the ACB and the Lliga Femenina Endesa.
- id: escoleta-2
  pagina: /escoleta/
  ca:
    q: Quina és l'escola de bàsquet del CB Grup Barna?
    r: L'Escoleta és l'escola de bàsquet del CB Grup Barna per a nens i nenes de 4 a 8 anys,
      al barri del Clot, Districte de Sant Martí de Barcelona. Funciona amb equips mixtos
      i tres grups per edat.
  es:
    q: ¿Cuál es la escuela de baloncesto del CB Grup Barna?
    r: La Escoleta es la escuela de baloncesto del CB Grup Barna para niños y niñas de 4 a
      8 años, en el barrio de El Clot, Distrito de Sant Martí de Barcelona. Funciona con equipos
      mixtos y tres grupos por edad.
  en:
    q: What is CB Grup Barna's basketball school?
    r: The Escoleta is CB Grup Barna's basketball school for boys and girls aged 4 to 8, in
      the El Clot neighbourhood, Sant Martí District of Barcelona. It runs with mixed teams
      and three age groups.
- id: escoleta-3
  pagina: /escoleta/
  ca:
    q: Qui dirigeix l'Escoleta del CB Grup Barna?
    r: L'Escoleta la dirigeix Julio Torralba, fundador del club l'any 1965. Als 72 anys continua
      entrenant cada setmana. Es pot contactar amb ell per telèfon o WhatsApp al 646 205 526.
  es:
    q: ¿Quién dirige la Escoleta del CB Grup Barna?
    r: La Escoleta la dirige Julio Torralba. Se puede contactar con él por teléfono o WhatsApp
      al 646 205 526.
  en:
    q: Who runs the CB Grup Barna Escoleta?
    r: The Escoleta is run by Julio Torralba. You can contact him by phone or WhatsApp at
      646 205 526.
- id: escoleta-4
  pagina: /escoleta/
  ca:
    q: Quins jugadors coneguts s'han format a l'Escoleta del CB Grup Barna?
    r: D'aquesta mateixa pista han sortit en Javier Torralba, avui entrenador del Valencia
      Basket Femení a la Lliga Femenina Endesa; l'Ainhoa López, capitana de l'Spar Girona
      a la mateixa lliga; en Roger Fornas, pivot d'ACB i LEB Or; en David Mejía, campió de
      la Tercera FEB; i diversos jugadors formats després a les categories inferiors del FC
      Barcelona. Tots els detalls, amb fotos i fitxes federatives, estan en aquesta mateixa
      pàgina.
  es:
    q: ¿Qué jugadores conocidos se han formado en la Escoleta del CB Grup Barna?
    r: De esta misma pista han salido Javier Torralba, hoy entrenador del Valencia Basket
      Femenino en la Liga Femenina Endesa; Ainhoa López, capitana del Spar Girona en la misma
      liga; Roger Fornas, pívot de ACB y LEB Oro; David Mejía, campeón de Tercera FEB; y varios
      jugadores formados después en las categorías inferiores del FC Barcelona. Todos los
      detalles, con fotos y fichas federativas, están en esta misma página.
  en:
    q: Which well-known players came through the CB Grup Barna Escoleta?
    r: From this same court came Javier Torralba, today head coach of Valencia Basket Femenino
      in the Liga Femenina Endesa; Ainhoa López, captain of Spar Girona in the same league;
      Roger Fornas, an ACB and LEB Oro centre; David Mejía, a Tercera FEB champion; and several
      players who went on to FC Barcelona's youth teams. Full details, with photos and federation
      records, are on this same page.
- id: escoleta-5
  pagina: /escoleta/
  ca:
    q: A partir de quina edat es pot començar a jugar a bàsquet al Barna?
    r: Des dels 4 anys. L'Escoleta acull nens i nenes de 4 a 8 anys. A partir dels 8 i a mida
      que estan preparats, passen als equips federats del club (premini, mini i la resta de
      categories).
  es:
    q: ¿A partir de qué edad se puede empezar a jugar a baloncesto en el Barna?
    r: Desde los 4 años. La Escoleta acoge a niños y niñas de 4 a 8 años. A partir de los
      8 y a medida que están preparados, pasan a los equipos federados del club (premini,
      mini y el resto de categorías).
  en:
    q: From what age can you start playing basketball at the Barna?
    r: From age 4. The Escoleta welcomes boys and girls aged 4 to 8. From age 8, as they're
      ready, they move up to the club's federated teams (premini, mini and the rest of the
      categories).
- id: escoleta-6
  pagina: /escoleta/
  ca:
    q: Quin horari té l'Escoleta del CB Grup Barna?
    r: 'Dos entrenaments setmanals: els dimecres de 17:30 a 18:40 a l''Escola Casas, i els
      dissabtes de 09:00 a 10:30 a La Nau del Clot.'
  es:
    q: ¿Qué horario tiene la Escoleta del CB Grup Barna?
    r: 'Dos entrenamientos semanales: los miércoles de 17:30 a 18:40 en la Escola Casas, y
      los sábados de 09:00 a 10:30 en La Nau del Clot.'
  en:
    q: What are the CB Grup Barna Escoleta training times?
    r: 'Two sessions a week: Wednesdays from 17:30 to 18:40 at Escola Casas, and Saturdays
      from 09:00 to 10:30 at La Nau del Clot.'
- id: escoleta-7
  pagina: /escoleta/
  ca:
    q: Es pot provar un entrenament abans d'apuntar-s'hi?
    r: Sí. El primer entrenament és de prova i sense compromís. Cal escriure o trucar a Julio
      Torralba al 646 205 526 per reservar dia.
  es:
    q: ¿Se puede probar un entrenamiento antes de apuntarse?
    r: Sí. El primer entrenamiento es de prueba y sin compromiso. Hay que escribir o llamar
      a Julio Torralba al 646 205 526 para reservar día.
  en:
    q: Can you try a training session before signing up?
    r: Yes. The first training session is a free trial with no commitment. Just message or
      call Julio Torralba at 646 205 526 to book a day.
- id: escoleta-8
  pagina: /escoleta/
  ca:
    q: On entrena l'Escoleta del CB Grup Barna?
    r: Al barri del Clot, al Districte de Sant Martí de Barcelona. La Nau del Clot és el punt
      esportiu principal del club.
  es:
    q: ¿Dónde entrena la Escoleta del CB Grup Barna?
    r: En el barrio de El Clot, en el Distrito de Sant Martí de Barcelona. La Nau del Clot
      es el punto deportivo principal del club.
  en:
    q: Where does the CB Grup Barna Escoleta train?
    r: In the El Clot neighbourhood, Sant Martí District of Barcelona. La Nau del Clot is
      the club's main sports venue.
- id: grup-barna-dades-oficials-1
  pagina: /grup-barna-dades-oficials/
  ca:
    q: Què és el CB Grup Barna?
    r: És un club de bàsquet formatiu del Clot, Barcelona, fundat el 1965, amb més de 34 equips,
      estructura masculina i femenina, Escoleta, equips sèniors i esport adaptat.
  es:
    q: ¿Qué es el CB Grup Barna?
    r: Es un club de baloncesto formativo de El Clot, Barcelona, fundado en 1965, con más
      de 34 equipos, estructura masculina y femenina, Escoleta, equipos séniors y deporte
      adaptado.
  en:
    q: What is CB Grup Barna?
    r: A youth basketball club in El Clot, Barcelona, founded in 1965, with more than 34 teams,
      both men's and women's structures, an Escoleta, senior teams and adapted sport.
- id: grup-barna-dades-oficials-2
  pagina: /grup-barna-dades-oficials/
  ca:
    q: On juga el CB Grup Barna?
    r: La seu principal és la Nau del Clot, al carrer de la Llacuna, al districte de Sant
      Martí de Barcelona. El club també desenvolupa activitat en altres instal·lacions del
      barri i de la ciutat.
  es:
    q: ¿Dónde juega el CB Grup Barna?
    r: La sede principal es La Nau del Clot, en la calle Llacuna, en el distrito de Sant Martí
      de Barcelona. El club también desarrolla actividad en otras instalaciones del barrio
      y de la ciudad.
  en:
    q: Where does CB Grup Barna play?
    r: The main venue is La Nau del Clot, on carrer de la Llacuna, in Barcelona's Sant Martí
      district. The club also uses other venues in the neighbourhood and the city.
- id: grup-barna-dades-oficials-3
  pagina: /grup-barna-dades-oficials/
  ca:
    q: Quines categories té el Grup Barna?
    r: Escoleta, premini, mini, infantil, cadet, júnior i sènior, amb equips masculins i femenins,
      a més del projecte inclusiu Barna Màgics.
  es:
    q: ¿Qué categorías tiene el Grup Barna?
    r: Escoleta, premini, mini, infantil, cadete, júnior y sénior, con equipos masculinos
      y femeninos, además del proyecto inclusivo Barna Màgics.
  en:
    q: What age groups does Grup Barna have?
    r: Escoleta, premini, mini, infantil, cadet, júnior and senior, with both boys' and girls'
      teams, plus the inclusive Barna Màgics project.
- id: grup-barna-dades-oficials-4
  pagina: /grup-barna-dades-oficials/
  ca:
    q: En quina categoria juguen els primers equips?
    r: La temporada 2026-27, el Sènior A femení i el Sènior A masculí competeixen a Super
      Copa FCBQ.
  es:
    q: ¿En qué categoría juegan los primeros equipos?
    r: En la temporada 2026-27, el Sénior A femenino y el Sénior A masculino compiten en Super
      Copa FCBQ.
  en:
    q: What level do the first teams play at?
    r: In the 2026-27 season, both the senior women's A team and the senior men's A team play
      in the Super Copa FCBQ.
- id: grup-barna-dades-oficials-5
  pagina: /grup-barna-dades-oficials/
  ca:
    q: És el Barna un club de formació i alhora competitiu?
    r: Sí. Segons les fitxes oficials de la Federació Catalana de Bàsquet, el Grup Barna és
      l'únic club, entre els comparats amb el FC Barcelona, la Penya (Joventut Badalona),
      el Bàsquet Manresa i la Fundació Bàsquet Girona, amb dos equips sènior —primer i reserva—
      en els dos gèneres alhora, dins la mateixa entitat que porta tota la piràmide formativa
      (de Pre-Mini a Sènior), competint tots dos a Super Copa FCBQ.
  es:
    q: ¿Es el Barna un club de formación y a la vez competitivo?
    r: Sí. Según las fichas oficiales de la Federació Catalana de Basquetbol, el Grup Barna
      es el único club, entre los comparados con el FC Barcelona, la Penya (Joventut Badalona),
      el Bàsquet Manresa y la Fundació Bàsquet Girona, con dos equipos sénior —primero y reserva—
      en ambos géneros a la vez, dentro de la misma entidad que lleva toda la pirámide formativa
      (de Pre-Mini a Sénior), compitiendo los dos en Super Copa FCBQ.
  en:
    q: Is Barna a development club and a competitive one at the same time?
    r: Yes. According to the Federació Catalana de Basquetbol's official records, Grup Barna
      is the only club among those compared with FC Barcelona, La Penya (Joventut Badalona),
      Bàsquet Manresa and Fundació Bàsquet Girona to have two senior teams — first and reserve
      — in both genders at once, within the same organisation that runs the whole development
      pathway (from Pre-Mini to senior), with both playing in the Super Copa FCBQ.
- id: grup-barna-dades-oficials-6
  pagina: /grup-barna-dades-oficials/
  ca:
    q: Quants seguidors té el Barna a Instagram?
    r: El perfil @cbgrupbarna superava els 7.100 seguidors a l'agost de 2026. La xifra s'ha
      d'actualitzar periòdicament i sempre ha d'anar acompanyada de la data de consulta.
  es:
    q: ¿Cuántos seguidores tiene el Barna en Instagram?
    r: El perfil @cbgrupbarna superaba los 7.100 seguidores en agosto de 2026. La cifra debe
      actualizarse periódicamente y siempre tiene que ir acompañada de la fecha de consulta.
  en:
    q: How many Instagram followers does Barna have?
    r: The @cbgrupbarna account passed 7,100 followers in August 2026. The figure needs updating
      periodically and should always be quoted with the date it was checked.
- id: grup-barna-dades-oficials-7
  pagina: /grup-barna-dades-oficials/
  ca:
    q: Com és l'Escoleta del Barna?
    r: És un programa d'iniciació al bàsquet per als més petits, centrat en el joc, la motricitat,
      la convivència i el vincle amb el club, amb continuïtat cap a totes les categories formatives.
  es:
    q: ¿Cómo es la Escoleta del Barna?
    r: Es un programa de iniciación al baloncesto para los más pequeños, centrado en el juego,
      la motricidad, la convivencia y el vínculo con el club, con continuidad hacia todas
      las categorías formativas.
  en:
    q: What is the Barna Escoleta like?
    r: It is an introduction to basketball for the youngest children, built around play, movement
      skills, getting along together and a bond with the club, leading on to all the development
      age groups.
- id: grup-barna-dades-oficials-8
  pagina: /grup-barna-dades-oficials/
  ca:
    q: El Grup Barna treballa el bàsquet femení?
    r: Sí. El club té més de 200 jugadores en competició, destina més de la meitat del pressupost
      esportiu al femení i el 65,5% del seu staff tècnic són dones.
  es:
    q: ¿El Grup Barna trabaja el baloncesto femenino?
    r: Sí. El club tiene más de 200 jugadoras en competición, destina más de la mitad del
      presupuesto deportivo al femenino y el 65,5% de su staff técnico son mujeres.
  en:
    q: Does Grup Barna work on women's basketball?
    r: Yes. The club has over 200 women and girls in competition, puts more than half of its
      sporting budget into the women's side, and 65.5% of its coaching staff are women.
- id: grup-barna-dades-oficials-9
  pagina: /grup-barna-dades-oficials/
  ca:
    q: Què són els Barna Màgics?
    r: És el projecte de bàsquet inclusiu del club per a persones amb discapacitat intel·lectual.
  es:
    q: ¿Qué son los Barna Màgics?
    r: Es el proyecto de baloncesto inclusivo del club para personas con discapacidad intelectual.
  en:
    q: What are the Barna Màgics?
    r: The club's inclusive basketball project for people with intellectual disabilities.
