<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plantilla · CB Grup Barna</title>
<meta name="description" content="Jugadors i jugadores del CB Grup Barna per equips. Temporada 2025-2026.">
<link rel="canonical" href="https://cbgrupbarna.info/jugadors/">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--red:#C8102E;--black:#0A0A0A;--panel:#141414;--line:rgba(255,255,255,.08);--txt:#F5F5F5;--muted:rgba(255,255,255,.45)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--black);color:var(--txt);font-family:'Outfit',sans-serif}
  header{display:flex;align-items:center;gap:.7rem;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}
  header img{width:38px;height:38px;object-fit:contain}
  header .t{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.06em}
  header .t span{color:var(--red)}
  header a.back{margin-left:auto;color:var(--muted);font-size:.8rem;text-decoration:none}
  .wrap{max-width:960px;margin:0 auto;padding:1.5rem 1.2rem 4rem}
  h1{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;margin-bottom:.2rem}
  h1 span{color:var(--red)}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem}
  .team{margin-top:1.8rem}
  .team h2{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--red);border-bottom:1px solid var(--line);padding-bottom:.35rem;margin-bottom:.8rem}
  .players{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.9rem;display:flex;align-items:center;gap:.8rem}
  .pfoto{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#222;flex:none}
  .dorsal{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--red);min-width:2rem;text-align:center;flex:none}
  .pname{font-weight:500;font-size:.95rem;line-height:1.25}
  .ppos{color:var(--muted);font-size:.75rem}
  .empty{color:var(--muted);padding:2rem 0}
</style>
</head>
<body>
<header>
  <img src="/logo.png" alt="CB Grup Barna">
  <div class="t">CB GRUP <span>BARNA</span></div>
  <a class="back" href="/">← Tornar a la web</a>
</header>
<div class="wrap">
  <h1>LA <span>PLANTILLA</span></h1>
  <div class="sub">Jugadors i jugadores del CB Grup Barna per equips · Temporada 2025-2026</div>
  <div id="roster"><div class="empty">Carregant plantilla…</div></div>
</div>
<script src="/jugadors/jugadors.js"></script>
<script>
  const jug = Array.isArray(window.JUGADORS) ? window.JUGADORS : [];
  const box = document.getElementById('roster');
  if (!jug.length) {
    box.innerHTML = '<div class="empty">Ben aviat publicarem la plantilla. 🏀</div>';
  } else {
    const byTeam = {};
    jug.forEach(j => { (byTeam[j.equip] = byTeam[j.equip] || []).push(j); });
    box.innerHTML = Object.keys(byTeam).sort().map(t => `
      <section class="team">
        <h2>${t}</h2>
        <div class="players">
          ${byTeam[t].map(j => `
            <div class="pcard">
              ${j.foto ? `<img class="pfoto" src="/jugadors/fotos/${j.foto}" alt="${j.nom} ${j.cognoms}">` : `<div class="pfoto"></div>`}
              <div class="dorsal">${j.dorsal ?? ''}</div>
              <div>
                <div class="pname">${j.nom} ${j.cognoms}</div>
                ${j.posicio ? `<div class="ppos">${j.posicio}</div>` : ''}
              </div>
            </div>`).join('')}
        </div>
      </section>`).join('');
  }
</script>
</body>
</html>
