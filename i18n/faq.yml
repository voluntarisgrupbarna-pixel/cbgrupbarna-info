  en:
    q: How many players came to the camp in summer 2026?
    r: Around 150 girls and boys across the six weeks of the 2026 edition, in groups by age
      and level and with a limit of roughly 50 places per week. Players came both from CB
      Grup Barna and from other clubs in Barcelona and the province.
- id: campus-3
  pagina: /campus/
  ca:
    q: Per a quines edats és el campus de bàsquet?
    r: El campus del CB Grup Barna és per a jugadors i jugadores de base, des de l'edat de
      l'Escoleta fins a categories cadet i júnior. Els grups es fan per edat i nivell, de
      manera que un nen o nena que comença no entrena amb qui ja porta anys competint.
  es:
    q: ¿Para qué edades es el campus de baloncesto?
    r: El campus del CB Grup Barna es para jugadores y jugadoras de base, desde la edad de
      la Escoleta hasta categorías cadete y júnior. Los grupos se hacen por edad y nivel,
      de manera que un niño o niña que empieza no entrena con quien ya lleva años compitiendo.
  en:
    q: What ages is the basketball camp for?
    r: The CB Grup Barna camp is for youth players, from Escoleta age up to cadet and junior
      categories. Groups are organised by age and level, so a child who's just starting doesn't
      train alongside someone who's been competing for years.
- id: campus-4
  pagina: /campus/
  ca:
