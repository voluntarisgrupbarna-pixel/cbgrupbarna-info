    r: 'Tecnificació: tir, manejo de pilota, joc d''1x1 i lectura de joc, amb molta repetició
      i correcció individual, seguint la metodologia de treball individual de Time Chamber.
      No és un casal de lleure amb pilota: cada sessió té un objectiu tècnic concret.'
  es:
    q: ¿Qué se trabaja en un campus de Navidad de baloncesto?
    r: 'Tecnificación: tiro, manejo de balón, juego de 1x1 y lectura de juego, con mucha repetición
      y corrección individual, siguiendo la metodología de trabajo individual de Time Chamber.
      No es un casal de ocio con balón: cada sesión tiene un objetivo técnico concreto.'
