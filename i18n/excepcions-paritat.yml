# Pàgines que es poden tocar en un sol idioma, amb el motiu escrit.
#
# La regla general és que un canvi de text es fa als tres idiomes alhora, i
# scripts/i18n-paritat.py atura el que no ho faci. Però hi ha canvis que
# només toquen un idioma amb tota la raó: corregir una falta que només hi ha
# en castellà, ajustar una paraula que en anglès quedava rara, afegir un
# terme de cerca que només té sentit en un mercat.
#
# Aquest fitxer és per a aquests casos. No hi ha manera de saltar-se la
# comprovació sense deixar escrit per què, i això és a propòsit: una llista
# d'excepcions sense motius es converteix, al cap de sis mesos, en la regla.
#
# Posa-hi la ruta CATALANA de la pàgina, que és la que identifica el trio.
#
#   nomes_un_idioma:
#     - ruta: /alguna-pagina/
#       motiu: Per què aquesta pàgina pot anar per lliure.
#
# Quan l'excepció deixi de fer falta, treu-la. És més fàcil treure una línia
# ara que endevinar d'aquí a un any per què hi era.

nomes_un_idioma:
  - ruta: /blog/entrenadores-basquet-barcelona/
    motiu: >
      Auditoria de coherència de dades del 29/08/2026: la versió catalana deia
      «entrenen 38 equips cada setmana», confonent el nombre d'entrenadores
      actives (38) amb el nombre d'equips del club (34+). Les versions es/en
      ja deien «34+ equipos»/«34+ teams» correctament; només calia corregir
      el català perquè torni a quadrar amb la resta.
  - ruta: /club/
    motiu: >
      Mateixa auditoria del 29/08/2026: «38 equips» corregit a «34+ equips»
      per quadrar amb la xifra federativa que fa servir la resta de la web
      (dades-oficials, portada). Les versions es/en ja ho deien bé.
  - ruta: /historia/
    motiu: >
      Mateixa auditoria del 29/08/2026: «38 equips» corregit a «més de 34
      equips». Les versions es/en ja ho deien bé.
  - ruta: /presentacio/
    motiu: >
      Mateixa auditoria del 29/08/2026: «38 equips» corregit a «34+ equips».
      Les versions es/en ja ho deien bé.
