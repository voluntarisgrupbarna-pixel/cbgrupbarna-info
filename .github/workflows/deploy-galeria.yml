name: Deploy Galeria to Vercel + Setup Supabase

on:
  push:
    branches: [main]
    paths:
      - 'galeria/**'
  workflow_dispatch:
    inputs:
      run_db_migration:
        description: 'Executar migració de base de dades'
        required: false
        default: 'false'
        type: boolean

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./galeria

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: galeria/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Setup Supabase schema (first deploy only)
        if: ${{ github.event.inputs.run_db_migration == 'true' }}
        run: |
          npx supabase db push \
            --db-url "${{ secrets.SUPABASE_DB_URL }}" \
            --file ./supabase/schema.sql || echo "Schema already applied or error - check manually"

      - name: Link Vercel project
        run: |
          vercel link --token=${{ secrets.VERCEL_TOKEN }} --yes \
            --project=cbgrupbarna-galeria || true
        continue-on-error: true

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} \
            --env NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --env SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --yes 2>&1 | grep "https://" | tail -1)
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed to: $DEPLOY_URL"

      - name: Comment deployment URL
        if: steps.deploy.outputs.deploy_url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deploy_url }}';
            if (url) {
              console.log(`Galeria desplegada a: ${url}`);
            }
