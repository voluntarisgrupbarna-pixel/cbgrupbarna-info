<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Font de la imatge social (1200×630) · /opina</title>
<style>
  /* Font de la imatge de previsualitzacio que surt quan s'envia
     cbgrupbarna.info/opina per WhatsApp, Instagram o Telegram.
     Per regenerar-la: obre-la al navegador a 1200x630 i fes una captura,
     o mira les instruccions de opina/README.md. */
  @font-face{font-family:'CBGB Display';src:url('BigShoulders-Bold.ttf') format('truetype');font-weight:700}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#050505;color:#fff;
       font-family:'Helvetica Neue',Arial,sans-serif;position:relative}
  body::before{content:'';position:absolute;left:-120px;top:-180px;width:900px;height:700px;
       background:radial-gradient(circle,rgba(226,6,19,.34),transparent 62%)}
  body::after{content:'';position:absolute;left:0;right:0;bottom:0;height:16px;background:#E20613}
  .in{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 72px}
  .top{position:absolute;top:44px;left:72px;display:flex;align-items:center;gap:16px}
  .top img{width:56px;height:56px;object-fit:contain}
  .top .nm{font-family:'CBGB Display',Impact,sans-serif;font-size:38px;letter-spacing:.5px;line-height:1}
  .top .nm span{color:#E20613}
  .eyebrow{display:inline-block;align-self:flex-start;border:2px solid rgba(226,6,19,.55);background:rgba(226,6,19,.12);
       color:#E20613;font-size:16px;font-weight:800;letter-spacing:4px;text-transform:uppercase;padding:9px 20px;border-radius:99px;margin-bottom:22px}
  h1{font-family:'CBGB Display',Impact,sans-serif;font-size:104px;line-height:.86;text-transform:uppercase;letter-spacing:-1px}
  h1 em{font-style:normal;color:#E20613}
  p{font-size:25px;color:#cfcfcf;margin-top:20px;max-width:820px;line-height:1.4}
  p b{color:#fff}
  .foot{position:absolute;left:72px;right:72px;bottom:52px;display:flex;align-items:center;gap:22px}
  .stars{color:#FFC107;font-size:30px;letter-spacing:6px}
  .url{margin-left:auto;font-family:'CBGB Display',Impact,sans-serif;font-size:38px;letter-spacing:.5px}
  .url span{color:#E20613}
</style>
<script src="/scripts/idiomes.js" defer></script>
<script src="/scripts/idioma.js" defer></script>
</head>
<body>
  <div class="top"><img src="../../logo.png" alt=""><div class="nm">CB GRUP <span>BARNA</span></div></div>
  <div class="in">
    <span class="eyebrow">⭐ 1 minut · Google</span>
    <h1>Ens ajudes<br>en <em>1 minut</em>?</h1>
    <p>Deixa la teva ressenya del CB Grup Barna a Google. <b>Ajuda altres famílies a trobar-nos.</b></p>
  </div>
  <div class="foot">
    <span class="stars">★★★★★</span>
    <span class="url">cbgrupbarna.info<span>/opina</span></span>
  </div>
</body>
</html>
