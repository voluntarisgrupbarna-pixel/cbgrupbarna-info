# Com es diu cada entrada del menú del club en castellà i en anglès.
#
# PER QUÈ EXISTEIX. El menú es construeix a js/nav.js a partir d'un mapa
# escrit en català. Fins ara, una pàgina en castellà o en anglès ensenyava
# aquell mapa amb les etiquetes catalanes: els enllaços portaven bé —això ho
# resol i18n/routes.yml— però el text era d'un altre idioma. Aquest fitxer
# només diu el TEXT; les adreces segueixen sortint de routes.yml i no es
# toquen des d'aquí.
#
# D'ON SURT CADA PARAULA. No se n'ha inventat cap. Cada etiqueta ve d'una de
# tres fonts, per aquest ordre:
#
#   1. i18n/glossari.yml, quan és un nom propi que no es tradueix mai
#      (Escoleta, Barna Màgics, Cistella Petita, Premi Dona i Esport) o un
#      terme amb traducció fixada (bàsquet formatiu, sènior, júnior…).
#   2. i18n/etiquetes.yml, el vocabulari tancat dels enllaços. Per això
#      /partits/ es diu «Días de partido» i «Match days» i no «Calendario»
#      ni «Calendar», que hi són com a prohibides.
#   3. El text que el club ja té publicat: l'ancoratge que ja fa servir en
#      aquell idioma, o el títol de la pàgina traduïda.
#
# ES EDITA A MÀ. Qui ho canviï, que torni a passar
# `python3 scripts/genera-nav-i18n.py`, que ho escriu a js/nav-i18n.js.
#
# El català no hi és: és l'original, i viu al mapa de js/nav.js.

# Els títols de les sis columnes, en el mateix ordre que el mapa.
