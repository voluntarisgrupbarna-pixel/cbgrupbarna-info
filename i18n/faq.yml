      pot demanar-ho pel WhatsApp del club, al +34 698 425 153.
  es:
    q: ¿Cuáles son las fechas del campus de Navidad?
    r: Los días laborables de las vacaciones escolares de Navidad. Las fechas exactas y el
      precio de cada edición se publican en esta página y en Instagram (@cbgrupbarna) durante
      el mes de octubre, antes de abrir las inscripciones. Quien quiera el aviso antes de
