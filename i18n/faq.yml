  es:
    q: ¿Para qué edades es el campus de Navidad?
    r: 'Para jugadores y jugadoras de base, desde la edad de la Escoleta hasta categorías
      cadete y júnior. Los grupos se hacen por edad y nivel: quien empieza no entrena con
      quien lleva años compitiendo.'
- id: campus-nadal-basquet-barce-4
  pagina: /campus-nadal-basquet-barcelona/
  ca:
    q: Cal ser del CB Grup Barna per apuntar-s'hi?
